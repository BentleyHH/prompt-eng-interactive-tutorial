<title>ETAF Trainer-Koordination</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ============ TOKENS ============ */
  :root{
    --brand:#3E4852; --brand-600:#2C343C; --brand-050:#EBEDEF; --brand-solid:#3E4852;
    --accent:#D81F26; --accent-050:#FBE6E7;
    --ink:#242B31; --muted:#5C666E; --faint:#8A939A;
    --bg:#F4F5F6; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#E2E5E8;
    --good:#2E9E6B; --good-bg:#E4F3EB;
    --warn:#C77E1E; --warn-bg:#F8ECD7;
    --crit:#D81F26; --crit-bg:#FBE6E7;
    --info:#3B6EA5; --info-bg:#E6EEF6;
    --shadow:0 1px 2px rgba(35,43,49,.06), 0 8px 24px -12px rgba(35,43,49,.20);
    --radius:12px; --radius-sm:8px;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --brand:#AEB9C2; --brand-600:#39444D; --brand-050:#242D35; --brand-solid:#48555F;
      --accent:#F0565C; --accent-050:#3A1F22;
      --ink:#E9EDF0; --muted:#A2ADB5; --faint:#6E7A82;
      --bg:#12171C; --panel:#1A2127; --panel-2:#151B20; --line:#28323A;
      --good:#4FBF87; --good-bg:#123024;
      --warn:#E4A94C; --warn-bg:#33280F;
      --crit:#F0565C; --crit-bg:#3A1F22;
      --info:#6BA6D4; --info-bg:#122636;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --brand:#AEB9C2; --brand-600:#39444D; --brand-050:#242D35; --brand-solid:#48555F;
    --accent:#F0565C; --accent-050:#3A1F22;
    --ink:#E9EDF0; --muted:#A2ADB5; --faint:#6E7A82;
    --bg:#12171C; --panel:#1A2127; --panel-2:#151B20; --line:#28323A;
    --good:#4FBF87; --good-bg:#123024; --warn:#E4A94C; --warn-bg:#33280F;
    --crit:#F0565C; --crit-bg:#3A1F22; --info:#6BA6D4; --info-bg:#122636;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --brand:#3E4852; --brand-600:#2C343C; --brand-050:#EBEDEF; --brand-solid:#3E4852;
    --accent:#D81F26; --accent-050:#FBE6E7;
    --ink:#242B31; --muted:#5C666E; --faint:#8A939A;
    --bg:#F4F5F6; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#E2E5E8;
    --good:#2E9E6B; --good-bg:#E4F3EB; --warn:#C77E1E; --warn-bg:#F8ECD7;
    --crit:#D81F26; --crit-bg:#FBE6E7; --info:#3B6EA5; --info-bg:#E6EEF6;
    --shadow:0 1px 2px rgba(35,43,49,.06), 0 8px 24px -12px rgba(35,43,49,.20);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3{text-wrap:balance;margin:0}
  .tnum{font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent);color:#fff}

  /* language switch */
  .langsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .langsw button{border:none;background:transparent;padding:5px 10px;font-size:12px;
    font-weight:700;color:var(--muted);letter-spacing:.03em}
  .langsw button.on{background:var(--brand-050);color:var(--brand)}
  .langsw button:hover:not(.on){color:var(--ink)}
  /* toggle switch */
  .sw{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s;cursor:pointer}
  .sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+span{background:var(--good)}
  .sw input:checked+span::before{transform:translateX(20px)}

  /* ============ LOGIN ============ */
  #lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:
      radial-gradient(120% 90% at 80% -10%, var(--brand-050), transparent 55%),
      var(--bg);padding:24px}
  .lock-card{width:min(380px,94vw);background:var(--panel);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow);padding:34px 30px 28px;text-align:center}
  .lg-top{display:flex;justify-content:flex-end;margin:-10px -8px 2px}
  .etaf{display:inline-flex;align-items:flex-end;gap:.1em;line-height:.85;font-weight:800;
    letter-spacing:-.05em;color:var(--ink);font-family:var(--sans);font-style:normal}
  .etaf .rd{width:.24em;height:.24em;border-radius:50%;background:var(--accent);
    margin-bottom:.08em;flex:none}
  .wm-sub{color:var(--faint);font-weight:650;font-size:11px;letter-spacing:.18em;
    margin-top:12px;text-transform:uppercase}
  .lock-card h1{font-size:19px;margin:18px 0 4px;letter-spacing:-.01em}
  .lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  .pin-dots span{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);
    transition:.15s}
  .pin-dots span.on{background:var(--brand);border-color:var(--brand);transform:scale(1.05)}
  .pin-dots.err span{border-color:var(--crit);animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keys button{height:56px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel-2);font-size:21px;font-weight:600;color:var(--ink);
    transition:.12s}
  .keys button:hover{background:var(--brand-050);border-color:var(--brand)}
  .keys button:active{transform:scale(.95)}
  .keys button.ghost{border:none;background:transparent;font-size:13px;color:var(--muted);font-weight:600}
  .lock-hint{margin-top:18px;font-size:12px;color:var(--faint)}
  .lock-hint b{color:var(--muted);font-family:var(--mono);letter-spacing:.1em}

  /* ============ APP SHELL ============ */
  #app{display:none;min-height:100vh;grid-template-columns:236px 1fr}
  @media(max-width:820px){#app{grid-template-columns:1fr}}
  .side{background:var(--panel);border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  @media(max-width:820px){.side{display:none}}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:9px 11px;border:none;background:transparent;border-radius:9px;color:var(--muted);
    font-size:14px;font-weight:550}
  .nav button svg{width:18px;height:18px;flex:none;opacity:.85}
  .nav button:hover{background:var(--panel-2);color:var(--ink)}
  .nav button.active{background:var(--brand-050);color:var(--brand);font-weight:650}
  .nav .badge{margin-left:auto;font-size:11px;background:var(--crit-bg);color:var(--crit);
    padding:1px 7px;border-radius:20px;font-weight:700}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
  .side-foot .langrow{display:flex;align-items:center;justify-content:space-between;padding:2px 10px 6px}
  .side-foot .langrow span{font-size:12px;color:var(--faint);font-weight:600}
  .side-foot button.lnk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:none;
    background:transparent;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600}
  .side-foot button.lnk:hover{background:var(--panel-2);color:var(--ink)}

  main{min-width:0;padding:0 0 60px}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:14px 30px;display:flex;align-items:center;gap:14px}
  @media(max-width:820px){.topbar{padding:12px 16px}}
  .topbar h2{font-size:17px;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;
    align-items:center;gap:7px;transition:.12s;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  .btn.primary:hover{background:var(--brand-600);color:#fff}
  .btn.amber{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.amber:hover{filter:brightness(1.05);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn svg{width:15px;height:15px}

  .wrap{padding:24px 30px;max-width:1200px}
  @media(max-width:820px){.wrap{padding:18px 16px}}
  .view{display:none}.view.on{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}}

  /* ============ CARDS / KPI ============ */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .val{font-size:30px;font-weight:750;margin-top:6px;letter-spacing:-.02em}
  .kpi .val small{font-size:15px;color:var(--faint);font-weight:600}
  .kpi .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi.g .rail{background:var(--good)} .kpi.w .rail{background:var(--warn)}
  .kpi.c .rail{background:var(--crit)} .kpi.i .rail{background:var(--info)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:20px}
  .panel-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .panel-h h3{font-size:15px;letter-spacing:-.01em}
  .panel-h .sub{color:var(--muted);font-size:12.5px}
  .panel-b{padding:16px 18px}

  /* status pills */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
    font-size:12px;font-weight:650;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.good{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}
  .pill.info{background:var(--info-bg);color:var(--info)}
  .pill.neutral{background:var(--panel-2);color:var(--muted)}

  /* ============ 20-WEEK HEATMAP ============ */
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .wk{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel-2);
    cursor:pointer;transition:.12s;position:relative}
  .wk:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
  .wk .kw{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.04em}
  .wk .loc{font-size:13px;font-weight:650;margin:3px 0 8px;letter-spacing:-.01em}
  .wk .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
  .wk .bar i{display:block;height:100%;border-radius:4px}
  .wk .cnt{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
  .wk .flag{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}

  /* ============ TABLE / LISTS ============ */
  .row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em}
  .row .nm{font-weight:640;font-size:14px}
  .row .meta{font-size:12.5px;color:var(--muted)}
  .rowgrow{flex:1;min-width:0}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
  .tag{font-size:11px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    padding:1px 8px;border-radius:6px;font-weight:600}
  .fit{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brand);
    background:var(--brand-050);padding:2px 7px;border-radius:6px}

  /* attention list */
  .att{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .att:last-child{border:none}
  .att .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .att .ic.c{background:var(--crit-bg);color:var(--crit)}
  .att .ic.w{background:var(--warn-bg);color:var(--warn)}

  /* ============ TRAINING DETAIL ============ */
  .split{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border:none}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:600;text-align:right}
  .slot-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
  .slot-head .c{font-size:13px;color:var(--muted)}

  /* ============ SLIDE-OVER (composer) ============ */
  .scrim{position:fixed;inset:0;background:rgba(6,16,18,.42);z-index:40;opacity:0;
    pointer-events:none;transition:.2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);
    z-index:41;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);transform:translateX(100%);
    transition:.26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .sheet.on{transform:none}
  .sheet-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .sheet-h h3{font-size:16px}
  .sheet-b{padding:18px 20px;overflow:auto;flex:1}
  .sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  label.fld{display:block;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin:14px 0 6px}
  .fldrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .inp,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px}
  textarea{min-height:230px;resize:vertical;line-height:1.6;font-size:13.5px}
  .inp:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel-2);padding:5px 11px;border-radius:20px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .recip{display:flex;align-items:center;gap:8px;background:var(--brand-050);color:var(--brand);
    padding:5px 10px;border-radius:20px;font-size:13px;font-weight:640}
  .rte{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
  .rte button{border:1px solid var(--line);background:var(--panel-2);width:32px;height:30px;
    border-radius:7px;font-size:13px;font-weight:700;color:var(--muted)}
  .rte button:hover{border-color:var(--brand);color:var(--brand)}

  /* toast */
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:60;
    background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:11px;font-size:13.5px;
    font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;
    display:flex;align-items:center;gap:9px;max-width:90vw}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .empty{color:var(--faint);font-size:13.5px;padding:22px;text-align:center}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .mob-nav{display:none}
  @media(max-width:820px){
    .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);
      border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
    .mob-nav button{flex:1;border:none;background:transparent;color:var(--muted);font-size:10.5px;
      font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px}
    .mob-nav button svg{width:20px;height:20px}
    .mob-nav button.active{color:var(--brand)}
    main{padding-bottom:76px}
  }
</style>

<!-- ===================== LOGIN ===================== -->
<div id="lock">
  <div class="lock-card">
    <div class="lg-top"><span class="langsw" id="lgLang"></span></div>
    <div class="etaf" style="font-size:46px">ETAF<span class="rd"></span></div>
    <div class="wm-sub" id="lgSub">Trainer-Koordination</div>
    <h1 id="lgWelcome" style="margin-top:22px">Willkommen zurück</h1>
    <p id="lgEnter">Bitte 6-stelligen PIN eingeben</p>
    <div class="pin-dots" id="dots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="keys" id="keys"></div>
    <div class="lock-hint" id="lgHint"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <aside class="side">
    <div class="brand"><span class="etaf" style="font-size:26px">ETAF<span class="rd"></span></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="langrow"><span id="langLbl">Sprache</span><span class="langsw" id="sideLang"></span></div>
      <button class="lnk" onclick="toggleTheme()" id="themeBtn">◐ Design wechseln</button>
      <button class="lnk" onclick="lockNow()" id="lockBtn">⎋ Sperren</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="tt">Übersicht</h2>
        <div class="sub" id="ts"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn amber" onclick="openQuick()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <span id="qrLabel">Schnell-Ersatz</span>
      </button>
      <button class="btn primary" onclick="openImport()" id="impBtn">＋ Import</button>
    </div>

    <div class="wrap">
      <section class="view on" id="v-dash"></section>
      <section class="view" id="v-trainings"></section>
      <section class="view" id="v-detail"></section>
      <section class="view" id="v-trainers"></section>
      <section class="view" id="v-templates"></section>
      <section class="view" id="v-automation"></section>
    </div>
  </main>
</div>

<nav class="mob-nav" id="mobnav"></nav>

<!-- composer slide-over -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet">
  <div class="sheet-h">
    <h3 id="sheetTitle">Anfrage senden</h3>
    <div class="spacer"></div>
    <button class="btn sm" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f" id="sheetFoot"></div>
</aside>

<div id="toast"></div>

<!-- Optional: nur auf dem Server vorhanden. Aktiviert den Live-Modus (PHP+MySQL). -->
<script src="config.js" onerror="/* Demo-Modus: keine config.js vorhanden */"></script>
<script>
/* ============================================================
   ETAF Trainer-Koordination — klickbarer Prototyp
   Demo: Daten liegen im Browser (localStorage). DE/EN Oberfläche,
   E-Mail-Sprache pro Anfrage wählbar.
   ============================================================ */

   LIVE-MODUS — spricht mit dem PHP-Backend (config.js gesetzt).
   Ohne config.js läuft alles als lokale Demo (localStorage).
   ============================================================ */
const API=(window.ETAF&&window.ETAF.apiBase)?String(window.ETAF.apiBase).replace(/\/$/,''):null;
const LIVE=!!API;
let AUTH=""; try{AUTH=localStorage.getItem("etaf_token")||"";}catch(e){}
let pollTimer=null;
async function apiCall(action,payload){
  const r=await fetch(API+"/api.php?action="+encodeURIComponent(action),{
    method:"POST", headers:{"Content-Type":"application/json","X-Auth-Token":AUTH},
    body:JSON.stringify(payload||{})});
  let d; try{d=await r.json();}catch(e){d={ok:false,error:"HTTP "+r.status};}
  if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
  return d;
}
async function pull(){
  const d=await apiCall("state");
  S.trainers=d.trainers; S.trainings=d.trainings; S.templates=d.templates;
}
function startPolling(){
  if(!LIVE||pollTimer)return;
  const ms=(window.ETAF&&window.ETAF.pollMs)||8000;
  pollTimer=setInterval(async()=>{
    try{ await pull();
      if(route==="dash")renderDash();
      else if(route==="detail")renderDetail();
      else if(route==="trainings")renderTrainings();
      buildNav();
    }catch(e){}
  }, ms);
}
function stopPolling(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }

let S=load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem("etaf_demo"));
    if(r&&r.trainers){
      r.lang=r.lang||"de"; r.emailLang=r.emailLang||"en";
      r.settings=r.settings||{reminder_hours:48,escalate_hours:72,auto_advance:false};
      if(!r.templates||!r.templates[0]||!r.templates[0].de)r.templates=TEMPLATES;
      return r;
    }
  }catch(e){}
  return {lang:"de", emailLang:"en", trainers:seedTrainers(), trainings:seedTrainings(),
    templates:TEMPLATES, settings:{reminder_hours:48,escalate_hours:72,auto_advance:false}};
}
function save(){localStorage.setItem("etaf_demo",JSON.stringify(S));}
function resetDemo(){localStorage.removeItem("etaf_demo");S=load();applyStatic();render();toast(t("resetToast"));}

/* ---------- MATCHING (simulierte KI-Vorauswahl) ---------- */
function scoreTrainer(tr,tg){
  let s=40;
  if(tr.spec.includes(tg.spec))s+=34; else if(tr.spec.some(x=>SPEC.indexOf(x)%2===SPEC.indexOf(tg.spec)%2))s+=10;
  if(tg.country==="UAE"&&tr.uae)s+=14;
  if(tg.country==="UAE"&&tr.langs.includes("AR"))s+=6;
  if(tg.country!=="UAE"&&tr.region.startsWith("DE"))s+=8;
  s+=(3-tr.load)*4;
  s+=(parseFloat(tr.rating)-4)*10;
  return Math.max(35,Math.min(99,Math.round(s)));
}
function ranked(tg){
  return S.trainers.map(tr=>{const e=tg.roster.find(r=>r.trainerId===tr.id)||{};
    return {tr,fit:scoreTrainer(tr,tg),status:e.status||null,reminded:!!e.reminded};})
    .sort((a,b)=>b.fit-a.fit);
}
function rosterStats(tg){
  const yes=tg.roster.filter(r=>r.status==="yes"||r.status==="confirmed").length;
  const maybe=tg.roster.filter(r=>r.status==="maybe").length;
  const asked=tg.roster.filter(r=>r.status==="asked").length;
  return {yes,maybe,asked,need:tg.need};
}
function statusOf(tg){
  const{yes,need}=rosterStats(tg);
  if(yes>=need)return{cls:"good",key:"st_full"};
  if(yes>=Math.ceil(need*0.6))return{cls:"warn",key:"st_partial"};
  if(yes>0||rosterStats(tg).asked>0)return{cls:"warn",key:"st_req"};
  return{cls:"crit",key:"st_under"};
}

/* ============================================================
   LOGIN
   ============================================================ */
let pin="";
function buildKeys(){
  const k=$("#keys");
  const layout=["1","2","3","4","5","6","7","8","9","clear","0","del"];
  k.innerHTML=layout.map(x=>{
    if(x==="clear")return `<button class="ghost" data-k="clear">${t("keyClear")}</button>`;
    if(x==="del")return `<button class="ghost" data-k="del">←</button>`;
    return `<button data-k="${x}">${x}</button>`;
  }).join("");
  $$("#keys button").forEach(b=>b.onclick=()=>press(b.dataset.k));
}
function press(k){
  if(k==="clear"){pin="";}
  else if(k==="del"){pin=pin.slice(0,-1);}
  else if(pin.length<6){pin+=k;}
  drawDots();
  if(pin.length===6)setTimeout(tryUnlock,140);
}
function drawDots(){$$("#dots span").forEach((s,i)=>s.classList.toggle("on",i<pin.length));}
function pinError(){const d=$("#dots");d.classList.add("err");setTimeout(()=>d.classList.remove("err"),450);pin="";drawDots();}
async function tryUnlock(){
  if(pin.length!==6){pinError();return;}
  if(LIVE){
    try{
      const d=await apiCall("login",{pin});
      AUTH=d.token; try{localStorage.setItem("etaf_token",AUTH);}catch(e){}
      await pull(); unlock();
    }catch(e){ pinError(); toast(e.message||"Login fehlgeschlagen","crit"); }
  } else { unlock(); }
}
function unlock(){$("#lock").style.display="none";$("#app").style.display="grid";render();startPolling();}
function lockNow(){stopPolling();pin="";drawDots();$("#lock").style.display="grid";$("#app").style.display="none";}
document.addEventListener("keydown",e=>{
  if($("#lock").style.display==="none")return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==="Backspace")press("del");
});

const NAV=[{id:"dash",ic:IC.dash},{id:"trainings",ic:IC.cal},{id:"trainers",ic:IC.users},{id:"templates",ic:IC.mail},{id:"automation",ic:IC.auto}];
let route="dash";

  const crit=S.trainings.filter(t=>statusOf(t).cls==="crit").length;
  $("#nav").innerHTML=NAV.map(n=>`
    <button class="${n.id===route?'active':''}" onclick="go('${n.id}')">

function titleFor(r){
  const m={dash:["tp_dash","tp_dashSub"],trainings:["tp_trn","tp_trnSub"],
    trainers:["tp_pool","tp_poolSub"],templates:["tp_tpl","tp_tplSub"],
    automation:["tp_auto","tp_autoSub"]};
  const k=m[r]||m.dash; return [t(k[0]),t(k[1])];
}
function go(r){route=r;render();}
function render(){
  buildNav();

  else if(route==="trainings"){renderTrainings();$("#v-trainings").classList.add("on");}
  else if(route==="detail"){renderDetail();$("#v-detail").classList.add("on");}
  else if(route==="trainers"){renderTrainers();$("#v-trainers").classList.add("on");}

    </div>

  const need=T.map(tg=>({tg,s:statusOf(tg),r:rosterStats(tg)}))

        <div class="rowgrow">
          <div class="nm">${x.tg.topic}</div>
          <div class="meta">${x.tg.city} · ${x.tg.kw} · ${x.r.yes}/${x.r.need} ${t("confirmedShort")}${x.r.asked?` · ${x.r.asked} ${t("askedShort")}`:''}</div>
        </div>
        <span class="pill ${x.s.cls}">${t(x.s.key)}</span>
        <button class="btn sm primary" onclick="openDetail('${x.tg.id}')">${t("open")}</button>
      </div>`).join(""):`<div class="empty">${t("attAll")}</div>`}</div>

function rosterRow(x,tg){
  const acts=x.status==="asked"
    ? (LIVE ? "" : `<button class="btn sm" onclick="simReply('${tg.id}','${x.tr.id}')" title="${t("simReplyT")}">↩ ${t("simReply")}</button>`)

    : x.status==="no"
    ? `<button class="btn sm" onclick="requestNext('${tg.id}')">${t("nextInLine")}</button>`
    : "";
  return `<div class="row">
    <div class="av" style="background:${x.tr.color}">${initials(x.tr.name)}</div>

function setStatus(tgId,trId,status){
  const tg=S.trainings.find(x=>x.id===tgId);
  const e=tg.roster.find(r=>r.trainerId===trId);
  if(e)e.status=status;else tg.roster.push({trainerId:trId,status});
  save();
}
function simReply(tgId,trId){
  const roll=Math.random();
  const status=roll<0.62?"yes":roll<0.82?"maybe":"no";
  setStatus(tgId,trId,status);
  const tr=S.trainers.find(x=>x.id===trId);
  toast(`${tr.name.split(" ").slice(-1)}: ${spLabel(status)}`, status==="yes"?"good":status==="no"?"crit":"warn");
  renderDetail();buildNav();
}
function requestNext(tgId){
  const tg=S.trainings.find(x=>x.id===tgId);
  const next=ranked(tg).find(x=>!x.status);
  if(next){composeFor(tgId,next.tr.id,'t1');}
  else toast(t("noMore"),"warn");
}

/* ============================================================

let compose={tgId:null,recips:[],tplId:"t1",lang:"en"};
function fillTpl(str,tg,tr){
  return str
    .replace(/{{firstName}}/g,tr?tr.name.replace(/^Dr\.\s*/,"").split(" ")[0]:"{{firstName}}")
    .replace(/{{topic}}/g,tg.topic).replace(/{{city}}/g,tg.city)
    .replace(/{{country}}/g,tg.country).replace(/{{kw}}/g,tg.kw)
    .replace(/{{month}}/g,tg.month).replace(/{{teamSize}}/g,tg.need);
}
function composeFor(tgId,trId,tplId){
  const tg=S.trainings.find(t=>t.id===tgId);
  compose={tgId,recips:trId?[trId]:ranked(tg).filter(x=>!x.status).slice(0,tg.need).map(x=>x.tr.id),
    tplId:tplId||"t1", lang:S.emailLang||"en"};
  drawComposer();openSheet();
}
function setComposeLang(l){compose.lang=l;S.emailLang=l;save();drawComposer();}
function drawComposer(){
  const tg=S.trainings.find(t=>t.id===compose.tgId);
  const tpl=S.templates.find(t=>t.id===compose.tplId);
  const v=tpl[compose.lang];
  const first=compose.recips.length===1?S.trainers.find(t=>t.id===compose.recips[0]):null;
  const recipChips=compose.recips.map(id=>{const tr=S.trainers.find(t=>t.id===id);
    return `<span class="recip">${initials(tr.name)} · ${tr.name.split(" ").slice(-1)}
      <span style="cursor:pointer;opacity:.6" onclick="rmRecip('${id}')">✕</span></span>`}).join("");

  $("#sheetBody").innerHTML=`
    <label class="fld">${t("from")}</label>
    <input class="inp" value="trainer@etaf-akademie.org" readonly style="color:var(--muted)">
    <label class="fld">${t("to",compose.recips.length)}</label>
    <div class="chips">${recipChips||`<span class="meta">${t("noRecip")}</span>`}</div>
    <div class="fldrow">
      <label class="fld">${t("emailLang")}</label>
      <span class="langsw">
        <button onclick="setComposeLang('de')" class="${compose.lang==='de'?'on':''}">DE</button>
        <button onclick="setComposeLang('en')" class="${compose.lang==='en'?'on':''}">EN</button>
      </span>
    </div>
    <label class="fld">${t("template")}</label>
    <div class="chips">${S.templates.map(tp=>`<span class="chip ${tp.id===compose.tplId?'on':''}" onclick="pickTpl('${tp.id}')">${tp[compose.lang].name}</span>`).join("")}</div>
    <label class="fld">${t("subject")}</label>
    <input class="inp" id="cSubj" value="${esc(fillTpl(v.subject,tg,first))}">
    <label class="fld">${t("message")}</label>
    <div class="rte">
      <button onclick="wrap('**')" title="${t("boldT")}">B</button>
      <button onclick="wrap('_')" title="${t("italicT")}"><i>I</i></button>
      <button onclick="ins('\\n• ')" title="${t("listT")}">•</button>
      <button onclick="insResp()" title="${t("btnsT")}">⛶</button>
    </div>
    <textarea id="cBody">${esc(fillTpl(v.body,tg,first))}</textarea>
    <div class="meta" style="margin-top:8px">${t("composerHint")}</div>`;

}
function pickTpl(id){compose.tplId=id;drawComposer();}
function rmRecip(id){compose.recips=compose.recips.filter(x=>x!==id);drawComposer();}
function wrap(m){const el=$("#cBody");const s=el.selectionStart,e=el.selectionEnd;
  el.value=el.value.slice(0,s)+m+el.value.slice(s,e)+m+el.value.slice(e);el.focus();}
function ins(x){const el=$("#cBody");const s=el.selectionStart;
  el.value=el.value.slice(0,s)+x+el.value.slice(s);el.focus();}
function insResp(){ins(RESP[compose.lang]);}
async function sendCompose(){
  const subject=$("#cSubj")?$("#cSubj").value:"";
  const bodyText=$("#cBody")?$("#cBody").value:"";
  const n=compose.recips.length;
  if(LIVE){
    const tgId=compose.tgId, recips=compose.recips.slice(), lang=compose.lang;
    closeSheet();
    try{
      const d=await apiCall("request.create",{training:tgId,recipients:recips,lang,subject,body:bodyText});
      await pull(); buildNav();
      if(route==="detail")renderDetail(); if(route==="dash")renderDash();
      toast(t("sentToast",d.sent!=null?d.sent:n),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  compose.recips.forEach(id=>setStatus(compose.tgId,id,"asked"));
  closeSheet();
  toast(t("sentToast",n),"good");
  if(route==="detail")renderDetail();
  buildNav();
  compose.recips.forEach((id,i)=>{
    setTimeout(()=>{
      if(Math.random()<0.7){
        const roll=Math.random();const st=roll<0.6?"yes":roll<0.82?"maybe":"no";
        setStatus(compose.tgId,id,st);
        const tr=S.trainers.find(t=>t.id===id);
        toast(`↩ ${tr.name.split(" ").slice(-1)}: ${spLabel(st)}`,st==="yes"?"good":st==="no"?"crit":"warn");
        if(route==="detail")renderDetail();
        if(route==="dash")renderDash();
        buildNav();
      }
    }, 2600+i*1500+Math.random()*1500);
  });
}

function openQuick(tgId){
  const tg=tgId?S.trainings.find(t=>t.id===tgId):S.trainings.find(t=>statusOf(t).cls!=="good")||S.trainings[0];
  const pool=ranked(tg).filter(x=>!x.status||x.status==="no").slice(0,5);
  $("#sheetTitle").textContent=t("quickTitle");
  $("#sheetBody").innerHTML=`
    <div class="meta" style="margin-bottom:12px">${t("quickDesc")}</div>
    <label class="fld">${t("trainingLbl")}</label>
    <select id="qTg">${S.trainings.map(x=>`<option value="${x.id}" ${x.id===tg.id?'selected':''}>${x.topic} — ${x.city} (${x.kw})</option>`).join("")}</select>
    <label class="fld">${t("replCand")}</label>
    ${pool.map(x=>`<div class="row">
      <div class="av" style="background:${x.tr.color}">${initials(x.tr.name)}</div>
      <div class="rowgrow"><div class="nm">${x.tr.name}</div><div class="meta">${x.tr.region} · ${x.tr.spec[0]} · ⚡ ${t("reachable")}</div></div>
      <span class="fit">${x.fit}%</span></div>`).join("")}`;

    <button class="btn amber" onclick="sendQuick()">${t("sendBlitz")}</button>`;

}
async function sendQuick(){
  const tgId=$("#qTg").value;const tg=S.trainings.find(t=>t.id===tgId);
  const pool=ranked(tg).filter(x=>!x.status||x.status==="no").slice(0,5);
  if(LIVE){
    const lang=S.emailLang||"en"; const tpl=S.templates.find(t=>t.id==="t3")||S.templates[0];
    closeSheet();
    try{
      const d=await apiCall("request.create",{training:tgId,recipients:pool.map(x=>x.tr.id),lang,
        subject:tpl[lang].subject, body:tpl[lang].body});
      await pull(); buildNav();
      if(route==="detail"){curTg=S.trainings.find(t=>t.id===tgId);renderDetail();}
      if(route==="dash")renderDash();
      toast(t("blitzToast",d.sent!=null?d.sent:pool.length),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  pool.forEach(x=>setStatus(tgId,x.tr.id,"asked"));
  closeSheet();toast(t("blitzToast",pool.length),"good");
  buildNav();if(route==="detail"){curTg=tg;renderDetail();}if(route==="dash")renderDash();
}

/* ============================================================
   IMPORT (mock)
   ============================================================ */
let importProfiles=[];
const IMPORT_SAMPLE="Dr. Amir Haddad — Implantologie, Guided Surgery. Sprachen: DE, EN, AR. Region: UAE. Viel Erfahrung in Abu Dhabi.\nDr. Lena Vogt, DNA-Diagnostik & Prothetik, DE-West, DE/EN, Bewertung 4.7\nDr. Youssef Karim, Fingerprint Dental, UAE, EN/AR";
function openImport(){
  importProfiles=[];
  $("#sheetTitle").textContent=t("importTitle");
  $("#sheetBody").innerHTML=`
    <div class="meta" style="margin-bottom:10px">${t("importDesc")}</div>
    ${LIVE?'':`<div class="meta" style="margin-bottom:10px">${t("importNoAI")}</div>`}
    <label class="fld">${t("importPaste")}</label>
    <textarea id="impText" style="min-height:150px">${LIVE?'':esc(IMPORT_SAMPLE)}</textarea>
    <div id="impResult"></div>`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("close")}</button><div class="spacer"></div>
    <button class="btn primary" id="impBtnAnalyze" onclick="runImportAnalyze()">✨ ${t("importAnalyze")}</button>`;
  openSheet();
}
async function runImportAnalyze(){
  const text=($("#impText")?$("#impText").value:"").trim();
  if(!text){toast(t("importErr"),"warn");return;}
  const btn=$("#impBtnAnalyze"); if(btn){btn.disabled=true;btn.textContent="… "+t("importAnalyzing");}
  try{
    if(LIVE){ const d=await apiCall("ai.extract",{text}); importProfiles=d.profiles||[]; }
    else { importProfiles=demoExtract(text); await new Promise(r=>setTimeout(r,500)); }
    drawImportReview();
  }catch(e){ toast(t("importErr")+": "+e.message,"crit"); if(btn){btn.disabled=false;btn.textContent="✨ "+t("importAnalyze");} }
}
function demoExtract(text){
  const SP=["Implantologie","DNA-Diagnostik","Fingerprint Dental","Prothetik","Guided Surgery","Parodontologie","Chirurgie"];
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).slice(0,8).map(line=>{
    const name=(line.match(/Dr\.?\s+[A-Za-zÄÖÜäöü'\-]+\s+[A-Za-zÄÖÜäöü'\-]+/)||[line.split(/[,—-]/)[0].trim()])[0];
    const spec=SP.filter(s=>line.toLowerCase().includes(s.toLowerCase().slice(0,6)));
    const langs=(line.match(/\b(DE|EN|AR)\b/g)||[]).filter((v,i,a)=>a.indexOf(v)===i);
    const uae=/uae|abu dhabi|dubai/i.test(line);
    const reg=(line.match(/DE-(Süd|West|Nord)|AT|CH|UAE|UK/)||[uae?"UAE":"DE-West"])[0];
    const rate=(line.match(/([45]\.\d)/)||["4.5"])[0];
    return {name:name.trim(),email:"",phone:"",spec:spec.length?spec:[SP[0]],region:reg,langs:langs.length?langs:["DE","EN"],uae,rating:rate};
  });
}
function drawImportReview(){
  const n=importProfiles.length;
  $("#impResult").innerHTML=`
    <label class="fld">${t("importReview")} · ${t("importFound",n)}</label>
    ${importProfiles.map((p,i)=>`
      <div class="row">
        <div class="av" style="background:var(--brand-solid)">${initials(p.name||"?")}</div>
        <div class="rowgrow"><div class="nm">${esc(p.name||"—")}</div>
          <div class="meta">${(p.spec||[]).join(", ")} · ${esc(p.region||"")} · ${(p.langs||[]).join("/")}${p.uae?" · UAE":""} · ⭐ ${esc(p.rating||"4.5")}</div></div>
        <button class="btn sm" onclick="rmImport(${i})">✕</button>
      </div>`).join("")}`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("cancel")}</button><div class="spacer"></div>
    <button class="btn primary" onclick="applyImport()">${t("importApply",n)}</button>`;
}
function rmImport(i){importProfiles.splice(i,1);drawImportReview();}
async function applyImport(){
  const profs=importProfiles.slice(); const n=profs.length;
  if(!n){closeSheet();return;}
  if(LIVE){
    try{ const d=await apiCall("trainers.bulkCreate",{profiles:profs}); await pull();
      closeSheet(); if(route==="trainers")renderTrainers(); toast(t("importCreated",d.created!=null?d.created:n),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  const COL=["#3E4852","#B23A42","#4E6E8E","#6E5A86","#3F7A5E","#A6642E","#557088","#8A5A52"];
  profs.forEach((p,i)=>S.trainers.push({id:uid("tr"),name:p.name||"—",email:p.email||"",phone:p.phone||"",
    spec:p.spec||[],region:p.region||"",langs:p.langs||[],uae:!!p.uae,load:0,
    color:COL[i%COL.length],rating:String(p.rating||"4.5")}));
  save();closeSheet();if(route==="trainers")renderTrainers();toast(t("importCreated",n),"good");
}

/* ============================================================
   AUTOMATION (Erinnerungen + Nachrücken)
   ============================================================ */
function renderAutomation(){
  if(LIVE && !S._settingsLoaded){
    S._settingsLoaded=true;
    apiCall("settings.get").then(d=>{S.settings=d.settings;renderAutomation();}).catch(()=>{});
  }
  const s=S.settings||{reminder_hours:48,escalate_hours:72,auto_advance:false};
  $("#v-automation").innerHTML=`
    <div class="panel">
      <div class="panel-h"><h3>${t("tp_auto")}</h3><div class="sub">${t("tp_autoSub")}</div></div>
      <div class="panel-b">
        <div class="meta" style="margin-bottom:14px">${t("autoDesc")}</div>
        <div class="kv"><span class="k">${t("autoReminderLbl")}</span>
          <input class="inp" style="width:110px" type="number" min="1" id="aRem" value="${s.reminder_hours}" onchange="saveAuto()"></div>
        <div class="kv"><span class="k">${t("autoEscalateLbl")}</span>
          <input class="inp" style="width:110px" type="number" min="1" id="aEsc" value="${s.escalate_hours}" onchange="saveAuto()"></div>
        <div class="kv" style="align-items:flex-start">
          <span class="k">${t("autoAdvanceLbl")}<div class="meta" style="max-width:360px;margin-top:2px">${t("autoAdvanceHint")}</div></span>
          <label class="sw"><input type="checkbox" id="aAdv" ${s.auto_advance?'checked':''} onchange="saveAuto()"><span></span></label></div>
      </div>
      <div class="panel-b" style="border-top:1px solid var(--line)">
        <button class="btn amber" onclick="runAutoNow()">⚡ ${t("autoRunNow")}</button>
      </div>
    </div>`;
}
function saveAuto(){
  const s={reminder_hours:parseInt($("#aRem").value)||48,escalate_hours:parseInt($("#aEsc").value)||72,auto_advance:$("#aAdv").checked};
  S.settings=s;save();
  if(LIVE){ apiCall("settings.save",s).then(()=>toast(t("autoSaved"),"good")).catch(e=>toast("Fehler: "+e.message,"crit")); }
  else toast(t("autoSaved"),"good");
}
async function runAutoNow(){
  if(LIVE){
    try{ const d=await apiCall("automation.run"); await pull(); buildNav();
      if(route==="detail")renderDetail(); if(route==="dash")renderDash();
      toast(t("autoRan",d.reminded,d.advanced),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  const s=S.settings||{}; let reminded=0,advanced=0;
  S.trainings.forEach(tg=>{
    tg.roster.forEach(r=>{ if(r.status==="asked" && !r.reminded){ r.reminded=true; reminded++; } });
    if(s.auto_advance){
      const active=tg.roster.filter(r=>["asked","maybe","yes","confirmed"].includes(r.status)).length;
      const gaps=tg.roster.filter(r=>r.status==="no").length;
      const toAdd=Math.min(gaps,Math.max(0,tg.need-active));
      const next=ranked(tg).filter(x=>!x.status);
      for(let i=0;i<toAdd && i<next.length;i++){ tg.roster.push({trainerId:next[i].tr.id,status:"asked"}); advanced++; }
    }
  });
  save();buildNav();renderAutomation();if(route==="dash")renderDash();
  toast(t("autoRan",reminded,advanced),"good");
}

/* ============================================================
   HELPERS
   ============================================================ */
function initials(n){return n.replace(/^Dr\.\s*/,"").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function openSheet(){$("#scrim").classList.add("on");$("#sheet").classList.add("on");}
function closeSheet(){$("#scrim").classList.remove("on");$("#sheet").classList.remove("on");}
let toastT;
function toast(msg,kind){
  const el=$("#toast");el.textContent=msg;
  el.style.borderLeft=kind?`4px solid var(--${kind==='good'?'good':kind==='crit'?'crit':kind==='warn'?'warn':'brand'})`:"none";
  el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
}
