<meta charset="utf-8" />
<title>ETAF Trainer-Koordination</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- PWA / Homescreen (wirkt beim Self-Hosting; im Artifact ohne Funktion) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#3E4852" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ETAF DVI" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  /* ============ TOKENS ============ */
  :root{
    --brand:#3E4852; --brand-600:#2C343C; --brand-050:#EBEDEF; --brand-solid:#3E4852;
    --accent:#D81F26; --accent-050:#FBE6E7;
    --ink:#242B31; --muted:#5C666E; --faint:#8A939A;
    --bg:#F4F5F6; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#E2E5E8;
    --good:#2E9E6B; --good-bg:#E4F3EB;
    --warn:#C77E1E; --warn-bg:#F8ECD7;
    --crit:#D81F26; --crit-bg:#FBE6E7;
    --info:#3B6EA5; --info-bg:#E6EEF6;
    --shadow:0 1px 2px rgba(35,43,49,.06), 0 8px 24px -12px rgba(35,43,49,.20);
    --radius:12px; --radius-sm:8px;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --brand:#AEB9C2; --brand-600:#39444D; --brand-050:#242D35; --brand-solid:#48555F;
      --accent:#F0565C; --accent-050:#3A1F22;
      --ink:#E9EDF0; --muted:#A2ADB5; --faint:#6E7A82;
      --bg:#12171C; --panel:#1A2127; --panel-2:#151B20; --line:#28323A;
      --good:#4FBF87; --good-bg:#123024;
      --warn:#E4A94C; --warn-bg:#33280F;
      --crit:#F0565C; --crit-bg:#3A1F22;
      --info:#6BA6D4; --info-bg:#122636;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --brand:#AEB9C2; --brand-600:#39444D; --brand-050:#242D35; --brand-solid:#48555F;
    --accent:#F0565C; --accent-050:#3A1F22;
    --ink:#E9EDF0; --muted:#A2ADB5; --faint:#6E7A82;
    --bg:#12171C; --panel:#1A2127; --panel-2:#151B20; --line:#28323A;
    --good:#4FBF87; --good-bg:#123024; --warn:#E4A94C; --warn-bg:#33280F;
    --crit:#F0565C; --crit-bg:#3A1F22; --info:#6BA6D4; --info-bg:#122636;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --brand:#3E4852; --brand-600:#2C343C; --brand-050:#EBEDEF; --brand-solid:#3E4852;
    --accent:#D81F26; --accent-050:#FBE6E7;
    --ink:#242B31; --muted:#5C666E; --faint:#8A939A;
    --bg:#F4F5F6; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#E2E5E8;
    --good:#2E9E6B; --good-bg:#E4F3EB; --warn:#C77E1E; --warn-bg:#F8ECD7;
    --crit:#D81F26; --crit-bg:#FBE6E7; --info:#3B6EA5; --info-bg:#E6EEF6;
    --shadow:0 1px 2px rgba(35,43,49,.06), 0 8px 24px -12px rgba(35,43,49,.20);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3{text-wrap:balance;margin:0}
  .tnum{font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent);color:#fff}

  /* language switch */
  .langsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .langsw button{border:none;background:transparent;padding:5px 10px;font-size:12px;
    font-weight:700;color:var(--muted);letter-spacing:.03em}
  .langsw button.on{background:var(--brand-050);color:var(--brand)}
  .langsw button:hover:not(.on){color:var(--ink)}
  /* toggle switch */
  .sw{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s;cursor:pointer}
  .sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+span{background:var(--good)}
  .sw input:checked+span::before{transform:translateX(20px)}

  /* ============ LOGIN ============ */
  /* Flex + margin:auto = sicheres Zentrieren: ist die Karte höher als der
     Bildschirm, wird gescrollt statt oben abgeschnitten. */
  #lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    overflow:auto;
    background:
      radial-gradient(120% 90% at 80% -10%, var(--brand-050), transparent 55%),
      var(--bg);
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px))
            calc(20px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
  /* 100% = Breite INNERHALB des Innenabstands - vorher sprengten 94vw den Rahmen */
  .lock-card{width:min(380px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow);padding:34px 30px 28px;text-align:center}
  @media(max-width:400px){ .lock-card{padding:26px 20px 22px} .keys button{height:52px;font-size:20px} }
  .lg-top{display:flex;justify-content:flex-end;margin:-10px -8px 2px}
  .etaf{display:inline-flex;align-items:flex-end;gap:.1em;line-height:.85;font-weight:800;
    letter-spacing:-.05em;color:var(--ink);font-family:var(--sans);font-style:normal}
  .etaf .rd{width:.24em;height:.24em;border-radius:50%;background:var(--accent);
    margin-bottom:.08em;flex:none}
  .wm-sub{color:var(--faint);font-weight:650;font-size:11px;letter-spacing:.18em;
    margin-top:12px;text-transform:uppercase}
  .lock-card h1{font-size:19px;margin:18px 0 4px;letter-spacing:-.01em}
  .lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  .pin-dots span{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);
    transition:.15s}
  .pin-dots span.on{background:var(--brand);border-color:var(--brand);transform:scale(1.05)}
  .pin-dots.err span{border-color:var(--crit);animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keys button{height:56px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel-2);font-size:21px;font-weight:600;color:var(--ink);
    transition:.12s}
  .keys button:hover{background:var(--brand-050);border-color:var(--brand)}
  .keys button:active{transform:scale(.95)}
  .keys button.ghost{border:none;background:transparent;font-size:13px;color:var(--muted);font-weight:600}
  .lock-hint{margin-top:18px;font-size:12px;color:var(--faint)}
  .lock-hint b{color:var(--muted);font-family:var(--mono);letter-spacing:.1em}
  .lgerr{margin-top:14px;background:var(--crit-bg);color:var(--crit);border:1px solid var(--crit);
    border-radius:9px;padding:10px 12px;font-size:13.5px;text-align:left}
  .lgok{margin-top:14px;background:var(--good-bg);color:var(--good);border:1px solid var(--good);
    border-radius:9px;padding:10px 12px;font-size:13.5px;text-align:left}
  .lgforgot{display:block;width:100%;margin-top:12px;border:none;background:transparent;
    color:var(--muted);font-size:13px;font-weight:600;text-align:center}
  .lgforgot:hover{color:var(--brand)}

  /* ============ APP SHELL ============ */
  #app{display:none;min-height:100vh;grid-template-columns:236px 1fr}
  /* Tablet hoch: schmalere Seitenleiste - der Inhalt braucht die Breite mehr */
  @media(max-width:1100px){#app{grid-template-columns:206px 1fr} .side{padding:18px 10px}
    .nav button{padding:9px 9px;gap:9px} .brand{padding:4px 4px 14px}}
  @media(max-width:820px){#app{grid-template-columns:1fr}}
  .side{background:var(--panel);border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  @media(max-width:820px){.side{display:none}}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;
    border:none;background:transparent;cursor:pointer;width:100%;border-radius:9px}
  .brand:hover{opacity:.72}
  .brand:focus-visible{outline:2px solid var(--brand-solid);outline-offset:2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:9px 11px;border:none;background:transparent;border-radius:9px;color:var(--muted);
    font-size:14px;font-weight:550}
  .nav button svg{width:18px;height:18px;flex:none;opacity:.85}
  .nav button:hover{background:var(--panel-2);color:var(--ink)}
  .nav button.active{background:var(--brand-050);color:var(--brand);font-weight:650}
  .nav .badge{margin-left:auto;font-size:11px;background:var(--crit-bg);color:var(--crit);
    padding:1px 7px;border-radius:20px;font-weight:700}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
  .side-foot .langrow{display:flex;align-items:center;justify-content:space-between;padding:2px 10px 6px}
  .side-foot .langrow span{font-size:12px;color:var(--faint);font-weight:600}
  .side-foot button.lnk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:none;
    background:transparent;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600}
  .side-foot button.lnk:hover{background:var(--panel-2);color:var(--ink)}
  .mebox{display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:6px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px}

  main{min-width:0;padding:0 0 60px}
  /* Kopfzeile bricht IMMER um - so kann rechts nie etwas abgeschnitten werden,
     egal ob Handy, iPad im Hoch- oder Querformat oder schmales Fenster. */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top,0px)) 30px 14px;
    display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
  .topbar>*{min-width:0}
  .topbar>div:first-child{min-width:0;flex:1 1 220px}
  .topbar h2,.topbar .sub{overflow-wrap:anywhere}
  /* Bedienelemente als geschlossene Gruppe: sie brechen gemeinsam um und
     bleiben rechtsbündig - so steht nie ein einzelner Knopf verloren da. */
  .tbacts{display:flex;align-items:center;justify-content:flex-end;
    gap:8px 10px;flex-wrap:wrap;min-width:0;flex:0 1 auto}
  /* Tablet: Titel bekommt eine eigene Zeile, die Steuerelemente die zweite */
  @media(max-width:1240px){
    .topbar{padding-left:20px;padding-right:20px}
    .topbar>div:first-child{flex:1 1 100%}
    .topbar .spacer{display:none}
    .tbacts{flex:1 1 100%}
    .synct{display:none}                            /* Uhrzeit ist der erste Verzicht */
    #clientBar select{max-width:190px}
  }
  @media(max-width:900px){ #clientBar select{max-width:150px} }
  @media(max-width:820px){
    .topbar{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;gap:8px 10px}
    .topbar h2{font-size:16px} .topbar .sub{font-size:12px}
    /* Kundenauswahl teilt sich die Zeile mit dem Aktualisieren-Knopf */
    #clientBar{flex:1 1 180px}
    #clientBar select{width:100%;max-width:none}
    .tbacts{justify-content:stretch}
    #syncBtn{flex:0 0 auto}                         /* kompakt statt leerer Balken */
    .topbar .btn{flex:1 1 auto;justify-content:center;padding:9px 12px}
  }
  .topbar h2{font-size:17px;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;
    align-items:center;gap:7px;transition:.12s;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  .btn.primary:hover{background:var(--brand-600);color:#fff}
  .btn.amber{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.amber:hover{filter:brightness(1.05);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn svg{width:15px;height:15px}
  #syncBtn svg{width:16px;height:16px}
  #syncBtn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .synct{margin-right:2px;white-space:nowrap;opacity:.85}
  @media(max-width:1240px){.synclbl{display:none}}
  @media(max-width:680px){.synct{display:none!important}}

  .wrap{padding:24px 30px;max-width:1200px}
  @media(max-width:820px){.wrap{padding:18px 16px}}
  .view{display:none}.view.on{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}}

  /* ============ CARDS / KPI ============ */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .ampel{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line)}
  .ampel .lamp{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
  .ampel.a-green{background:var(--good-bg)}.ampel.a-green .lamp{background:var(--good)}
  .ampel.a-amber{background:var(--warn-bg)}.ampel.a-amber .lamp{background:var(--warn)}
  .ampel.a-red{background:var(--crit-bg)}.ampel.a-red .lamp{background:var(--crit);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,31,38,.5)}50%{box-shadow:0 0 0 6px rgba(216,31,38,0)}}
  .ampel b{font-size:15px}
  .hlamp{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;flex:none}
  .hlamp.h-green{background:var(--good)}.hlamp.h-amber{background:var(--warn)}.hlamp.h-red{background:var(--crit)}
  .tchip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .tchip.good{background:var(--good-bg);color:var(--good)}
  .tchip.warn{background:var(--warn-bg);color:var(--warn);cursor:pointer}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .val{font-size:30px;font-weight:750;margin-top:6px;letter-spacing:-.02em}
  .kpi .val small{font-size:15px;color:var(--faint);font-weight:600}
  .kpi .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi.g .rail{background:var(--good)} .kpi.w .rail{background:var(--warn)}
  .kpi.c .rail{background:var(--crit)} .kpi.i .rail{background:var(--info)}

  /* client portfolio cards */
  .pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .pf{position:relative;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 15px 13px;cursor:pointer;transition:.12s}
  .pf:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
  .pf-rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .pf-top{display:flex;align-items:center;gap:8px;font-size:14.5px}
  .pf-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pf .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px}
  .pf .bar i{display:block;height:100%;border-radius:4px}
  .pf-kv{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:20px}
  .panel-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h3{font-size:15px;letter-spacing:-.01em}
  .panel-h .sub{color:var(--muted);font-size:12.5px}
  .panel-b{padding:16px 18px}

  /* status pills */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
    font-size:12px;font-weight:650;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.good{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}
  .pill.info{background:var(--info-bg);color:var(--info)}
  .pill.neutral{background:var(--panel-2);color:var(--muted)}
  .rstat{width:34px;box-sizing:border-box;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);border-radius:7px;padding:5px 0;font-size:14px;line-height:1.2;
    text-align:center;text-align-last:center;cursor:pointer;
    -webkit-appearance:none;appearance:none;transition:.12s}
  .rstat:hover{border-color:var(--brand);color:var(--brand);background:var(--panel-2)}
  .rstat option{font-size:13px}

  /* ===== Einsatzübersicht (Plan) ===== */
  .plandoc .panel-b{padding:22px 24px}
  .planhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .planlogo{font-weight:800;font-size:24px;letter-spacing:-.05em;color:var(--ink)}
  .planlogo span{color:var(--accent)}
  .plansum{display:flex;gap:6px;flex-wrap:wrap}
  .plantable{border-collapse:collapse;width:100%;margin:14px 0 4px}
  .plantable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 10px 8px}
  .plantable td{padding:11px 10px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
  .plantable .nowrap{white-space:nowrap}
  .planconf{margin:14px 0 4px;padding:11px 14px;border-radius:10px;font-size:14px}
  .planconf.ok{background:var(--good-bg);color:var(--good)}
  .planconf.bad{background:var(--crit-bg);color:var(--crit)}
  .planconf.sent{background:var(--panel-2);color:var(--muted)}
  .planfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .planactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  @media print{
    .side,.topbar,.mob-nav,.noprint{display:none!important}
    #app{display:block!important}.wrap{padding:0;max-width:100%}
    .view:not(.on){display:none!important}
    .plandoc{border:none;box-shadow:none}
    body{background:#fff}
  }

  /* ===== Belegung / Buchungen ===== */
  .bkfilter{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .bkf{display:flex;align-items:center;gap:7px}
  .bkf .fld{margin:0;font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .bksel{width:auto;min-width:160px;text-align:left;text-align-last:left;padding:8px 12px;font-size:14px}
  .av.xs{width:24px;height:24px;font-size:10px}
  .bktr{display:flex;align-items:center;gap:8px}
  .bktable td:first-child{min-width:150px}
  .travrow{margin-top:2px}
  .bktop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bksearch{flex:0 0 auto;width:min(300px,100%);margin:0}
  .cchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;
    margin-right:7px;color:#fff;background:var(--cc,#888);vertical-align:1px;white-space:nowrap}
  .grouprow td{background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--muted);
    padding:9px 10px;border-top:2px solid var(--line)}
  .bktable .pill.crit{margin-left:6px}
  .clickrow{cursor:pointer;transition:background .12s}
  .clickrow:hover{background:var(--panel-2)}
  /* 5-Sterne-Widget (interne Bewertung) */
  .stars{display:inline-flex;gap:2px;cursor:pointer;user-select:none}
  .star{font-size:20px;line-height:1;color:var(--line);transition:color .1s}
  .star.on{color:#E4A94C}
  .histrow{padding:12px 0;border-top:1px solid var(--line)}
  .histrow:first-of-type{border-top:none}
  .segbtn{display:inline-flex;gap:4px}
  /* ===== Kalender-Gitter ===== */
  .calgrid{border-collapse:separate;border-spacing:0;font-size:12px}
  .calgrid th,.calgrid td{border:1px solid var(--line)}
  .calcorner{position:sticky;left:0;z-index:3;background:var(--panel);min-width:150px;text-align:left;padding:8px 10px}
  .calh{padding:5px 8px;text-align:center;background:var(--panel-2);white-space:nowrap;font-size:11px;font-weight:700}
  .calhd{color:var(--muted);font-weight:400;font-size:10px}
  .calname{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:6px 10px;white-space:nowrap;font-weight:600}
  .calname .av{vertical-align:middle;margin-right:7px}
  .calcell{padding:3px;vertical-align:top;min-width:90px;height:34px}
  .calcell.clash{outline:2px solid var(--crit);outline-offset:-2px}
  .calchip{display:block;font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:5px;margin:2px 0;
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;border:1px solid transparent}
  .calchip.s-yes{background:var(--cc);color:#fff}
  .calchip.s-maybe{background:var(--cc);color:#fff;opacity:.55}
  .calchip.s-asked{background:transparent;color:var(--cc);border-color:var(--cc)}
  .callegend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
  .callegend .lg{display:inline-flex;align-items:center;gap:6px}
  .callegend .calchip{margin:0}
  .clashdot{display:inline-block;width:16px;height:16px;border-radius:4px;outline:2px solid var(--crit);outline-offset:-2px}

  /* ============ 20-WEEK HEATMAP ============ */
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .wk{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel-2);
    cursor:pointer;transition:.12s;position:relative}
  .wk:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
  .wk .kw{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.04em}
  .wk .loc{font-size:13px;font-weight:650;margin:3px 0 8px;letter-spacing:-.01em}
  .wk .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
  .wk .bar i{display:block;height:100%;border-radius:4px}
  .wk .cnt{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
  .wk .flag{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}

  /* ============ TABLE / LISTS ============ */
  .row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em}
  .row .nm{font-weight:640;font-size:14px}
  .row .meta{font-size:12.5px;color:var(--muted)}
  .rowgrow{flex:1;min-width:148px}
  .rowacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end}
  /* (Die Handy-Regeln für Listenzeilen stehen gesammelt im MOBILE-FIRST-Block
     am Ende des Stylesheets - sie MÜSSEN nach den Grundregeln kommen, sonst
     überschreibt z.B. .att{padding:11px 0} den linken Einzug wieder.) */
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
  .tag{font-size:11px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    padding:1px 8px;border-radius:6px;font-weight:600}
  .fit{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brand);
    background:var(--brand-050);padding:2px 7px;border-radius:6px}

  /* attention list */
  .att{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .att .attacts{display:flex;align-items:center;gap:10px;flex:none}
  .att:last-child{border:none}
  .att .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .att .ic.c{background:var(--crit-bg);color:var(--crit)}
  .att .ic.w{background:var(--warn-bg);color:var(--warn)}

  /* ============ TRAINING DETAIL ============ */
  .split{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border:none}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:600;text-align:right}
  .slot-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
  .slot-head .c{font-size:13px;color:var(--muted)}

  /* ============ SLIDE-OVER (composer) ============ */
  .scrim{position:fixed;inset:0;background:rgba(6,16,18,.42);z-index:40;opacity:0;
    pointer-events:none;transition:.2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);
    z-index:41;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);transform:translateX(100%);
    transition:.26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .sheet.on{transform:none}
  .sheet-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .sheet-h h3{font-size:16px}
  .sheet-b{padding:18px 20px;overflow:auto;flex:1}
  .sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label.fld{display:block;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin:14px 0 6px}
  .fldrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .inp,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px}
  textarea{min-height:230px;resize:vertical;line-height:1.6;font-size:13.5px}
  .inp:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel-2);padding:5px 11px;border-radius:20px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .recip{display:flex;align-items:center;gap:8px;background:var(--brand-050);color:var(--brand);
    padding:5px 10px;border-radius:20px;font-size:13px;font-weight:640}
  .rte{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
  .rte button{border:1px solid var(--line);background:var(--panel-2);width:32px;height:30px;
    border-radius:7px;font-size:13px;font-weight:700;color:var(--muted)}
  .rte button:hover{border-color:var(--brand);color:var(--brand)}

  /* toast */
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:60;
    background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:11px;font-size:13.5px;
    font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;
    display:flex;align-items:center;gap:9px;max-width:90vw}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .empty{color:var(--faint);font-size:13.5px;padding:22px;text-align:center}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .mob-nav{display:none}
  @media(max-width:820px){
    .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);
      border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
    .mob-nav button{flex:1;border:none;background:transparent;color:var(--muted);font-size:10.5px;
      font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px}
    .mob-nav button svg{width:20px;height:20px}
    .mob-nav button.active{color:var(--brand)}
    main{padding-bottom:76px}
  }

  /* ============ AGENDA PRINT OVERLAY ============ */
  .printable{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:none;padding:22px}
  .printable.on{display:block}
  .ag-toolbar{max-width:800px;margin:0 auto 12px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .ag-sheet{max-width:800px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:34px 38px;box-shadow:var(--shadow)}
  .ag-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .ag-eyebrow{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .ag-h1{font-size:23px;font-weight:750;letter-spacing:-.01em;margin:4px 0 2px}
  .ag-bar{height:3px;background:var(--brand);border-radius:3px;margin:16px 0 20px}
  .ag-h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);
    margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .ag-kv{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;font-size:14px}
  .ag-kv .ag-k{color:var(--muted)} .ag-kv .ag-v{font-weight:600}
  /* Kurzfazit über dem Wochenraster: wie viele Einsätze, wie viele PowerPoints */
  .ag-mine{font-size:13px;color:var(--brand);font-weight:600;margin:0 0 9px}
  .ag-table{width:100%;border-collapse:collapse;font-size:14px}
  .ag-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .ag-table td.ag-t{white-space:nowrap;color:var(--brand);font-weight:700;width:110px}
  .ag-table td.ag-d{white-space:nowrap;color:var(--muted);width:66px}

  /* ============ WANDKALENDER ============ */
  .ag-toolbar.wide{max-width:900px}
  .cal-sheet{max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:30px 34px;box-shadow:var(--shadow)}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px;font-size:12.5px;color:var(--muted)}
  .cal-lg{display:inline-flex;align-items:center;gap:6px}
  .cal-lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .cal-month{margin-bottom:16px;break-inside:avoid}
  .cal-month h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);
    border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:8px}
  .cal-block{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:6px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;break-inside:avoid}
  .cal-dt{flex:0 0 66px;font-weight:700;font-size:13px;color:var(--ink);line-height:1.2}
  .cal-dt span{display:block;font-size:10.5px;color:var(--faint);font-weight:600}
  .cal-main{flex:1;min-width:0}
  .cal-tt{font-weight:640;font-size:13.5px}
  .cal-ss{font-size:12px;color:var(--muted)}
  .cal-bd{flex:none;font-family:var(--mono);font-weight:700;font-size:13px}
  @media(min-width:720px){.cal-sheet .cal-month{columns:1}}
  /* Druck-Overlays (Agenda/Kalender) auf dem Handy schlanker, damit nichts abgeschnitten wird */
  @media(max-width:820px){
    .printable{padding:12px}
    .ag-sheet,.cal-sheet{padding:20px 16px;border-radius:12px}
    .ag-kv{grid-template-columns:118px 1fr;gap:6px 10px}
    .ag-toolbar{padding:0 4px 12px}
  }

  /* ============================================================
     MOBILE-FIRST - nichts darf horizontal über den Rand laufen.
     Grundregel: jede Flex-/Grid-Zelle darf schrumpfen (min-width:0),
     breite Tabellen scrollen in ihrem eigenen Container.
     ============================================================ */
  /* Breite Tabellen scrollen in ihrem eigenen Container statt die Seite zu dehnen:
     gewischt wird die Tabelle, nicht die ganze Seite. Spalten bleiben lesbar. */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;overscroll-behavior-x:contain}
  .tscroll>.plantable{min-width:540px}

  /* Kein Element darf breiter werden als sein Container */
  #app,main,.wrap,.view,.panel,.panel-b,.sheet-b{min-width:0;max-width:100%;box-sizing:border-box}
  .rowgrow{min-width:0}                    /* war 148px → sprengte schmale Zeilen */
  /* Desktop/Tablet: Namensspalte behält Mindestbreite - sonst quetschen viele
     Chips/Buttons den Namen auf Buchstabenbreite („N i l s …“). Die Aktionen
     (.rowacts, flex-wrap) brechen dann stattdessen um. Unter 560px übernimmt
     der Mobile-Block (Name auf eigener Zeile). */
  @media(min-width:561px){ .row>.rowgrow,.att>.rowgrow{min-width:150px} }
  /* break-word statt anywhere: bricht nur, wenn ein Wort wirklich nicht passt -
     sonst zerreißt es Titel mitten im Wort („Informatio nsgewinnung“). */
  .row .nm,.row .meta,.att .nm,.att .meta{overflow-wrap:break-word}
  /* Kunden-Badge als Block: rutscht als Ganzes in die nächste Zeile,
     statt mit Rahmen mittendrin zerrissen zu werden */
  .row .nm .tag{display:inline-block;white-space:nowrap}
  img,svg,video,canvas{max-width:100%}

  @media(max-width:820px){
    html,body{overflow-x:hidden}           /* letzter Schutz gegen 1px-Ausreißer */
    .wrap{padding:16px 14px}
    .panel-b{padding:14px 14px}
    .panel-h{padding:13px 14px}
    .plandoc .panel-b{padding:16px 14px}
    /* Aktionen der Aufmerksamkeits-Liste: Knopf rechts ausrichten */
    .att .attacts .btn{margin-left:auto}
    .bktop{flex-wrap:wrap;gap:10px}
    .bktop .rowgrow{flex:1 1 100%}         /* Kennzahl auf eigene Zeile, sonst auf 11px gequetscht */
    .bktop .segbtn{flex:1 1 auto}
    /* Ampel-Banner darf umbrechen */
    .ampel{flex-wrap:wrap;gap:10px 14px}
    .ampel .rowgrow{flex:1 1 200px}
    .ampel .meta{overflow-wrap:anywhere}
    .ampel .btn{flex:1 1 auto;justify-content:center}
    /* Filter gestapelt: Bezeichnung über dem Feld, alle Felder gleich breit */
    .bkfilter{gap:10px}
    .bkf{flex:1 1 calc(50% - 5px);flex-direction:column;align-items:stretch;gap:4px}
    .bkf .fld{font-size:11.5px}
    .bksel{flex:none;min-width:0;width:100%}
    .bksearch{flex:1 1 100%;width:100%}
    /* Schlüssel/Wert-Zeilen dürfen zweizeilig werden */
    .kv{flex-wrap:wrap;gap:2px 12px}
    .kv .v{text-align:left}
    /* Größere Tap-Ziele (Apple-Richtwert 44px) */
    .btn{padding:10px 14px;font-size:14px}
    .btn.sm{padding:8px 11px;font-size:13px}
    .mob-nav button{min-height:48px}
    .rstat:not(.bksel){width:40px;padding:8px 0}   /* Zahnrad-Knopf; Filterfelder bleiben breit */
    .stars .star{font-size:24px}           /* Sterne bequem treffbar */
    /* Eingaben mit 16px, sonst zoomt iOS beim Fokus hinein */
    .inp,select,textarea{font-size:16px;padding:11px 12px}
    textarea{min-height:180px}
    /* Slide-over: volle Breite, Safe-Area unten, Buttons dürfen umbrechen */
    .sheet{width:100%;max-width:100%}
    .sheet-h{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
    .sheet-b{padding:16px}
    .sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;gap:8px}
    .sheet-f .btn{flex:1 1 auto;justify-content:center}
    .sheet-f .spacer{display:none}
    /* Bottom-Nav: Beschriftung darf nie überlaufen */
    .mob-nav button{min-width:0;position:relative}
    .mob-nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
    .mob-nav .badge{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;line-height:1.5;
      background:var(--crit);color:#fff;padding:0 5px;border-radius:20px;font-weight:700}
    /* Zeilen im „Mehr“-Blatt */
    .morerow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 6px;border:none;
      background:transparent;color:var(--ink);font-size:15px;font-weight:600;text-align:left;
      border-bottom:1px solid var(--line)}
    .morerow.on{color:var(--brand)}
    .morerow svg{flex:none;opacity:.8}
    /* Plan-/Agenda-Kopf gestapelt */
    .planhead{gap:10px}
    .planactions .btn{flex:1 1 auto;justify-content:center}
  }
  /* ---- Wochenplan (aus dem ETAF Dashboard zusammengeführt) ---- */
  .wktabs{display:flex;gap:8px;padding-bottom:6px;margin-bottom:14px}
  .wktab{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 13px;
    border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink);font:inherit}
  .wktab small{color:var(--faint);font-size:10.5px}
  .wktab.on{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  .wktab.on small{color:rgba(255,255,255,.75)}
  .wkgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
  .daycol{min-width:0}
  .daycol h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
  .daycol h4 small{display:block;color:var(--faint);font-weight:600;letter-spacing:0;text-transform:none}
  .slotbox{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:10px;display:flex;flex-direction:column}
  .slotbox .sl-h{display:flex;justify-content:space-between;gap:6px;padding:6px 10px 2px;
    font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
  .zone{display:flex;flex-direction:column;gap:6px;padding:6px 7px 10px;min-height:76px;border-radius:0 0 11px 11px;
    transition:background .12s}
  /* Ablageziel deutlich hervorheben: ganzer Halbtag eingefärbt + Rahmen */
  /* --brand-050 ist der helle/dunkle Marken-Ton je Design - funktioniert in
     beiden Modi und in jedem Browser (kein color-mix nötig). */
  .zone.dragover{background:var(--brand-050);outline:2px solid var(--brand-solid);outline-offset:-3px}
  .slotbox.dropbox{border-color:var(--brand-solid);box-shadow:0 0 0 3px var(--brand-050)}
  /* Einfügemarke zwischen zwei Kacheln */
  .dropline{height:5px;flex:none;border-radius:3px;background:var(--brand-solid);margin:-1px 0;
    box-shadow:0 0 0 2px var(--brand-050)}
  .sess{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
    padding:8px 30px 7px 14px;cursor:grab;font-size:12.5px}
  .sess:active{cursor:grabbing}
  .sess.dragging{opacity:.35}
  .sess.trtarget{outline:2px solid var(--good);outline-offset:-1px}
  /* Pfeile zum genauen Umsortieren (Maus: beim Überfahren, Touch: immer sichtbar) */
  .snudge{position:absolute;top:4px;right:4px;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .12s}
  .sess:hover .snudge{opacity:1}
  .snudge button{width:22px;height:17px;line-height:1;padding:0;border:1px solid var(--line);border-radius:5px;
    background:var(--panel);color:var(--muted);font-size:9px;cursor:pointer}
  .snudge button:hover{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  @media (pointer:coarse){ .snudge{opacity:1} .snudge button{width:30px;height:24px;font-size:11px} }
  .sess .srail{position:absolute;left:0;top:-1px;bottom:-1px;width:4px;border-radius:9px 0 0 9px}
  .sess .st{font-weight:650;line-height:1.3;margin-bottom:4px;overflow-wrap:anywhere}
  .sess .sm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px}
  .sess .sm .tag{padding:0 5px;font-size:10px}
  /* Rückgängig / Wiederholen oben in der Kopfzeile */
  .undogrp{display:inline-flex;gap:6px}
  .undogrp .btn{font-size:15px;line-height:1;padding:9px 11px}
  .undogrp .btn[disabled]{opacity:.4;cursor:default}
  .undolbl{margin-left:7px;font-size:13px}
  @media(max-width:1240px){ .undolbl{display:none} }
  .btnspin{width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;
    display:inline-block;animation:wkrot .8s linear infinite;vertical-align:-2px;margin-right:8px;flex:none}
  @keyframes wkrot{to{transform:rotate(360deg)}}
  .ppdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
  .ppdot.g{background:var(--good)} .ppdot.y{background:var(--warn)} .ppdot.r{background:var(--crit)}
  .wkbench .zone{flex-direction:row;flex-wrap:wrap;min-height:50px}
  .wkbench .sess{flex:0 1 230px}
  /* Wandkalender: Wocheninhalte (nur wenn eingeblendet) */
  .cal-sheet.det .cal-block{align-items:flex-start;break-inside:avoid;page-break-inside:avoid}
  .cal-sheet.det .cal-dt,.cal-sheet.det .cal-bd{padding-top:2px}
  .cal-det{margin:8px 0 2px;border-top:1px solid var(--line);padding-top:7px}
  .cal-del{font-size:11px;color:var(--muted);margin:0 0 6px}
  .cal-day{margin:0 0 5px;display:flex;gap:8px;align-items:flex-start}
  .cal-dn{flex:none;width:52px;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;padding-top:1px;overflow-wrap:anywhere}
  /* Sammelzeilen (Auswechselbank / noch nicht verteilt): Label über die volle Breite */
  .cal-day.full{flex-direction:column;gap:2px}
  .cal-day.full .cal-dn{width:auto}
  .cal-h{margin:0 0 4px}
  .cal-h b{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .cal-s{font-size:11.5px;line-height:1.35;padding-left:11px;position:relative}
  .cal-s i{color:var(--muted);font-style:normal}
  /* Fließzeile für Wochen ohne Tagesverteilung - spart im Ausdruck viele Seiten */
  .cal-inl{font-size:11.5px;line-height:1.45;color:var(--ink)}
  .cal-inl i{color:var(--muted);font-style:normal}
  .cal-sd{position:absolute;left:0;top:5px;width:5px;height:5px;border-radius:50%}
  /* ===== Trainingsbericht: Skala, Vorkommnisse, Maßnahmen ===== */
  .dbsec{border-top:1px solid var(--line);margin:16px 0 0;padding-top:13px}
  .dbsec:first-of-type{border-top:none;padding-top:0}
  .dbsec h4{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .dbrow{display:flex;align-items:center;gap:10px;padding:5px 0;flex-wrap:wrap}
  .dbrow .lbl{flex:1 1 190px;min-width:0;font-size:13.5px}
  /* Skala 1-5 + „n.z.“ - bewusst große Flächen, damit es am Handy vor Ort läuft */
  .scale{display:flex;gap:4px;flex:none}
  .scale button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;
    font:600 13px/1 var(--sans);color:var(--muted);cursor:pointer;padding:0}
  .scale button.na{width:auto;padding:0 9px;font-size:11.5px}
  .scale button:hover{border-color:var(--brand);color:var(--ink)}
  .scale button.on{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  .scale button.on.s1,.scale button.on.s2{background:var(--crit);border-color:var(--crit)}
  .scale button.on.s3{background:var(--warn);border-color:var(--warn)}
  .scale button.on.s4,.scale button.on.s5{background:var(--good);border-color:var(--good)}
  .scale button.na.on{background:var(--panel-2);border-color:var(--line);color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 13px;
    font:500 12.5px/1.3 var(--sans);color:var(--muted);cursor:pointer}
  .chips button.on{background:var(--crit-bg);border-color:var(--crit);color:var(--crit);font-weight:650}
  .actrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
  .actrow .inp{margin:0}
  .actrow .at{flex:1 1 100%} .actrow .ao{flex:1 1 130px} .actrow .ad{flex:0 1 150px}
  .dbbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .dbbadge.ok{background:var(--good-bg);color:var(--good)}
  .dbbadge.dr{background:var(--warn-bg);color:var(--warn)}
  .dbbadge.no{background:var(--panel-2);color:var(--faint)}

  /* ===== Auswertung: Diagramme (reines SVG, keine Fremdbibliothek) ===== */
  .rpfilter{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .rpfilter .fld{margin:0 0 4px}
  .rpseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .rpseg button{border:none;background:transparent;padding:8px 13px;font:600 12.5px/1 var(--sans);
    color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
  .rpseg button:last-child{border-right:none}
  .rpseg button.on{background:var(--brand-solid);color:#fff}
  .chart{width:100%;display:block;overflow:visible}
  .chart text{font-family:var(--sans);fill:var(--muted)}
  .chart .val{fill:var(--ink);font-weight:650}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .chart .axis{fill:var(--faint);font-size:11px}
  .cbar{cursor:default}
  .cbar:hover .bar{opacity:.82}
  .clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
  .clegend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .spark{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .sparkbox{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--panel)}
  .sparkbox .sh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .sparkbox .sv{font-size:21px;font-weight:700;color:var(--ink);line-height:1.2}
  /* Ausfüllstand: Ring + Prozentzahl (die Zahl trägt die Aussage, nicht die Farbe) */
  .dbringwrap{position:relative;flex:none;width:38px;height:38px;display:inline-block}
  .dbring{display:block}
  .dbringwrap b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .dbringwrap b i{font-style:normal;font-size:8px;font-weight:600;margin-left:1px}
  /* 100 % ist dreistellig - Prozentzeichen weglassen und etwas kleiner setzen,
     sonst stößt die Zahl an den Kreis. */
  .dbringwrap b.full{font-size:9.5px;letter-spacing:-.04em}
  .dbringwrap b.full i{display:none}
  .dbringwrap.sm b.full{font-size:8.5px}
  .dbringwrap b.g{color:var(--good)} .dbringwrap b.i{color:var(--info)} .dbringwrap b.f{color:var(--faint)}
  .dbringwrap b.g{display:none}   /* fertig = Haken, keine Zahl */
  .dbprog{display:flex;align-items:center;gap:10px;margin-top:8px}
  .dbringwrap.sm{width:36px;height:36px}
  .dbringwrap.sm b{font-size:9.5px}
  .dbringwrap.sm b i{font-size:7.5px}
  /* Ringpaar in der Trainingsliste: jeder Ring trägt seine eigene
     Beschriftung - eine nackte Zahl neben einem Training ist mehrdeutig. */
  .rdpair{display:flex;gap:12px;flex:none;align-items:flex-start}
  .rdcell{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:36px}
  /* Die Beschriftung ist breiter als der Ring und bestimmt damit die Zellbreite -
     deshalb bewusst schmal gesetzt. */
  .rdcap{font-size:8px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--faint);line-height:1;white-space:nowrap}
  @media(max-width:560px){ .rdpair{gap:14px} }
  .row.dbrow-l{cursor:pointer}
  .row.dbrow-l:hover{background:var(--panel-2)}
  .chips.rpchips button b{font-variant-numeric:tabular-nums;margin-left:3px;opacity:.75}
  .chips.rpchips button.on{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  .chips.rpchips button.on b{opacity:.9}
  /* Einzelner Trainingsbericht als Druckbogen */
  .dsheet .ag-top{flex-wrap:nowrap;gap:16px}
  .dsheet .ag-top>div:first-child{min-width:0;flex:1 1 auto}
  .dsheet .ag-top>span{flex:none}
  .dsheet .ag-h1{font-size:20px;line-height:1.2}
  .dsheet .dstop{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin:2px 0 6px}
  .dsheet .dsbig,.dsheet .dsrec{display:flex;gap:9px;align-items:baseline}
  .dsheet .dsbig span,.dsheet .dsrec span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .dsheet .dsbig b{font-size:26px;line-height:1}
  .dsheet .dsbig i,.dsheet .dsrec i{font-style:normal;color:var(--faint)}
  .dsheet .dsrec b{font-size:14px}
  .dsheet b.good{color:var(--good)} .dsheet b.warn{color:var(--warn)} .dsheet b.crit{color:var(--crit)}
  .dsgrp{margin:11px 0 0;break-inside:avoid;page-break-inside:avoid}
  .dsgrp h4{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);
    border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;justify-content:space-between}
  .dsgrp h4 span{color:var(--muted);letter-spacing:0}
  .dskv{display:grid;grid-template-columns:1fr auto 1fr auto;gap:3px 12px;font-size:12.5px;align-items:baseline}
  .dskv .k{color:var(--muted);min-width:0;overflow-wrap:anywhere}
  .dskv .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .dstx{margin:0 0 8px;font-size:12.5px;break-inside:avoid}
  .dstx b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .rptable td.nt{color:var(--muted);font-size:12px}
  .rpacts li.done{color:var(--faint);text-decoration:line-through}
  .dspage{height:0}
  @media(max-width:560px){ .dskv{grid-template-columns:1fr auto} }
  /* Hinweisband über der Auswertung - muss auffallen, ohne zu schreien */
  .rpnote{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;margin-bottom:14px;
    border:1px solid var(--warn);border-left-width:4px;border-radius:var(--radius-sm);
    background:var(--warn-bg);color:var(--ink);font-size:13.5px}
  .rpnote.soft{border-color:var(--line);border-left-color:var(--info);background:var(--panel);color:var(--muted)}
  .rpnote b{color:var(--warn)} .rpnote.soft b{color:var(--ink)}
  .rpnote .btn{flex:none}
  .rpnote svg{flex:none;margin-top:1px;color:var(--warn)}
  .rpnote.soft svg{color:var(--info)}
  .rpval .rpn{font-weight:400;color:var(--faint)}
  /* Folien-Ansicht */
  .pptprog{width:120px;height:8px;border-radius:4px;background:var(--brand-050);overflow:hidden;flex:none}
  .pptprog i{display:block;height:100%;border-radius:4px;background:var(--good)}
  .pptrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .pptrow:first-child{border-top:none}
  .pptname{flex:1 1 230px;min-width:0}
  .pptname b{font-size:13.5px}
  .pptown{width:170px;flex:none;padding:6px 9px;font-size:12.5px}
  .pptdue{width:140px;flex:none;padding:6px 9px;font-size:12.5px}
  .pptbadge{flex:none;font-size:12px;min-width:104px}
  .rpseg.pptst button{padding:6px 10px;font-size:12px}
  .rpseg.pptst button.on.ok{background:var(--good)}
  .pptfilecell{display:flex;align-items:center;gap:7px;flex:none;min-width:0}
  .pptfile{font-size:12.5px;font-weight:600;color:var(--brand);display:inline-flex;align-items:center;white-space:nowrap}
  .pptup{cursor:pointer}
  @media(max-width:900px){
    .pptrow{align-items:flex-start}
    .pptname{flex:1 1 100%}
    .pptbadge{min-width:0}
  }
  .rpbars{display:flex;flex-direction:column;gap:7px}
  .rprow{display:grid;grid-template-columns:minmax(120px,1.45fr) minmax(70px,2fr) 42px 40px;
    gap:10px;align-items:center;font-size:13px}
  .rplbl{color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .rpbar{height:10px;border-radius:5px;background:var(--brand-050);overflow:hidden}
  .rpbar i{display:block;height:100%;border-radius:0 5px 5px 0}
  .rpval{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .rpn{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  /* Zwei gleich breite Spalten - .grid2 füllt mit auto-fill auch 4 Spuren auf */
  .rpgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
  /* Tablet hochkant: eine Spalte - zwei Spalten drücken sonst die Knöpfe
     in den Zeilen über den Rand */
  @media(max-width:900px){ .rpgrid2{grid-template-columns:1fr} }
  .rpcols .rpbars{display:block;columns:2;column-gap:34px}
  .rpcols .rprow{break-inside:avoid;margin-bottom:7px}
  @media(max-width:900px){ .rpcols .rpbars{columns:1} }
  .rpkv{display:grid;grid-template-columns:190px 1fr;gap:5px 14px;font-size:13.5px;margin-bottom:4px}
  .rpkv .rpk{color:var(--muted)}
  .rpgrp{display:flex;gap:9px;flex-wrap:wrap}
  .rpgrp>div{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;
    display:flex;gap:10px;align-items:baseline}
  .rpgrp b{font-size:16px}
  .rpflags{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .rpflags span{border:1px solid var(--line);border-radius:20px;padding:3px 11px}
  .rpprov{border:1px solid var(--warn);border-left-width:4px;border-radius:8px;background:var(--warn-bg);
    color:var(--warn);font-weight:650;font-size:12px;padding:7px 12px;margin:0 0 10px}
  .rpacts{margin:0;padding-left:19px;font-size:13px}
  .rpacts i{color:var(--muted);font-style:normal}
  @media(max-width:560px){
    .rprow{grid-template-columns:1fr 46px;grid-template-areas:"l v" "b b";gap:3px 8px}
    .rplbl{grid-area:l;white-space:normal}
    .rpbar{grid-area:b} .rpval{grid-area:v} .rpn{display:none}
    .rpkv{grid-template-columns:1fr;gap:0 0}
    .rpkv .rpk{margin-top:7px}
  }
  .rptable{width:100%;border-collapse:collapse;font-size:13.5px}
  .rptable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:700;padding:0 10px 7px}
  .rptable td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
  .rptable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rpmeter{height:6px;border-radius:3px;background:var(--brand-050);overflow:hidden;min-width:70px}
  .rpmeter i{display:block;height:100%;border-radius:3px}
  @media(max-width:560px){
    .dbrow .lbl{flex:1 1 100%}
    .scale button{width:calc((100% - 20px)/6);max-width:44px;height:38px}
    .scale{width:100%}
  }

  .wkdeliv{border-left:4px solid var(--warn);border-radius:10px;background:var(--panel-2);padding:11px 14px;font-size:13.5px}
  .wkdeliv b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
  .wkteam{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .wkteam .tmchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;
    padding:3px 11px 3px 4px;font-size:12.5px;cursor:grab;background:var(--panel)}
  .wkteam .tmchip:active{cursor:grabbing}
  .tmchip .tmcnt{background:var(--brand-solid);color:#fff;border-radius:10px;padding:0 7px;
    font-size:10.5px;line-height:16px;font-weight:700}
  @media(max-width:760px){ .wkgrid{grid-template-columns:1fr} .daycol h4{text-align:left} .wkbench .sess{flex:1 1 100%} }

  /* Handy: Avatar/Icon links fixiert, Text über die volle Breite, Aktionen darunter.
     Gilt für alle Listenzeilen - auch wenn Pille/Buttons direkt in .row hängen.
     Steht bewusst HIER (nach allen Grundregeln), damit nichts zurücküberschrieben wird. */
  @media(max-width:560px){
    .row,.att{flex-wrap:wrap;position:relative;row-gap:9px;padding-left:48px}
    .row>.av{position:absolute;left:0;top:12px}
    .att{padding-left:42px}
    .att>.ic{position:absolute;left:0;top:11px}
    .row>.rowgrow,.att>.rowgrow{flex:1 1 100%;min-width:0}
    /* alles nach dem Text (Pille, Buttons, Fit-Wert) rutscht auf eine eigene Zeile */
    .row>.pill,.row>.fit,.row>.btn,.row>.rstat,
    .att>.pill,.att>.attacts,.row>.rowacts{margin-top:0}
    .rowacts,.att .attacts{width:100%;flex:1 1 100%;justify-content:flex-start;padding-left:0}
    .row>.btn{flex:0 0 auto}
    /* Panel-Kopfzeilen (z.B. „Alle Kunden · 24 Trainings“ + Knöpfe) */
    .panel-b>.rowgrow{flex:1 1 100%}
  }
  @media(max-width:420px){
    .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpi{padding:13px 13px 11px}
    .kpi .val{font-size:25px}
    .grid2{grid-template-columns:1fr}
    .wrap{padding:14px 12px}
    .topbar{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
  }

  @media print{
    :root{--bg:#fff;--panel:#fff;--panel-2:#f6f7f8;--ink:#242b31;--muted:#5c666e;--faint:#8a939a;--line:#e2e5e8;--brand:#3e4852}
    body>*{display:none!important}
    /* Wenn ein Druckbogen offen ist, darf die Bildschirmansicht NICHT mitgedruckt
       werden - sonst steht der Inhalt doppelt im PDF. Muss den ID-Selektor
       #app aus dem Block weiter oben ausstechen, daher body.sheetprint davor. */
    body.sheetprint #app{display:none!important}
    .printable.on{display:block!important;position:static;padding:0;background:#fff;overflow:visible}
    .ag-toolbar{display:none!important}
    .ag-sheet,.cal-sheet{border:none;border-radius:0;box-shadow:none;padding:0;max-width:none}
    .cal-block{background:#fff}
    .cal-grid{columns:2;column-gap:26px}

    /* ---- Kompakter Satz für alle Druckbögen ---- */
    @page{margin:11mm}
    .ag-sheet,.cal-sheet{font-size:10pt;line-height:1.35}
    .ag-h1{font-size:17pt;margin:1px 0 2px}
    .ag-eyebrow{font-size:7.5pt;letter-spacing:.14em}
    .ag-bar{margin:8px 0 10px;height:2px}
    .ag-h2{font-size:8.5pt;margin:11px 0 4px;padding-bottom:3px}
    .ag-kv{grid-template-columns:145px 1fr;gap:2px 12px;font-size:9.5pt}
    .ag-table td{padding:3px 5px;font-size:9.5pt}
    .ag-mine{font-size:9.5pt;margin:0 0 6px}
    .agwk{gap:5px}
    .agwk>div{break-inside:avoid;page-break-inside:avoid}
    .cal-legend{margin-bottom:8px}
    .cal-block{margin-bottom:4px;padding:5px 10px;break-inside:avoid;page-break-inside:avoid}
    .cal-month h3{margin:6px 0 5px}
    .cal-det{margin:5px 0 1px;padding-top:5px}
    .cal-day{margin:0 0 3px}
    .cal-s{font-size:8.8pt;line-height:1.3}
    .cal-inl{font-size:8.6pt;line-height:1.35}
    .cal-h{margin:0 0 2px}
    /* Wochenplan-Bogen */
    .wkp th,.wkp td{padding:4px 6px!important}
    .wkp .wkp-s{margin:0 0 4px!important}
    .wkp .wkp-t{font-size:9pt}
    .wkp .wkp-m{font-size:7.6pt}
    .wkp-head h2{font-size:15pt!important;margin:1px 0 2px!important}
    .wkp-del{padding:6px 10px!important;margin:9px 0 2px!important;font-size:9.5pt!important}
    /* Auswertungsbogen */
    .rpsheet .rprow{font-size:9.5pt;gap:8px}
    .rpsheet .rpbar{height:8px}
    .rpsheet .rpbars{gap:5px}
    .rpsheet .rpkv{grid-template-columns:150px 1fr;font-size:9.5pt;gap:2px 12px}
    .rpsheet .rpgrp>div{padding:5px 9px;font-size:9pt} .rpsheet .rpgrp b{font-size:12pt}
    .rpsheet .rptable td,.rpsheet .rptable th{padding:3px 6px;font-size:9pt}
    .rpsheet .rpflags{font-size:9pt} .rpsheet .rpacts{font-size:9.5pt}
    .rpprov{font-size:9pt;padding:5px 10px;margin-bottom:8px;break-inside:avoid}
    .rpnote{display:none!important}
    .rpsheet .ag-h2{break-after:avoid;page-break-after:avoid}
    /* Sammelmappe: jeder Bericht auf einer eigenen Seite */
    .dspage{break-after:page;page-break-after:always;height:0}
    .dsheet{break-inside:auto}

/* ============================================================

const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=(p)=>p+Math.random().toString(36).slice(2,8);

/* ---------- ICONS ---------- */
const IC={
  dash:'<path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/>',

  book:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h5M8 17h8"/>',
  printer:'<path d="M6 9V2h12v7"/><rect x="5" y="13" width="14" height="8" rx="1"/><path d="M6 17H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/>',

  plane:'<path d="M17.8 19.2 16 11l3.5-3.5a2.12 2.12 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.83L8 10l-2.5 2.5-2-.5a.5.5 0 0 0-.4.85L6 15.5 8.15 18l.85-.4a.5.5 0 0 0 .3-.46l.7-4L14 16l-.2 3.7a.5.5 0 0 0 .85.4z"/>',

  down:'<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',
  reply:'<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
  bag:'<rect x="6" y="8" width="12" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2M10 12v4M14 12v4"/>',
  theme:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  id:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5 16c.5-1.5 1.7-2 3-2s2.5.5 3 2M14 9h4M14 13h4"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  pen:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  week:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 13h3v5H7zM12 13h3v3h-3z"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/>',
  slides:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/><path d="M7 8h6M7 11h4"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
const svg=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
/* Inline-Strichicon in Textgröße (für Buttons/Labels). */
function ic(name,size){const s=size||16;return `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:7px;flex:none">${IC[name]||""}</svg>`;}
/* ETAF-Wortmarke als Vektor - direkt aus ETAF_Logo.png nachgezeichnet
   (Konturverfolgung, Abweichung 0,09 % = nur Kantenglättung).
   Buchstaben = currentColor (passt sich an Hell/Dunkel an), Punkt im Logo-Rot. */
const ETAF_PATH="M0 0 349 0 349 110 143 110 143 159 323 159 323 264 143 264 143 320 357 320 357 429 0 429Z"
  +"M362 0 757 0 757 113 632 113 632 429 487 429 487 113 362 113Z"
  +"M834 0 977 0 1164 429 1014 429 985 354 823 354 794 429 647 429Z"
  +"M1181 0 1529 0 1529 110 1326 110 1326 183 1505 183 1505 292 1326 292 1326 429 1181 429Z"
  +"M905 144 863 250 945 250Z";
function etafLogo(h){
  return `<svg viewBox="0 0 1752 657" height="${h}" role="img" aria-label="ETAF" style="display:block;overflow:visible">`
    +`<path fill="currentColor" fill-rule="evenodd" d="${ETAF_PATH}"/>`
    +`<circle cx="1648" cy="552" r="104" fill="#CD1719"/></svg>`;
}

/* ============================================================
   LIVE-MODUS - spricht mit dem PHP-Backend (config.js gesetzt).
   Ohne config.js läuft alles als lokale Demo (localStorage).
   ============================================================ */
const API=(window.ETAF&&window.ETAF.apiBase)?String(window.ETAF.apiBase).replace(/\/$/,''):null;
const LIVE=!!API;
let AUTH=""; try{AUTH=localStorage.getItem("etaf_token")||"";}catch(e){}
let pollTimer=null;
async function apiCall(action,payload){
  const r=await fetch(API+"/api.php?action="+encodeURIComponent(action),{
    method:"POST", headers:{"Content-Type":"application/json","X-Auth-Token":AUTH},
    body:JSON.stringify(payload||{})});
  let d; try{d=await r.json();}catch(e){d={ok:false,error:"HTTP "+r.status};}
  if(!r.ok||d.ok===false){
    const err=new Error(d.error||("HTTP "+r.status));
    // Versionskonflikt durchreichen, damit der Aufrufer den Dialog zeigen kann
    if(d.conflict){ err.conflict=true; err.by=d.by||""; err.at=d.at||""; err.version=d.version; }
    err.status=r.status;
    throw err;
  }
  return d;
}
async function pull(){
  const d=await apiCall("state");
  S.trainers=d.trainers; S.trainings=d.trainings; S.templates=d.templates;
  if(d.clients&&d.clients.length)S.clients=d.clients;
  if(d.materials)S.materials=d.materials;
  if(d.matPresets)S.matPresets=d.matPresets;
  S.me=d.me||null; S.setupMode=!!d.setupMode;
  S.flightMailNew=d.flightMailNew||0;
  S.undo=d.undo||null; drawUndo();
}
/* Nach jedem pull() zeigt S.trainings frische Objekte - curTg muss neu
   aufgelöst werden, sonst rendert die Detailansicht veraltete Daten. */
function reAnchorCurTg(){
  if(curTg){ const f=S.trainings.find(x=>x.id===curTg.id);
    if(f)curTg=f; else if(route==="detail")route="dash"; }
}
function renderCurrent(){
  if(route==="dash")renderDash();
  else if(route==="detail")renderDetail();
  else if(route==="trainings")renderTrainings();
  else if(route==="emails")renderEmails();
  buildNav();
}
function markSynced(){
  const e=$("#syncTime"); if(!e)return;
  try{ e.textContent=t("lastSync", new Date().toLocaleTimeString(S.lang==='en'?'en-GB':'de-DE',{hour:'2-digit',minute:'2-digit'})); }catch(_){}
}
let syncing=false;
async function syncNow(){
  if(!LIVE){ toast(t("syncDemo"),"warn"); return; }
  if(syncing)return; syncing=true;
  const b=$("#syncBtn"); if(b)b.classList.add("spin");
  try{ await pull(); reAnchorCurTg(); render(); markSynced(); toast(t("synced"),"good"); }
  catch(e){ toast(t("syncFail"),"crit"); }
  finally{ syncing=false; if(b)b.classList.remove("spin"); }
}
/* ============================================================
   RÜCKGÄNGIG / WIEDERHOLEN - gilt für alles: Trainings, Trainer, Besetzung,
   Wochenplan, Material, Vorlagen … Live wird der Datenstand serverseitig
   gesichert (auch Änderungen von Kolleginnen und Kollegen lassen sich so
   zurücknehmen); im Demo-Modus liegt der Stapel im Browser.
   ============================================================ */
function undoInfo(){
  if(!LIVE) return { undo: demoUndo.length?{summary:t("undoStep")}:null,
                     redo: demoRedo.length?{summary:t("undoStep")}:null };
  return (S.undo)||{undo:null,redo:null};
}
function drawUndo(){
  const i=undoInfo(), ub=$("#undoBtn"), rb=$("#redoBtn");
  if(!ub||!rb) return;
  ub.disabled=!i.undo; rb.disabled=!i.redo;
  ub.title = i.undo ? t("undoTip", i.undo.summary||"", i.undo.by||"") : t("undoNothing");
  rb.title = i.redo ? t("redoTip", i.redo.summary||"") : t("redoNothing");
  const lbl=ub.querySelector(".undolbl"); if(lbl) lbl.textContent=t("undoBtn");
}
async function doUndo(){ await undoStep(-1); }
async function doRedo(){ await undoStep(+1); }
async function undoStep(dir){
  const btn=$(dir<0?"#undoBtn":"#redoBtn");
  if(btn&&btn.disabled) return;
  if(!LIVE){
    const from=dir<0?demoUndo:demoRedo, to=dir<0?demoRedo:demoUndo;
    if(!from.length) return;
    to.push(JSON.stringify(S));
    S=JSON.parse(from.pop()); demoLast=JSON.stringify(S);
    localStorage.setItem("etaf_demo",demoLast);
    render(); drawUndo(); toast(dir<0?t("undoDone",""):t("redoDone",""),"good");
    return;
  }
  if(btn) btn.disabled=true;
  try{
    const d=await apiCall(dir<0?"undo.do":"redo.do",{});
    await pull(); reAnchorCurTg(); render();
    if(route==="week"||$("#wkDetail")) { WKD=null; wkDrawnSig=""; if(route==="week") renderWeek(); }
    toast(dir<0?t("undoDone",d.summary||""):t("redoDone",d.summary||""),"good");
  }catch(e){ toast(e.message,"crit"); }
  finally{ drawUndo(); }
}
/* Tastenkürzel: Cmd/Strg+Z und Cmd/Strg+Umschalt+Z */
document.addEventListener("keydown",ev=>{
  if(!(ev.metaKey||ev.ctrlKey) || ev.key.toLowerCase()!=="z") return;
  const el=document.activeElement;
  if(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;   // im Eingabefeld gilt der Browser
  const lk=$("#lock"); if(lk && lk.style.display!=="none") return;   // Anmeldemaske offen
  ev.preventDefault();
  ev.shiftKey?doRedo():doUndo();
});

function startPolling(){
  if(!LIVE||pollTimer)return;
  const ms=(window.ETAF&&window.ETAF.pollMs)||8000;
  pollTimer=setInterval(async()=>{
    try{ await pull(); reAnchorCurTg(); renderCurrent(); markSynced(); }catch(e){}
  }, ms);
}
function stopPolling(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
/* Merkt sich die aktuelle Ansicht, damit ein Browser-Reload dort wieder landet. */
function saveView(){ try{ localStorage.setItem("etaf_view", JSON.stringify({route, tg:curTg?curTg.id:null})); }catch(e){} }
function restoreView(){
  try{ const v=JSON.parse(localStorage.getItem("etaf_view")||"null"); if(!v||!v.route)return;
    route=v.route;
    if(route==="detail"){ const tg=v.tg&&S.trainings.find(x=>x.id===v.tg); if(tg)curTg=tg; else route="dash"; }
  }catch(e){}
}

/* Verbindlicher Programmkalender (ETAF Operational DVI Elite Team Programme 2026-2027, V3.2) */
function isoWeekNum(d){
  const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-ys)/86400000)+1)/7);
}

let S=load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem("etaf_demo"));
    if(r&&r.trainers){
      r.lang=r.lang||"de"; r.emailLang=r.emailLang||"en";
      r.settings=r.settings||{reminder_hours:48,escalate_hours:72,auto_advance:false,passport_lead_days:180,ppt_lead_days:21};
      r.emails=r.emails||[];
      if(!r.templates||!r.templates[0]||!r.templates[0].de)r.templates=TEMPLATES;
      if(!r.clients||!r.clients.length)r.clients=seedClients();
      if(!("clientFilter"in r))r.clientFilter=null;
      if(!r.materials||!r.materials.length)r.materials=seedMaterials();
      if(!r.matPresets)r.matPresets={};
      /* Programm-Update: einmalig die Demo-Trainings durch das echte DVI-Programm ersetzen
         (Sprache, Einstellungen, E-Mail-Protokoll & Vorlagen bleiben erhalten). */
      if(r.seedVersion!==SEED_VERSION){
        r.clients=seedClients(); r.clientFilter=null;
        r.trainers=seedTrainers(); r.trainings=seedTrainings();
        r.materials=seedMaterials(); r.matPresets=seedMatPresets();
        r.seedVersion=SEED_VERSION;
      }
      (r.trainings||[]).forEach(t=>{ if(!t.travel)t.travel={venue:"",hotel:"",hotelAddr:"",meetingPoint:"",contactName:"",contactPhone:"",dresscode:"",perDiem:"",notes:"",agenda:[]};
        if(!t.clientId)t.clientId=(r.clients[0]||{}).id; if(!t.materials)t.materials=[]; });
      return r;
    }
  }catch(e){}
  return {lang:"de", emailLang:"en", seedVersion:SEED_VERSION, clients:seedClients(), clientFilter:null,
    materials:seedMaterials(), matPresets:seedMatPresets(),
    trainers:seedTrainers(), trainings:seedTrainings(),
    templates:TEMPLATES, settings:{reminder_hours:48,escalate_hours:72,auto_advance:false,passport_lead_days:180,ppt_lead_days:21},

/* ---------- MATCHING (simulierte KI-Vorauswahl) ---------- */
function scoreTrainer(tr,tg){
  let s=40;
  if(tr.spec.includes(tg.spec))s+=34; else if(tr.spec.some(x=>SPEC.indexOf(x)%2===SPEC.indexOf(tg.spec)%2))s+=10;
  if(tg.country==="UAE"&&tr.uae)s+=14;
  if(tg.country==="UAE"&&tr.langs.includes("AR"))s+=6;
  if(tg.country!=="UAE"&&tr.region.startsWith("DE"))s+=8;
  s+=(3-tr.load)*4;
  s+=(parseFloat(tr.rating)-4)*10;
  return Math.max(35,Math.min(99,Math.round(s)));
}
function ranked(tg){
  return S.trainers.map(tr=>{const e=tg.roster.find(r=>r.trainerId===tr.id)||{};
    return {tr,fit:scoreTrainer(tr,tg),status:e.status||null,reminded:!!e.reminded,flight:e.flight||null};})
    .sort((a,b)=>b.fit-a.fit);
}
function rosterStats(tg){
  const yes=tg.roster.filter(r=>r.status==="yes"||r.status==="confirmed").length;
  const maybe=tg.roster.filter(r=>r.status==="maybe").length;
  const asked=tg.roster.filter(r=>r.status==="asked").length;
  return {yes,maybe,asked,need:tg.need};
}
function statusOf(tg){
  const{yes,need}=rosterStats(tg);
  if(yes>=need)return{cls:"good",key:"st_full"};
  if(yes>=Math.ceil(need*0.6))return{cls:"warn",key:"st_partial"};
  if(yes>0||rosterStats(tg).asked>0)return{cls:"warn",key:"st_req"};
  return{cls:"crit",key:"st_under"};
}
const SPCLS={asked:"info",yes:"good",maybe:"warn",no:"crit",confirmed:"good"};
const spCls=s=>SPCLS[s];
const spLabel=s=>t("sp_"+s);

/* ---------- KUNDEN / CLIENTS ---------- */
const VISA_COUNTRIES=["UAE","KSA"];
function needsVisa(c){return VISA_COUNTRIES.includes(c);}
function clientOf(tg){return (S.clients||[]).find(c=>c.id===tg.clientId)||null;}
function clientColor(tg){const c=clientOf(tg);return c?c.color:"var(--brand-solid)";}
function activeClient(){return S.clientFilter?(S.clients||[]).find(c=>c.id===S.clientFilter)||null:null;}
function curTrainings(){return S.clientFilter?S.trainings.filter(t=>t.clientId===S.clientFilter):S.trainings;}
function clientStats(cid){
  const list=S.trainings.filter(t=>t.clientId===cid);
  const good=list.filter(t=>statusOf(t).cls==="good").length;
  const crit=list.filter(t=>statusOf(t).cls==="crit").length;
  const open=list.reduce((a,t)=>a+rosterStats(t).asked,0);
  const cls=crit?"crit":(good===list.length&&list.length)?"good":"warn";
  const key=crit?"pf_crit":(good===list.length&&list.length)?"pf_done":"pf_prog";
  return {list,total:list.length,good,crit,open,cls,key};
}

   ============================================================ */
function healthStatus(){
  const conf=(typeof conflictKeys==="function")?conflictKeys():new Set();
  const under=S.trainings.filter(tg=>rosterStats(tg).yes<(tg.need||0)).length;
  const open=S.trainings.reduce((a,tg)=>a+rosterStats(tg).asked,0);
  const conflicts=conf.size;
  // Reisepass-Ablauf
  let ppExpired=0, ppSoon=0;
  (S.trainers||[]).forEach(tr=>{ const h=passportHealth(tr.passport);
    if(h.level==="crit"&&h.days!=null&&h.days<0) ppExpired++;
    else if(h.level==="crit"||h.level==="warn") ppSoon++; });
  const inbox=(typeof inboxCount==="function")?inboxCount():0;
  const level = (conflicts>0||ppExpired>0) ? "red" : (under>0||open>0||ppSoon>0||inbox>0) ? "amber" : "green";
  return {level,conflicts,under,open,ppExpired,ppSoon,inbox};
}
function clientHealth(cid){
  const tgs=S.trainings.filter(t=>t.clientId===cid);
  const seen={}; let conflicts=0;
  tgs.forEach(tg=>(tg.roster||[]).forEach(r=>{
    if(!["yes","confirmed","maybe","asked"].includes(r.status))return;
    if(!(tg.kw||tg.date))return;
    const k=r.trainerId+"|"+(tg.kw||tg.date); seen[k]=(seen[k]||0)+1;
  }));
  for(const k in seen) if(seen[k]>1) conflicts++;
  const under=tgs.filter(tg=>rosterStats(tg).yes<(tg.need||0)).length;
  const open=tgs.reduce((a,tg)=>a+rosterStats(tg).asked,0);
  const level=conflicts>0?"red":(under>0||open>0)?"amber":"green";
  return {level,conflicts,under,open};
}

async function rosterSetStatus(tgId,trId,status){
  if(LIVE){
    try{ await apiCall("request.setStatus",{training:tgId,trainer:trId,status}); await pull(); }
    catch(e){ toast("Fehler: "+e.message,"crit"); return; }
  } else setStatus(tgId,trId,status);
  if(route==="detail"){curTg=S.trainings.find(x=>x.id===tgId);renderDetail();}
  buildNav(); if(route==="dash")renderDash();
  toast(t("statusChanged",spLabel(status)),"good");

/* Nach manueller Statusänderung: Trainer per Mail informieren (Text anpassbar,
   mit den bekannten Ja/Vielleicht/Nein-Buttons zur Bestätigung). */
function statusNotifyTemplate(tr,tg,status,lang){
  const first=(tr.name||"").replace(/^Dr\.\s*/,"").split(" ")[0];
  const when=whenLabel(tg)||"";
  const where=[tg.city,tg.country].filter(Boolean).join(", ");
  const head=lang==="de"?`Hallo ${first},`:`Hi ${first},`;
  const foot=lang==="de"?"Herzliche Grüße\nETAF-Koordination":"Best regards\nETAF Coordination";
  const mid = lang==="de" ? {
    yes:`kurze Info: Wir haben dich für „${tg.topic}“ in ${where} (${when}) fest eingeplant (Status: Zugesagt).\n\nBitte bestätige über die Buttons unten kurz, dass das für dich passt - oder gib uns Bescheid, falls nicht.`,
    maybe:`kurze Info: Wir haben dich für „${tg.topic}“ in ${where} (${when}) auf „Vielleicht“ gesetzt.\n\nSobald du sicher weißt, ob es klappt, gib uns bitte über die Buttons unten Bescheid.`,
    no:`kurze Info: Wir haben dich für „${tg.topic}“ in ${where} (${when}) ausgetragen (Status: Abgesagt).\n\nFalls das nicht stimmt oder du doch kannst, gib uns über die Buttons unten kurz Bescheid.`,
    asked:`wir würden dich gern für „${tg.topic}“ in ${where} (${when}) anfragen.\n\nBist du verfügbar? Ein Klick auf die Buttons unten genügt.`,
  } : {
    yes:`quick update: We have scheduled you for "${tg.topic}" in ${where} (${when}) - status: Confirmed.\n\nPlease confirm via the buttons below that this works for you - or let us know if it doesn't.`,
    maybe:`quick update: We have set you to "Maybe" for "${tg.topic}" in ${where} (${when}).\n\nOnce you know for sure, please let us know via the buttons below.`,
    no:`quick update: We have removed you from "${tg.topic}" in ${where} (${when}) - status: Declined.\n\nIf that's not right or you can make it after all, just let us know via the buttons below.`,
    asked:`we would like to request your availability for "${tg.topic}" in ${where} (${when}).\n\nAre you available? One click on the buttons below is enough.`,
  };
  return `${head}\n\n${mid[status]||mid.asked}\n\n${foot}`;
}

/* Reise-Checkliste je Zusage: Flug, Hotel, ggf. Visum, Pass - alles da = grüner Haken. */
function travelReadiness(tg,x){
  const fl=x.flight||{};
  const items=[
    {ok:!!(fl.flightOut&&fl.flightReturn), lbl:t("frFlight")},
    {ok:!!((tg.travel&&tg.travel.hotel)||fl.room), lbl:t("frHotel")},
  ];
  if(needsVisa(tg.country)){
    items.push({ok:fl.visaStatus==="approved", lbl:t("frVisa")});
    const trId=x.trainerId||(x.tr&&x.tr.id);
    const tr=S.trainers.find(z=>z.id===trId);
    const pp=tr&&tr.passport, end=tg.dateEnd||tg.date;
    items.push({ok:!!(pp&&pp.expiry&&(!end||pp.expiry>end)), lbl:t("frPass")});
  }
  return items;
}
function readyChip(tg,x){
  if(!(x.status==="yes"||x.status==="confirmed")) return "";
  const items=travelReadiness(tg,x);
  const done=items.filter(i=>i.ok).length;
  if(done===items.length) return `<span class="pill good" title="${t("frAllSet")}">✈ ${t("frReady")}</span>`;
  const missing=items.filter(i=>!i.ok).map(i=>i.lbl).join(", ");
  return `<span class="pill neutral" title="${t("frMissing")}: ${esc(missing)}">✈ ${done}/${items.length}</span>`;
}

/* Historie: alle Trainings, bei denen der Trainer zugesagt/bestätigt/vielleicht ist,
   plus früher bewertete Einsätze, deren Training nicht (mehr) im Plan steht. */
function trainerHistory(tr){
  const rel=["yes","confirmed","maybe"]; const rows=[]; const seen=new Set();
  S.trainings.forEach(tg=>{
    const r=(tg.roster||[]).find(x=>x.trainerId===tr.id);
    if(!r||!rel.includes(r.status)) return;
    seen.add(String(tg.id));
    rows.push({tgId:String(tg.id), label:`${tg.topic} · ${whenText(tg)||""}`.trim()});
  });
  (tr.reviews||[]).forEach(rv=>{
    if(seen.has(String(rv.trainingId))) return;
    rows.push({tgId:String(rv.trainingId), label:rv.label||("#"+rv.trainingId), orphan:true});
  });
  return rows.sort((a,b)=>b.label.localeCompare(a.label));
}
