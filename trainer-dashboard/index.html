<meta charset="utf-8" />
<title>ETAF Trainer-Koordination</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- PWA / Homescreen (wirkt beim Self-Hosting; im Artifact ohne Funktion) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#3E4852" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ETAF DVI" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  /* ============ TOKENS ============ */
  :root{
    --brand:#3E4852; --brand-600:#2C343C; --brand-050:#EBEDEF; --brand-solid:#3E4852;
    --accent:#D81F26; --accent-050:#FBE6E7;
    --ink:#242B31; --muted:#5C666E; --faint:#8A939A;
    --bg:#F4F5F6; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#E2E5E8;
    --good:#2E9E6B; --good-bg:#E4F3EB;
    --warn:#C77E1E; --warn-bg:#F8ECD7;
    --crit:#D81F26; --crit-bg:#FBE6E7;
    --info:#3B6EA5; --info-bg:#E6EEF6;
    --shadow:0 1px 2px rgba(35,43,49,.06), 0 8px 24px -12px rgba(35,43,49,.20);
    --radius:12px; --radius-sm:8px;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --brand:#AEB9C2; --brand-600:#39444D; --brand-050:#242D35; --brand-solid:#48555F;
      --accent:#F0565C; --accent-050:#3A1F22;
      --ink:#E9EDF0; --muted:#A2ADB5; --faint:#6E7A82;
      --bg:#12171C; --panel:#1A2127; --panel-2:#151B20; --line:#28323A;
      --good:#4FBF87; --good-bg:#123024;
      --warn:#E4A94C; --warn-bg:#33280F;
      --crit:#F0565C; --crit-bg:#3A1F22;
      --info:#6BA6D4; --info-bg:#122636;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --brand:#AEB9C2; --brand-600:#39444D; --brand-050:#242D35; --brand-solid:#48555F;
    --accent:#F0565C; --accent-050:#3A1F22;
    --ink:#E9EDF0; --muted:#A2ADB5; --faint:#6E7A82;
    --bg:#12171C; --panel:#1A2127; --panel-2:#151B20; --line:#28323A;
    --good:#4FBF87; --good-bg:#123024; --warn:#E4A94C; --warn-bg:#33280F;
    --crit:#F0565C; --crit-bg:#3A1F22; --info:#6BA6D4; --info-bg:#122636;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --brand:#3E4852; --brand-600:#2C343C; --brand-050:#EBEDEF; --brand-solid:#3E4852;
    --accent:#D81F26; --accent-050:#FBE6E7;
    --ink:#242B31; --muted:#5C666E; --faint:#8A939A;
    --bg:#F4F5F6; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#E2E5E8;
    --good:#2E9E6B; --good-bg:#E4F3EB; --warn:#C77E1E; --warn-bg:#F8ECD7;
    --crit:#D81F26; --crit-bg:#FBE6E7; --info:#3B6EA5; --info-bg:#E6EEF6;
    --shadow:0 1px 2px rgba(35,43,49,.06), 0 8px 24px -12px rgba(35,43,49,.20);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3{text-wrap:balance;margin:0}
  .tnum{font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent);color:#fff}

  /* language switch */
  .langsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .langsw button{border:none;background:transparent;padding:5px 10px;font-size:12px;
    font-weight:700;color:var(--muted);letter-spacing:.03em}
  .langsw button.on{background:var(--brand-050);color:var(--brand)}
  .langsw button:hover:not(.on){color:var(--ink)}
  /* toggle switch */
  .sw{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s;cursor:pointer}
  .sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+span{background:var(--good)}
  .sw input:checked+span::before{transform:translateX(20px)}

  /* ============ LOGIN ============ */
  /* Flex + margin:auto = sicheres Zentrieren: ist die Karte höher als der
     Bildschirm, wird gescrollt statt oben abgeschnitten. */
  #lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    overflow:auto;
    background:
      radial-gradient(120% 90% at 80% -10%, var(--brand-050), transparent 55%),
      var(--bg);
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px))
            calc(20px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
  /* 100% = Breite INNERHALB des Innenabstands — vorher sprengten 94vw den Rahmen */
  .lock-card{width:min(380px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow);padding:34px 30px 28px;text-align:center}
  @media(max-width:400px){ .lock-card{padding:26px 20px 22px} .keys button{height:52px;font-size:20px} }
  .lg-top{display:flex;justify-content:flex-end;margin:-10px -8px 2px}
  .etaf{display:inline-flex;align-items:flex-end;gap:.1em;line-height:.85;font-weight:800;
    letter-spacing:-.05em;color:var(--ink);font-family:var(--sans);font-style:normal}
  .etaf .rd{width:.24em;height:.24em;border-radius:50%;background:var(--accent);
    margin-bottom:.08em;flex:none}
  .wm-sub{color:var(--faint);font-weight:650;font-size:11px;letter-spacing:.18em;
    margin-top:12px;text-transform:uppercase}
  .lock-card h1{font-size:19px;margin:18px 0 4px;letter-spacing:-.01em}
  .lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  .pin-dots span{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);
    transition:.15s}
  .pin-dots span.on{background:var(--brand);border-color:var(--brand);transform:scale(1.05)}
  .pin-dots.err span{border-color:var(--crit);animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keys button{height:56px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel-2);font-size:21px;font-weight:600;color:var(--ink);
    transition:.12s}
  .keys button:hover{background:var(--brand-050);border-color:var(--brand)}
  .keys button:active{transform:scale(.95)}
  .keys button.ghost{border:none;background:transparent;font-size:13px;color:var(--muted);font-weight:600}
  .lock-hint{margin-top:18px;font-size:12px;color:var(--faint)}
  .lock-hint b{color:var(--muted);font-family:var(--mono);letter-spacing:.1em}

  /* ============ APP SHELL ============ */
  #app{display:none;min-height:100vh;grid-template-columns:236px 1fr}
  @media(max-width:820px){#app{grid-template-columns:1fr}}
  .side{background:var(--panel);border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  @media(max-width:820px){.side{display:none}}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:9px 11px;border:none;background:transparent;border-radius:9px;color:var(--muted);
    font-size:14px;font-weight:550}
  .nav button svg{width:18px;height:18px;flex:none;opacity:.85}
  .nav button:hover{background:var(--panel-2);color:var(--ink)}
  .nav button.active{background:var(--brand-050);color:var(--brand);font-weight:650}
  .nav .badge{margin-left:auto;font-size:11px;background:var(--crit-bg);color:var(--crit);
    padding:1px 7px;border-radius:20px;font-weight:700}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
  .side-foot .langrow{display:flex;align-items:center;justify-content:space-between;padding:2px 10px 6px}
  .side-foot .langrow span{font-size:12px;color:var(--faint);font-weight:600}
  .side-foot button.lnk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:none;
    background:transparent;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600}
  .side-foot button.lnk:hover{background:var(--panel-2);color:var(--ink)}

  main{min-width:0;padding:0 0 60px}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top,0px)) 30px 14px;display:flex;align-items:center;gap:14px}
  @media(max-width:820px){
    .topbar{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;flex-wrap:wrap;gap:8px 10px}
    .topbar>div:first-child{flex:1 1 100%}          /* Titelblock volle Breite → Steuerelemente umbrechen */
    .topbar .spacer{display:none}
    .topbar h2{font-size:16px} .topbar .sub{font-size:12px}
    /* Kundenauswahl teilt sich die Zeile mit dem Aktualisieren-Knopf */
    #clientBar{flex:1 1 180px;min-width:0}
    #clientBar select{width:100%;max-width:none}
    #syncBtn{flex:0 0 auto}                         /* kompakt statt leerer Balken */
    .topbar .btn{flex:1 1 auto;justify-content:center;padding:9px 12px}
  }
  .topbar h2{font-size:17px;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;
    align-items:center;gap:7px;transition:.12s;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
  .btn.primary:hover{background:var(--brand-600);color:#fff}
  .btn.amber{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.amber:hover{filter:brightness(1.05);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn svg{width:15px;height:15px}
  #syncBtn svg{width:16px;height:16px}
  #syncBtn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .synct{margin-right:2px;white-space:nowrap;opacity:.85}
  @media(max-width:680px){.synclbl{display:none} .synct{display:none!important}}

  .wrap{padding:24px 30px;max-width:1200px}
  @media(max-width:820px){.wrap{padding:18px 16px}}
  .view{display:none}.view.on{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}}

  /* ============ CARDS / KPI ============ */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .ampel{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line)}
  .ampel .lamp{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
  .ampel.a-green{background:var(--good-bg)}.ampel.a-green .lamp{background:var(--good)}
  .ampel.a-amber{background:var(--warn-bg)}.ampel.a-amber .lamp{background:var(--warn)}
  .ampel.a-red{background:var(--crit-bg)}.ampel.a-red .lamp{background:var(--crit);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,31,38,.5)}50%{box-shadow:0 0 0 6px rgba(216,31,38,0)}}
  .ampel b{font-size:15px}
  .hlamp{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;flex:none}
  .hlamp.h-green{background:var(--good)}.hlamp.h-amber{background:var(--warn)}.hlamp.h-red{background:var(--crit)}
  .tchip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .tchip.good{background:var(--good-bg);color:var(--good)}
  .tchip.warn{background:var(--warn-bg);color:var(--warn);cursor:pointer}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .val{font-size:30px;font-weight:750;margin-top:6px;letter-spacing:-.02em}
  .kpi .val small{font-size:15px;color:var(--faint);font-weight:600}
  .kpi .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi.g .rail{background:var(--good)} .kpi.w .rail{background:var(--warn)}
  .kpi.c .rail{background:var(--crit)} .kpi.i .rail{background:var(--info)}

  /* client portfolio cards */
  .pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .pf{position:relative;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 15px 13px;cursor:pointer;transition:.12s}
  .pf:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
  .pf-rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .pf-top{display:flex;align-items:center;gap:8px;font-size:14.5px}
  .pf-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pf .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px}
  .pf .bar i{display:block;height:100%;border-radius:4px}
  .pf-kv{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:20px}
  .panel-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h3{font-size:15px;letter-spacing:-.01em}
  .panel-h .sub{color:var(--muted);font-size:12.5px}
  .panel-b{padding:16px 18px}

  /* status pills */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
    font-size:12px;font-weight:650;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.good{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}
  .pill.info{background:var(--info-bg);color:var(--info)}
  .pill.neutral{background:var(--panel-2);color:var(--muted)}
  .rstat{width:34px;box-sizing:border-box;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);border-radius:7px;padding:5px 0;font-size:14px;line-height:1.2;
    text-align:center;text-align-last:center;cursor:pointer;
    -webkit-appearance:none;appearance:none;transition:.12s}
  .rstat:hover{border-color:var(--brand);color:var(--brand);background:var(--panel-2)}
  .rstat option{font-size:13px}

  /* ===== Einsatzübersicht (Plan) ===== */
  .plandoc .panel-b{padding:22px 24px}
  .planhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .planlogo{font-weight:800;font-size:24px;letter-spacing:-.05em;color:var(--ink)}
  .planlogo span{color:var(--accent)}
  .plansum{display:flex;gap:6px;flex-wrap:wrap}
  .plantable{border-collapse:collapse;width:100%;margin:14px 0 4px}
  .plantable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 10px 8px}
  .plantable td{padding:11px 10px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
  .plantable .nowrap{white-space:nowrap}
  .planconf{margin:14px 0 4px;padding:11px 14px;border-radius:10px;font-size:14px}
  .planconf.ok{background:var(--good-bg);color:var(--good)}
  .planconf.bad{background:var(--crit-bg);color:var(--crit)}
  .planconf.sent{background:var(--panel-2);color:var(--muted)}
  .planfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .planactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  @media print{
    .side,.topbar,.mob-nav,.noprint{display:none!important}
    #app{display:block!important}.wrap{padding:0;max-width:100%}
    .view:not(.on){display:none!important}
    .plandoc{border:none;box-shadow:none}
    body{background:#fff}
  }

  /* ===== Belegung / Buchungen ===== */
  .bkfilter{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .bkf{display:flex;align-items:center;gap:7px}
  .bkf .fld{margin:0;font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .bksel{width:auto;min-width:160px;text-align:left;text-align-last:left;padding:8px 12px;font-size:14px}
  .av.xs{width:24px;height:24px;font-size:10px}
  .bktr{display:flex;align-items:center;gap:8px}
  .bktable td:first-child{min-width:150px}
  .travrow{margin-top:2px}
  .bktop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bksearch{flex:0 0 auto;width:min(300px,100%);margin:0}
  .cchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;
    margin-right:7px;color:#fff;background:var(--cc,#888);vertical-align:1px;white-space:nowrap}
  .grouprow td{background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--muted);
    padding:9px 10px;border-top:2px solid var(--line)}
  .bktable .pill.crit{margin-left:6px}
  .clickrow{cursor:pointer;transition:background .12s}
  .clickrow:hover{background:var(--panel-2)}
  /* 5-Sterne-Widget (interne Bewertung) */
  .stars{display:inline-flex;gap:2px;cursor:pointer;user-select:none}
  .star{font-size:20px;line-height:1;color:var(--line);transition:color .1s}
  .star.on{color:#E4A94C}
  .histrow{padding:12px 0;border-top:1px solid var(--line)}
  .histrow:first-of-type{border-top:none}
  .segbtn{display:inline-flex;gap:4px}
  /* ===== Kalender-Gitter ===== */
  .calgrid{border-collapse:separate;border-spacing:0;font-size:12px}
  .calgrid th,.calgrid td{border:1px solid var(--line)}
  .calcorner{position:sticky;left:0;z-index:3;background:var(--panel);min-width:150px;text-align:left;padding:8px 10px}
  .calh{padding:5px 8px;text-align:center;background:var(--panel-2);white-space:nowrap;font-size:11px;font-weight:700}
  .calhd{color:var(--muted);font-weight:400;font-size:10px}
  .calname{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:6px 10px;white-space:nowrap;font-weight:600}
  .calname .av{vertical-align:middle;margin-right:7px}
  .calcell{padding:3px;vertical-align:top;min-width:90px;height:34px}
  .calcell.clash{outline:2px solid var(--crit);outline-offset:-2px}
  .calchip{display:block;font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:5px;margin:2px 0;
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;border:1px solid transparent}
  .calchip.s-yes{background:var(--cc);color:#fff}
  .calchip.s-maybe{background:var(--cc);color:#fff;opacity:.55}
  .calchip.s-asked{background:transparent;color:var(--cc);border-color:var(--cc)}
  .callegend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
  .callegend .lg{display:inline-flex;align-items:center;gap:6px}
  .callegend .calchip{margin:0}
  .clashdot{display:inline-block;width:16px;height:16px;border-radius:4px;outline:2px solid var(--crit);outline-offset:-2px}

  /* ============ 20-WEEK HEATMAP ============ */
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}

  /* ============ SLIDE-OVER (composer) ============ */

  .ag-h1{font-size:23px;font-weight:750;letter-spacing:-.01em;margin:4px 0 2px}
  .ag-bar{height:3px;background:var(--brand);border-radius:3px;margin:16px 0 20px}
  .ag-h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);

  /* ============================================================
     MOBILE-FIRST — nichts darf horizontal über den Rand laufen.

     ============================================================ */

  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;overscroll-behavior-x:contain}

  #app,main,.wrap,.view,.panel,.panel-b,.sheet-b{min-width:0;max-width:100%;box-sizing:border-box}

    /* Ampel-Banner darf umbrechen */

    .ampel .btn{flex:1 1 auto;justify-content:center}
    /* Filter gestapelt: Bezeichnung über dem Feld, alle Felder gleich breit */
    .bkfilter{gap:10px}

    .bkf .fld{font-size:11.5px}
    .bksel{flex:none;min-width:0;width:100%}
    .bksearch{flex:1 1 100%;width:100%}
    /* Schlüssel/Wert-Zeilen dürfen zweizeilig werden */
    .kv{flex-wrap:wrap;gap:2px 12px}

    /* Größere Tap-Ziele (Apple-Richtwert 44px) */

    .mob-nav button{min-height:48px}
    .rstat:not(.bksel){width:40px;padding:8px 0}   /* Zahnrad-Knopf; Filterfelder bleiben breit */
    .stars .star{font-size:24px}           /* Sterne bequem treffbar */
    /* Eingaben mit 16px, sonst zoomt iOS beim Fokus hinein */
    .inp,select,textarea{font-size:16px;padding:11px 12px}
    textarea{min-height:180px}
    /* Slide-over: volle Breite, Safe-Area unten, Buttons dürfen umbrechen */
    .sheet{width:100%;max-width:100%}
    .sheet-h{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
    .sheet-b{padding:16px}
    .sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;gap:8px}
    .sheet-f .btn{flex:1 1 auto;justify-content:center}
    .sheet-f .spacer{display:none}

    .mob-nav .badge{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;line-height:1.5;
      background:var(--crit);color:#fff;padding:0 5px;border-radius:20px;font-weight:700}
    /* Zeilen im „Mehr“-Blatt */
    .morerow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 6px;border:none;
      background:transparent;color:var(--ink);font-size:15px;font-weight:600;text-align:left;

  }
  @media(max-width:420px){

/* ETAF-Wortmarke als Vektor — pixelgenau aus der Original-Logodatei vermessen.
   Buchstaben = currentColor (passt sich an Hell/Dunkel an), Punkt = Akzentrot.
   viewBox 0 0 1751 656 (Buchstaben 0..1529 breit, Höhe 429; Punkt unten rechts). */
function etafLogo(h){
  return `<svg viewBox="0 0 1751 656" height="${h}" role="img" aria-label="ETAF" style="display:block;overflow:visible">`
    +`<g fill="currentColor">`
    +`<rect x="0" y="0" width="143" height="429"/><rect x="0" y="0" width="348" height="110"/><rect x="0" y="159" width="323" height="110"/><rect x="0" y="318" width="356" height="110"/>`
    +`<rect x="361" y="0" width="396" height="110"/><rect x="487" y="0" width="144" height="429"/>`
    +`<path fill-rule="evenodd" d="M832 0L978 0L1161 428L1012 428L908 353L795 428L649 428Z M905 146L943 246L870 246Z"/>`
    +`<rect x="1181" y="0" width="144" height="429"/><rect x="1181" y="0" width="348" height="110"/><rect x="1181" y="159" width="323" height="110"/>`
    +`</g><circle cx="1647" cy="552" r="104" fill="#D81F26"/></svg>`;
}

/* ============================================================
   LIVE-MODUS — spricht mit dem PHP-Backend (config.js gesetzt).
   Ohne config.js läuft alles als lokale Demo (localStorage).
   ============================================================ */
const API=(window.ETAF&&window.ETAF.apiBase)?String(window.ETAF.apiBase).replace(/\/$/,''):null;
const LIVE=!!API;
let AUTH=""; try{AUTH=localStorage.getItem("etaf_token")||"";}catch(e){}
let pollTimer=null;
async function apiCall(action,payload){
  const r=await fetch(API+"/api.php?action="+encodeURIComponent(action),{
    method:"POST", headers:{"Content-Type":"application/json","X-Auth-Token":AUTH},
    body:JSON.stringify(payload||{})});
  let d; try{d=await r.json();}catch(e){d={ok:false,error:"HTTP "+r.status};}
  if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
  return d;
}
async function pull(){
  const d=await apiCall("state");
  S.trainers=d.trainers; S.trainings=d.trainings; S.templates=d.templates;
  if(d.clients&&d.clients.length)S.clients=d.clients;
  if(d.materials)S.materials=d.materials;
  if(d.matPresets)S.matPresets=d.matPresets;
}
/* Nach jedem pull() zeigt S.trainings frische Objekte — curTg muss neu
   aufgelöst werden, sonst rendert die Detailansicht veraltete Daten. */
function reAnchorCurTg(){
  if(curTg){ const f=S.trainings.find(x=>x.id===curTg.id);
    if(f)curTg=f; else if(route==="detail")route="dash"; }
}
function renderCurrent(){
  if(route==="dash")renderDash();
  else if(route==="detail")renderDetail();
  else if(route==="trainings")renderTrainings();
  else if(route==="emails")renderEmails();
  buildNav();
}
function markSynced(){
  const e=$("#syncTime"); if(!e)return;
  try{ e.textContent=t("lastSync", new Date().toLocaleTimeString(S.lang==='en'?'en-GB':'de-DE',{hour:'2-digit',minute:'2-digit'})); }catch(_){}
}
let syncing=false;
async function syncNow(){
  if(!LIVE){ toast(t("syncDemo"),"warn"); return; }
  if(syncing)return; syncing=true;
  const b=$("#syncBtn"); if(b)b.classList.add("spin");
  try{ await pull(); reAnchorCurTg(); render(); markSynced(); toast(t("synced"),"good"); }
  catch(e){ toast(t("syncFail"),"crit"); }
  finally{ syncing=false; if(b)b.classList.remove("spin"); }
}
function startPolling(){
  if(!LIVE||pollTimer)return;
  const ms=(window.ETAF&&window.ETAF.pollMs)||8000;
  pollTimer=setInterval(async()=>{
    try{ await pull(); reAnchorCurTg(); renderCurrent(); markSynced(); }catch(e){}
  }, ms);
}
function stopPolling(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
/* Merkt sich die aktuelle Ansicht, damit ein Browser-Reload dort wieder landet. */
function saveView(){ try{ localStorage.setItem("etaf_view", JSON.stringify({route, tg:curTg?curTg.id:null})); }catch(e){} }
function restoreView(){
  try{ const v=JSON.parse(localStorage.getItem("etaf_view")||"null"); if(!v||!v.route)return;
    route=v.route;
    if(route==="detail"){ const tg=v.tg&&S.trainings.find(x=>x.id===v.tg); if(tg)curTg=tg; else route="dash"; }
  }catch(e){}
}

/* ---------- MATCHING (simulierte KI-Vorauswahl) ---------- */
function scoreTrainer(tr,tg){
  let s=40;
  if(tr.spec.includes(tg.spec))s+=34; else if(tr.spec.some(x=>SPEC.indexOf(x)%2===SPEC.indexOf(tg.spec)%2))s+=10;
  if(tg.country==="UAE"&&tr.uae)s+=14;
  if(tg.country==="UAE"&&tr.langs.includes("AR"))s+=6;
  if(tg.country!=="UAE"&&tr.region.startsWith("DE"))s+=8;
  s+=(3-tr.load)*4;
  s+=(parseFloat(tr.rating)-4)*10;
  return Math.max(35,Math.min(99,Math.round(s)));
}
function ranked(tg){
  return S.trainers.map(tr=>{const e=tg.roster.find(r=>r.trainerId===tr.id)||{};
    return {tr,fit:scoreTrainer(tr,tg),status:e.status||null,reminded:!!e.reminded,flight:e.flight||null};})
    .sort((a,b)=>b.fit-a.fit);
}
function rosterStats(tg){
  const yes=tg.roster.filter(r=>r.status==="yes"||r.status==="confirmed").length;
  const maybe=tg.roster.filter(r=>r.status==="maybe").length;
  const asked=tg.roster.filter(r=>r.status==="asked").length;
  return {yes,maybe,asked,need:tg.need};
}
function statusOf(tg){
  const{yes,need}=rosterStats(tg);
  if(yes>=need)return{cls:"good",key:"st_full"};
  if(yes>=Math.ceil(need*0.6))return{cls:"warn",key:"st_partial"};
  if(yes>0||rosterStats(tg).asked>0)return{cls:"warn",key:"st_req"};
  return{cls:"crit",key:"st_under"};
}
const SPCLS={asked:"info",yes:"good",maybe:"warn",no:"crit",confirmed:"good"};
const spCls=s=>SPCLS[s];
const spLabel=s=>t("sp_"+s);

function clientStats(cid){
  const list=S.trainings.filter(t=>t.clientId===cid);
  const good=list.filter(t=>statusOf(t).cls==="good").length;
  const crit=list.filter(t=>statusOf(t).cls==="crit").length;
  const open=list.reduce((a,t)=>a+rosterStats(t).asked,0);
  const cls=crit?"crit":(good===list.length&&list.length)?"good":"warn";
  const key=crit?"pf_crit":(good===list.length&&list.length)?"pf_done":"pf_prog";
  return {list,total:list.length,good,crit,open,cls,key};
}

let pin="";
function buildKeys(){
  const k=$("#keys");
  const layout=["1","2","3","4","5","6","7","8","9","clear","0","del"];
  k.innerHTML=layout.map(x=>{
    if(x==="clear")return `<button class="ghost" data-k="clear">${t("keyClear")}</button>`;
    if(x==="del")return `<button class="ghost" data-k="del">←</button>`;
    return `<button data-k="${x}">${x}</button>`;
  }).join("");
  $$("#keys button").forEach(b=>b.onclick=()=>press(b.dataset.k));
}
function press(k){
  if(k==="clear"){pin="";}
  else if(k==="del"){pin=pin.slice(0,-1);}
  else if(pin.length<6){pin+=k;}
  drawDots();
  if(pin.length===6)setTimeout(tryUnlock,140);
}
function drawDots(){$$("#dots span").forEach((s,i)=>s.classList.toggle("on",i<pin.length));}
function pinError(){const d=$("#dots");d.classList.add("err");setTimeout(()=>d.classList.remove("err"),450);pin="";drawDots();}
async function tryUnlock(){
  if(pin.length!==6){pinError();return;}
  if(LIVE){
    try{
      const d=await apiCall("login",{pin});
      AUTH=d.token; try{localStorage.setItem("etaf_token",AUTH);}catch(e){}
      await pull(); unlock();
    }catch(e){ pinError(); toast(e.message||"Login fehlgeschlagen","crit"); }
  } else { unlock(); }
}
function unlock(){$("#lock").style.display="none";$("#app").style.display="grid";render();startPolling();}
function lockNow(){stopPolling();pin="";drawDots();$("#lock").style.display="grid";$("#app").style.display="none";}
document.addEventListener("keydown",e=>{
  if($("#lock").style.display==="none")return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==="Backspace")press("del");
});

  .sort((a,b)=>(a.resolvedAt?1:0)-(b.resolvedAt?1:0) || String(b.at||"").localeCompare(String(a.at||""))); }

function healthStatus(){
  const conf=(typeof conflictKeys==="function")?conflictKeys():new Set();
  const under=S.trainings.filter(tg=>rosterStats(tg).yes<(tg.need||0)).length;
  const open=S.trainings.reduce((a,tg)=>a+rosterStats(tg).asked,0);
  const conflicts=conf.size;
  // Reisepass-Ablauf
  let ppExpired=0, ppSoon=0;
  (S.trainers||[]).forEach(tr=>{ const h=passportHealth(tr.passport);
    if(h.level==="crit"&&h.days!=null&&h.days<0) ppExpired++;
    else if(h.level==="crit"||h.level==="warn") ppSoon++; });
  const inbox=(typeof inboxCount==="function")?inboxCount():0;
  const level = (conflicts>0||ppExpired>0) ? "red" : (under>0||open>0||ppSoon>0||inbox>0) ? "amber" : "green";
  return {level,conflicts,under,open,ppExpired,ppSoon,inbox};
}
function clientHealth(cid){
  const tgs=S.trainings.filter(t=>t.clientId===cid);
  const seen={}; let conflicts=0;
  tgs.forEach(tg=>(tg.roster||[]).forEach(r=>{
    if(!["yes","confirmed","maybe","asked"].includes(r.status))return;
    if(!(tg.kw||tg.date))return;
    const k=r.trainerId+"|"+(tg.kw||tg.date); seen[k]=(seen[k]||0)+1;
  }));
  for(const k in seen) if(seen[k]>1) conflicts++;
  const under=tgs.filter(tg=>rosterStats(tg).yes<(tg.need||0)).length;
  const open=tgs.reduce((a,tg)=>a+rosterStats(tg).asked,0);
  const level=conflicts>0?"red":(under>0||open>0)?"amber":"green";
  return {level,conflicts,under,open};
}

    </div>`;
  }).join("");

  const timeline=`<div class="panel">
    <div class="panel-h"><h3>${t("tlTitle")}</h3><div class="sub">${t("tlSub")}</div>

let suggEdit={};
function suggState(tgId){ return suggEdit[tgId] || (suggEdit[tgId]={hidden:[],add:[]}); }
function suggHide(tgId,trId){ const s=suggState(tgId); if(!s.hidden.includes(trId))s.hidden.push(trId); s.add=s.add.filter(x=>x!==trId); renderDetail(); }
function suggAddPick(tgId,trId){ if(!trId)return; const s=suggState(tgId); if(!s.add.includes(trId))s.add.push(trId); s.hidden=s.hidden.filter(x=>x!==trId); renderDetail(); }
function suggReset(tgId){ suggEdit[tgId]={hidden:[],add:[]}; renderDetail(); }

/* Nach manueller Statusänderung: Trainer per Mail informieren (Text anpassbar,
   mit den bekannten Ja/Vielleicht/Nein-Buttons zur Bestätigung). */
function statusNotifyTemplate(tr,tg,status,lang){
  const first=(tr.name||"").replace(/^Dr\.\s*/,"").split(" ")[0];
  const when=whenLabel(tg)||"";
  const where=[tg.city,tg.country].filter(Boolean).join(", ");
  const head=lang==="de"?`Hallo ${first},`:`Hi ${first},`;
  const foot=lang==="de"?"Herzliche Grüße\nETAF-Koordination":"Best regards\nETAF Coordination";
  const mid = lang==="de" ? {
    yes:`kurze Info: Wir haben dich für „${tg.topic}“ in ${where} (${when}) fest eingeplant (Status: Zugesagt).\n\nBitte bestätige über die Buttons unten kurz, dass das für dich passt — oder gib uns Bescheid, falls nicht.`,
    maybe:`kurze Info: Wir haben dich für „${tg.topic}“ in ${where} (${when}) auf „Vielleicht“ gesetzt.\n\nSobald du sicher weißt, ob es klappt, gib uns bitte über die Buttons unten Bescheid.`,
    no:`kurze Info: Wir haben dich für „${tg.topic}“ in ${where} (${when}) ausgetragen (Status: Abgesagt).\n\nFalls das nicht stimmt oder du doch kannst, gib uns über die Buttons unten kurz Bescheid.`,
    asked:`wir würden dich gern für „${tg.topic}“ in ${where} (${when}) anfragen.\n\nBist du verfügbar? Ein Klick auf die Buttons unten genügt.`,
  } : {
    yes:`quick update: We have scheduled you for "${tg.topic}" in ${where} (${when}) — status: Confirmed.\n\nPlease confirm via the buttons below that this works for you — or let us know if it doesn't.`,
    maybe:`quick update: We have set you to "Maybe" for "${tg.topic}" in ${where} (${when}).\n\nOnce you know for sure, please let us know via the buttons below.`,
    no:`quick update: We have removed you from "${tg.topic}" in ${where} (${when}) — status: Declined.\n\nIf that's not right or you can make it after all, just let us know via the buttons below.`,
    asked:`we would like to request your availability for "${tg.topic}" in ${where} (${when}).\n\nAre you available? One click on the buttons below is enough.`,
  };
  return `${head}\n\n${mid[status]||mid.asked}\n\n${foot}`;
}

/* Historie: alle Trainings, bei denen der Trainer zugesagt/bestätigt/vielleicht ist,
   plus früher bewertete Einsätze, deren Training nicht (mehr) im Plan steht. */
function trainerHistory(tr){
  const rel=["yes","confirmed","maybe"]; const rows=[]; const seen=new Set();
  S.trainings.forEach(tg=>{
    const r=(tg.roster||[]).find(x=>x.trainerId===tr.id);
    if(!r||!rel.includes(r.status)) return;
    seen.add(String(tg.id));
    rows.push({tgId:String(tg.id), label:`${tg.topic} · ${whenText(tg)||""}`.trim()});
  });
  (tr.reviews||[]).forEach(rv=>{
    if(seen.has(String(rv.trainingId))) return;
    rows.push({tgId:String(rv.trainingId), label:rv.label||("#"+rv.trainingId), orphan:true});
  });
  return rows.sort((a,b)=>b.label.localeCompare(a.label));
}

/* ============================================================
   REISEPASS je Trainer — einmal hinterlegt, mit Verfallsdatum, Ampel,
   Foto-Upload + KI-Auslesen. Erinnerung läuft über die Automatik.
   ============================================================ */
function ppLeadDays(){ return (S.settings&&S.settings.passport_lead_days)||180; }
/* Ampel-Status eines Passes: crit=abgelaufen/sehr knapp, warn=läuft bald ab, ok=gültig, none=nicht hinterlegt */
function passportHealth(pp){
  if(!pp || !pp.expiry) return {level:pp?"nodate":"none", days:null};
  const exp=new Date(pp.expiry+"T00:00:00"); if(isNaN(exp)) return {level:"nodate",days:null};
  const days=Math.floor((exp-new Date(new Date().toDateString()))/86400000);
  const lead=ppLeadDays();
  const level = days<0 ? "crit" : days<=Math.min(60,lead) ? "crit" : days<=lead ? "warn" : "ok";
  return {level,days};
}
const PP_DOT={ok:"var(--good)",warn:"var(--warn)",crit:"var(--crit)",nodate:"var(--muted)",none:"var(--line)"};
function passportChip(tr){
  const pp=tr.passport, h=passportHealth(pp);
  const dot=`<span style="width:9px;height:9px;border-radius:50%;background:${PP_DOT[h.level]||'var(--line)'};flex:none;display:inline-block"></span>`;
  let label;
  if(h.level==="none") label=`<span class="meta">${t("ppNone")}</span>`;
  else if(h.level==="nodate") label=`<span class="meta">${t("ppNoExpiry")}</span>`;
  else if(h.days<0) label=`<b style="color:var(--crit)">${t("ppExpired")}</b> <span class="meta">${fmtDate(pp.expiry)}</span>`;
  else if(h.level!=="ok") label=`<b style="color:${h.level==='crit'?'var(--crit)':'var(--warn)'}">${t("ppExpSoon",h.days)}</b> <span class="meta">${fmtDate(pp.expiry)}</span>`;
  else label=`<span class="meta">${t("ppExpValid")} · ${fmtDate(pp.expiry)}</span>`;
  return `<div style="display:flex;gap:8px;align-items:center">${ic("id",15)}${dot}${label}</div>`;
}
/* Datum hübsch: YYYY-MM-DD → DD.MM.YYYY (de) / DD Mon YYYY (en) */
function fmtDate(iso){
  if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return S.lang==="de" ? d.toLocaleDateString("de-DE") : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

async function ppFileChosen(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  if(file.size>8*1024*1024){ toast(t("ppBig"),"crit"); return; }
  const dataUrl=await downscaleImage(file, 1600, 0.82);
  ppEditImg=dataUrl;
  // Vorschau sofort + optional KI-Auslesen
  const cur=collectPassport(); cur.hasFile=true; drawPassport(cur);
  const im=$("#ppThumb"); if(im){ im.src=dataUrl; im.style.display=""; }
  if(!LIVE){ $("#ppScanMsg").textContent=t("ppScanDemo"); return; }
  const msg=$("#ppScanMsg"); if(msg){ msg.textContent="… "+t("ppScanning"); }
  try{
    const d=await apiCall("passport.scan",{image:dataUrl}); const p=d.data||{};
    if($("#ppNo")&&!$("#ppNo").value) $("#ppNo").value=p.number||"";
    if($("#ppNm")) $("#ppNm").value=$("#ppNm").value||p.full_name||[p.given_names,p.surname].filter(Boolean).join(" ");
    if($("#ppNat")&&!$("#ppNat").value) $("#ppNat").value=p.nationality||"";
    if($("#ppBd")&&!$("#ppBd").value&&/^\d{4}-\d{2}-\d{2}$/.test(p.birthdate||"")) $("#ppBd").value=p.birthdate;
    if($("#ppExp")&&!$("#ppExp").value&&/^\d{4}-\d{2}-\d{2}$/.test(p.expiry||"")) $("#ppExp").value=p.expiry;
    if(msg) msg.textContent=t("ppScanOk");
  }catch(e){ if(msg) msg.textContent=t("ppScanErr")+": "+e.message; }
}

/* Bild clientseitig verkleinern → JPEG-DataURL (spart Speicher & Upload). */
function downscaleImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ let{width:w,height:h}=img; const sc=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ resolve(c.toDataURL("image/jpeg",quality)); }catch(e){ resolve(fr.result); } };
      img.onerror=()=>resolve(fr.result); img.src=fr.result; };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}

/* ============================================================
   BELEGUNG / BUCHUNGEN — Steuerzentrale: Filter (Trainer/Kunde/Status/
   Monat/Suche), Gruppierung, Doppelbuchungs-Warnung, CSV-Export
   ============================================================ */
let bookingTr="all", bookingStatus="all", bookingClient="all", bookingMonth="all",
    bookingSearch="", bookingGroup="none", bookingView="list";
function clientOf(tg){ return (S.clients||[]).find(c=>c.id===tg.clientId)||null; }
function bookingMonthKey(tg){ return tg.month || (tg.date?String(tg.date).slice(0,7):"") || tg.kw || ""; }
function allBookings(){
  const rel=["yes","confirmed","maybe","asked"]; const out=[];
  S.trainings.forEach(tg=>(tg.roster||[]).forEach(r=>{
    if(!rel.includes(r.status))return;
    const tr=S.trainers.find(t=>t.id===r.trainerId); if(!tr)return;
    out.push({tr,tg,status:r.status,flight:r.flight});
  }));
  return out.sort((a,b)=>
    String(a.tg.date||a.tg.kw||"zzz").localeCompare(String(b.tg.date||b.tg.kw||"zzz"))
    || a.tr.name.localeCompare(b.tr.name));
}
/* Schlüssel Trainer+KW; Konflikt = Trainer mehrfach in derselben KW gebucht. */
function bkKey(x){ return x.tr.id+"|"+(x.tg.kw||x.tg.date||""); }
function conflictKeys(){
  const seen={}, conf=new Set();
  allBookings().forEach(x=>{ if(!(x.tg.kw||x.tg.date))return; const k=bkKey(x); seen[k]=(seen[k]||0)+1; });
  for(const k in seen) if(seen[k]>1) conf.add(k);
  return conf;
}
function filteredBookings(){
  let list=allBookings();
  if(bookingTr!=="all")     list=list.filter(x=>x.tr.id===bookingTr);
  if(bookingClient!=="all") list=list.filter(x=>(x.tg.clientId||"")===bookingClient);
  if(bookingStatus!=="all") list=list.filter(x=> bookingStatus==="yes"
    ? (x.status==="yes"||x.status==="confirmed") : x.status===bookingStatus);
  if(bookingMonth!=="all")  list=list.filter(x=>bookingMonthKey(x.tg)===bookingMonth);
  const q=bookingSearch.trim().toLowerCase();
  if(q) list=list.filter(x=>{ const cl=clientOf(x.tg);
    return [x.tr.name,x.tg.topic,x.tg.city,x.tg.country,x.tg.kw,x.tg.spec,cl?cl.name:""]
      .filter(Boolean).join(" ").toLowerCase().includes(q); });
  return list;
}
function bkRow(x,conf){

    <td class="nowrap"><div style="display:flex;gap:6px;justify-content:flex-end">

      <button class="btn sm" title="${t("planView")}" onclick="event.stopPropagation();openPlan('${x.tr.id}')">${ic("clip",15)}</button>
    </div></td>
  </tr>`;

function groupBookings(list){
  if(bookingGroup==="none") return [["",list]];
  const keyFn = bookingGroup==="trainer" ? x=>x.tr.name
    : bookingGroup==="client" ? x=>{const c=clientOf(x.tg);return c?c.name:t("bkNoClient");}
    : x=>bookingMonthKey(x.tg)||"—";
  const g={}, order=[];
  list.forEach(x=>{const k=keyFn(x); if(!(k in g)){g[k]=[];order.push(k);} g[k].push(x);});
  if(bookingGroup!=="month") order.sort((a,b)=>a.localeCompare(b));
  return order.map(k=>[k,g[k]]);
}

  $("#v-bookings").innerHTML=`

          <b>${t("bkCount",list.length)}</b>

        </div>
        <span class="segbtn">${vbtn("list",ic("list")+t("bkViewList"))}${vbtn("calendar",ic("grid")+t("bkViewCal"))}</span>
        ${bookingClient!=="all"?`<button class="btn sm" onclick="openTransfer('${bookingClient}')">${ic("plane")}${t("trfBtn")}</button>`:""}
        <button class="btn sm" onclick="exportBookingsCSV()">${ic("down")}CSV</button>

function exportBookingsCSV(){
  const list=filteredBookings();
  const esc=s=>`"${String(s==null?"":s).replace(/"/g,'""')}"`;
  const head=["Trainer",t("planColStatus"),t("planColWhen"),t("bkClient"),t("planColWhere"),t("planColWhat"),"Reise"];
  const lines=[head.map(esc).join(";")];
  list.forEach(x=>{const tg=x.tg,cl=clientOf(tg);
    lines.push([x.tr.name, spLabel(x.status), [tg.date,tg.kw].filter(Boolean).join(" "),
      cl?cl.name:"", [tg.city,tg.country].filter(Boolean).join(", "), tg.topic,
      travelParts(x.flight,tg).join(" · ")].map(esc).join(";"));
  });
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="ETAF-Belegung.csv"; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast(t("bkCsvToast",list.length),"good");
}
function kwNum(k){ const m=/(\d+)/.exec(k||""); return m?+m[1]:9999; }
function renderCalendar(list){
  if(!list.length) return `<div class="panel"><div class="panel-b"><div class="meta" style="padding:12px">${t("bkCalEmpty")}</div></div></div>`;
  // Wochen-Spalten (KW) mit frühestem Datum als Sortier-/Anzeigehilfe
  const wk={};
  list.forEach(x=>{ const k=x.tg.kw||"—"; if(!wk[k])wk[k]={kw:k,minDate:x.tg.date||""};
    if(x.tg.date && (!wk[k].minDate || x.tg.date<wk[k].minDate)) wk[k].minDate=x.tg.date; });
  const weeks=Object.values(wk).sort((a,b)=>
    (a.minDate&&b.minDate) ? a.minDate.localeCompare(b.minDate) : kwNum(a.kw)-kwNum(b.kw));
  const trs=[...new Map(list.map(x=>[x.tr.id,x.tr])).values()].sort((a,b)=>a.name.localeCompare(b.name));
  const cell={};
  list.forEach(x=>{ const k=x.tr.id+"|"+(x.tg.kw||"—"); (cell[k]=cell[k]||[]).push(x); });
  const head=`<tr><th class="calcorner">${t("bkCalTrainer")}</th>`+
    weeks.map(w=>`<th class="calh"><div>${esc(kwLabel(w.kw))}</div>${w.minDate?`<div class="calhd">${esc(shortDay(w.minDate))}</div>`:""}</th>`).join("")+`</tr>`;
  const rows=trs.map(tr=>{
    const tds=weeks.map(w=>{
      const items=cell[tr.id+"|"+w.kw]||[]; const clash=items.length>1;
      const chips=items.map(x=>{ const cl=clientOf(x.tg); const st=x.status==='confirmed'?'yes':x.status;
        return `<span class="calchip s-${st}" style="--cc:${cl?cl.color:'#888'}" title="${esc(x.tg.topic+' · '+(x.tg.city||'')+' · '+spLabel(x.status))}" onclick="openDetail('${x.tg.id}')">${esc(x.tg.city||x.tg.topic)}</span>`;
      }).join("");
      return `<td class="calcell${clash?' clash':''}">${chips}</td>`;
    }).join("");
    return `<tr><th class="calname"><span class="av xs" style="background:${tr.color}">${initials(tr.name)}</span>${esc(tr.name)}</th>${tds}</tr>`;
  }).join("");
  const legend=`<div class="callegend"><b>${t("bkLegend")}</b>
    <span class="lg"><span class="calchip s-yes" style="--cc:#3E4852">${t("bkLegYes")}</span></span>
    <span class="lg"><span class="calchip s-maybe" style="--cc:#3E4852">${t("bkLegMaybe")}</span></span>
    <span class="lg"><span class="calchip s-asked" style="--cc:#3E4852">${t("bkLegAsked")}</span></span>
    <span class="lg"><span class="clashdot"></span>${t("bkLegClash")}</span></div>`;
  return `<div class="panel"><div class="panel-b">
    <div class="tscroll"><table class="calgrid">${head}${rows}</table></div>${legend}</div></div>`;
}
function planBadge(tr){
  const p=tr.plan; if(!p)return "";
  if(p.confirmedAt&&p.status==="ok")   return `<span class="pill good">${t("planOk")}</span>`;
  if(p.confirmedAt&&p.status==="issue")return `<span class="pill crit">${t("planIssue")}</span>`;
  if(p.sentAt)                         return `<span class="pill neutral">${t("planSent")}</span>`;
  return "";
}

function fmtWhen(s){
  if(!s) return ""; const d=new Date(String(s).replace(" ","T")); if(isNaN(d)) return fmtDate((s||"").slice(0,10));
  return fmtDate((s||"").slice(0,10))+" · "+d.toLocaleTimeString(S.lang==="de"?"de-DE":"en-GB",{hour:"2-digit",minute:"2-digit"});
}

let curPlanTr=null;
function trainerSchedule(trId){
  const relevant=["yes","confirmed","maybe","asked"];
  return S.trainings
    .map(tg=>{const r=(tg.roster||[]).find(x=>x.trainerId===trId); return r&&relevant.includes(r.status)?{tg,status:r.status,flight:r.flight}:null;})
    .filter(Boolean)
    .sort((a,b)=>String(a.tg.date||a.tg.kw||"zzz").localeCompare(String(b.tg.date||b.tg.kw||"zzz")));
}
function travelParts(fl,tg){
  const L=S.lang==='de'
    ?{arr:'Anreise',dep:'Abreise',out:'Hinflug',ret:'Rückflug',hotel:'Hotel',room:'Zimmer',visa:'Visum',pass:'Pass gültig bis'}
    :{arr:'Arrival',dep:'Departure',out:'Outbound',ret:'Return',hotel:'Hotel',room:'Room',visa:'Visa',pass:'Passport until'};
  const p=[]; const hotel=tg&&tg.travel&&tg.travel.hotel;
  if(fl){
    if(fl.arrival)p.push(`${L.arr} ${fl.arrival}`);
    if(fl.departure)p.push(`${L.dep} ${fl.departure}`);
    if(fl.flightOut)p.push(`${L.out} ${fl.flightOut}`);
    if(fl.flightReturn)p.push(`${L.ret} ${fl.flightReturn}`);
  }
  if(hotel)p.push(`${L.hotel} ${hotel}`);
  if(fl&&fl.room)p.push(`${L.room} ${fl.room}`);
  if(fl&&fl.visaStatus&&fl.visaStatus!=='none')p.push(`${L.visa}: ${t("visa_"+fl.visaStatus)}`);
  if(fl&&fl.passportExpiry)p.push(`${L.pass} ${fl.passportExpiry}`);
  return p;
}
function travelLine(fl,tg){ return travelParts(fl,tg).map(esc).join(" · "); }

/* ---- Datum: echte Zeiträume statt nur KW ---- */
const MONTHS={de:["","Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
              en:["","January","February","March","April","May","June","July","August","September","October","November","December"]};
function pad2(n){return String(n).padStart(2,"0");}
function pdate(s){ if(!s)return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m?{y:+m[1],mo:+m[2],d:+m[3]}:null; }
function shiftD(x,delta){ const dt=new Date(x.y,x.mo-1,x.d+delta); return {y:dt.getFullYear(),mo:dt.getMonth()+1,d:dt.getDate()}; }
function fmtDateRange(s,e,lang){
  lang=lang||S.lang; const mon=MONTHS[lang==='en'?'en':'de'];
  const P=pdate(s); if(!P)return "";
  const Q=pdate(e);
  const dm=x=> lang==='de' ? `${x.d}. ${mon[x.mo]}` : `${x.d} ${mon[x.mo]}`;
  if(!Q || (P.y===Q.y&&P.mo===Q.mo&&P.d===Q.d)) return `${dm(P)} ${P.y}`;
  if(P.y===Q.y&&P.mo===Q.mo) return lang==='de' ? `${P.d}.–${Q.d}. ${mon[P.mo]} ${P.y}` : `${P.d}–${Q.d} ${mon[P.mo]} ${P.y}`;
  return `${dm(P)} – ${dm(Q)} ${Q.y}`;
}
/* Reisefenster: ein Tag vor Beginn bis ein Tag nach Ende (An-/Abreise-Puffer). */
function fmtTravelWindow(s,e,lang){
  const P=pdate(s); if(!P)return ""; const Q=pdate(e)||P;
  const a=shiftD(P,-1), b=shiftD(Q,1);
  return fmtDateRange(`${a.y}-${pad2(a.mo)}-${pad2(a.d)}`,`${b.y}-${pad2(b.mo)}-${pad2(b.d)}`,lang);
}
function shortDay(s){ const P=pdate(s); return P?`${pad2(P.d)}.${pad2(P.mo)}`:""; }
/* Kalenderwoche sprachabhängig: "KW 20" (de) → "Week 20" (en). */
function kwLabel(kw,lang){ lang=lang||S.lang; return (lang==='en') ? String(kw||"").replace(/^\s*KW\s*/,"Week ") : (kw||""); }
/* Zeitraum-Anzeige: echtes Datum wenn vorhanden, sonst KW/Monat. */
function whenText(tg){ return fmtDateRange(tg.date,tg.dateEnd) || kwLabel(tg.kw) || tg.month || ""; }
function openPlan(trId){ curPlanTr=S.trainers.find(t=>t.id===trId)||null; route="plan"; render(); }
function renderPlan(){
  const tr=curPlanTr; if(!tr){go("trainers");return;}
  const sched=trainerSchedule(tr.id);
  const cnt={yes:0,maybe:0,asked:0};
  sched.forEach(x=>{ if(x.status==="yes"||x.status==="confirmed")cnt.yes++; else if(x.status==="maybe")cnt.maybe++; else cnt.asked++; });
  const p=tr.plan;
  const confirmLine = p&&p.confirmedAt
    ? `<div class="planconf ${p.status==="issue"?"bad":"ok"}">${p.status==="issue"
        ? `${ic("alert")}${t("planIssueMsg")}${p.note?`: „${esc(p.note)}“`:""}`
        : `${ic("check")}${t("planOkMsg")}`} <span class="meta">(${esc((p.confirmedAt||"").slice(0,16).replace("T"," "))})</span></div>`
    : (p&&p.sentAt ? `<div class="planconf sent">${ic("send")}${t("planSentMsg")} <span class="meta">(${esc((p.sentAt||"").slice(0,16).replace("T"," "))})</span></div>` : "");

  const rows=sched.length ? sched.map(x=>{
    const tg=x.tg, cl=(S.clients||[]).find(c=>c.id===tg.clientId);
    const when=whenText(tg);
    const kwSub=(tg.kw && fmtDateRange(tg.date,tg.dateEnd))?kwLabel(tg.kw):"";
    const sub=[tg.spec||"", cl?cl.name:""].filter(Boolean).join(" · ");
    const trav=travelLine(x.flight,tg);
    const twin=fmtTravelWindow(tg.date,tg.dateEnd);
    return `<tr class="clickrow" title="${t("bkOpenModule")}" onclick="openDetail('${tg.id}')">
      <td><span class="pill ${spCls(x.status)}">${spLabel(x.status)}</span></td>
      <td class="nowrap">${esc(when||"—")}${kwSub?`<div class="meta">${esc(kwSub)}</div>`:""}</td>
      <td>${esc(tg.city||"")}${tg.country?", "+esc(tg.country):""}</td>
      <td><b>${esc(tg.topic)}</b>${sub?`<div class="meta">${esc(sub)}</div>`:""}${twin?`<div class="meta">${ic("plane")}${t("travelWin")}: ${esc(twin)}</div>`:""}${trav?`<div class="meta travrow">${ic("bag")}${trav}</div>`:""}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" class="meta" style="padding:16px 8px">${t("planEmpty")}</td></tr>`;

  $("#v-plan").innerHTML=`
    <button class="btn sm noprint" onclick="go('trainers')" style="margin-bottom:14px">${ic("back")}${t("back")}</button>
    <div class="panel plandoc"><div class="panel-b">
      <div class="planhead">
        <div>
          <div class="planlogo">ETAF<span>.</span></div>
          <h2 style="margin:6px 0 2px">${t("planTitle")}</h2>
          <div class="meta">${esc(tr.name)} · ✉︎ ${esc(tr.email||"—")}${tr.phone?" · ☎ "+esc(tr.phone):""}</div>
        </div>
        <div class="plansum">
          <span class="pill good">${t("sp_yes")}: ${cnt.yes}</span>
          <span class="pill warn">${t("sp_maybe")}: ${cnt.maybe}</span>
          <span class="pill neutral">${t("sp_asked")}: ${cnt.asked}</span>
        </div>
      </div>
      ${confirmLine}
      <div class="tscroll"><table class="plantable">
        <tr><th>${t("planColStatus")}</th><th>${t("planColWhen")}</th><th>${t("planColWhere")}</th><th>${t("planColWhat")}</th></tr>
        ${rows}
      </table></div>
      <div class="meta planfoot">${t("planFoot")}</div>
    </div></div>
    <div class="planactions noprint">
      <button class="btn" onclick="printPlan()">${ic("printer")}${t("planPrint")}</button>
      <button class="btn primary" onclick="sendPlan('${tr.id}')">${ic("send")}${t("planSend")}</button>
    </div>`;
}
function printPlan(){ document.body.classList.add("printing-plan"); window.print(); setTimeout(()=>document.body.classList.remove("printing-plan"),400); }
async function sendPlan(trId){
  const tr=S.trainers.find(t=>t.id===trId); if(!tr)return;
  if(!tr.email){ toast(t("planNoMail"),"crit"); return; }
  if(LIVE){
    try{ const d=await apiCall("plan.send",{trainer:trId,lang:trainerLang(tr)});
      await pull(); curPlanTr=S.trainers.find(t=>t.id===trId)||curPlanTr; renderPlan();
      toast(t("planSentToast",tr.name.split(" ").slice(-1)),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
  } else {
    demoLog(tr.email, t("planSubject"), trainerLang(tr), "logged");
    toast(t("planSentToast",tr.name.split(" ").slice(-1)),"good");
  }
}

let curTransferCl=null;
function clientTransferRows(clientId){
  const out=[];
  S.trainings.filter(tg=>tg.clientId===clientId).forEach(tg=>(tg.roster||[]).forEach(r=>{
    if(r.status!=="yes"&&r.status!=="confirmed")return;
    const tr=S.trainers.find(t=>t.id===r.trainerId); if(!tr)return;
    out.push({tg,tr,flight:r.flight});
  }));
  return out.sort((a,b)=>String(a.tg.date||"zzz").localeCompare(String(b.tg.date||"zzz"))||a.tr.name.localeCompare(b.tr.name));
}
function openTransfer(clientId){ curTransferCl=(S.clients||[]).find(c=>c.id===clientId)||null; route="transfer"; render(); }

  const cl=curTransferCl; if(!cl){go("bookings");return;}

    ? `<div class="planconf ok">${ic("check")}${t("trfConfirmed")} <span class="meta">(${esc((tr.confirmedAt||"").slice(0,16).replace("T"," "))})</span>${tr.note?` — „${esc(tr.note)}“`:""}</div>`

    const hotel=[(tg.travel&&tg.travel.hotel)||"",fl.room||""].filter(Boolean).join(" · ");
    return `<tr>
      <td><div class="bktr"><span class="av xs" style="background:${x.tr.color}">${initials(x.tr.name)}</span><b>${esc(x.tr.name)}</b></div>${x.tr.phone?`<div class="meta">☎ ${esc(x.tr.phone)}</div>`:""}</td>
      <td>${esc(arr||"—")}</td><td>${esc(dep||"—")}</td><td>${esc(hotel||"—")}</td>
      <td><b>${esc(tg.topic)}</b><div class="meta">${esc(tg.city||"")}${tg.country?", "+esc(tg.country):""}${tg.date?" · "+esc(fmtDateRange(tg.date,tg.dateEnd)):""}</div></td>
    </tr>`;
  }).join(""):`<tr><td colspan="5" class="meta" style="padding:16px 8px">${t("trfEmpty")}</td></tr>`;
  $("#v-transfer").innerHTML=`
    <button class="btn sm noprint" onclick="go('bookings')" style="margin-bottom:14px">${ic("back")}${t("back")}</button>
    <div class="panel plandoc"><div class="panel-b">
      <div class="planhead"><div>
        <div class="planlogo">ETAF<span>.</span></div>
        <h2 style="margin:6px 0 2px">${t("trfTitle")}</h2>

      </div></div>
      ${conf}
      <div class="tscroll"><table class="plantable">
        <tr><th>${t("bkTrainer")}</th><th>${t("trfArr")}</th><th>${t("trfDep")}</th><th>${t("trfHotel")}</th><th>${t("planColWhat")}</th></tr>

      <div class="meta planfoot">${t("trfFoot")}</div>

      <button class="btn primary" onclick="sendTransfer('${cl.id}')">${ic("send")}${t("trfSend")}</button>
      ${(tr&&tr.sentAt&&!tr.confirmedAt)?`<button class="btn" onclick="remindTransfer('${cl.id}')">${ic("bell")}${t("trfRemind")}</button>`:""}

let compose={tgId:null,recips:[],tplId:"t1",lang:"en"};
function fillTpl(str,tg,tr){
  const lang=(typeof compose!=="undefined"&&compose&&compose.lang)?compose.lang:(S.emailLang||S.lang);
  return str
    .replace(/{{firstName}}/g,tr?tr.name.replace(/^Dr\.\s*/,"").split(" ")[0]:"{{firstName}}")
    .replace(/{{topic}}/g,tg.topic).replace(/{{city}}/g,tg.city)
    .replace(/{{country}}/g,tg.country).replace(/{{kw}}/g,kwLabel(tg.kw,lang))
    .replace(/{{month}}/g,tg.month).replace(/{{teamSize}}/g,tg.need);
}
function composeFor(tgId,trId,tplId){
  const tg=S.trainings.find(t=>t.id===tgId);
  let auto=trId?[trId]:ranked(tg).filter(x=>!x.status);
  if(!trId){ const seen=new Set();   // pro E-Mail nur einmal vorschlagen (Dubletten-Schutz)
    auto=auto.filter(x=>{const e=(x.tr.email||"").toLowerCase(); if(!e)return true; if(seen.has(e))return false; seen.add(e); return true;})
      .slice(0,tg.need).map(x=>x.tr.id); }
  // Bei genau einem Empfänger: Ansprache-Sprache aus dem Trainerprofil vorwählen
  const lang0 = auto.length===1 ? trainerLang(S.trainers.find(x=>x.id===auto[0])) : (S.emailLang||"en");
  compose={tgId,recips:auto, tplId:tplId||"t1", lang:lang0, purpose:"ask"};
  drawComposer();openSheet();
}
function setComposeLang(l){compose.lang=l;S.emailLang=l;save();drawComposer();}

    </div>

  $("#sheetFoot").innerHTML=`

}
function pickTpl(id){compose.tplId=id;drawComposer();}
function rmRecip(id){compose.recips=compose.recips.filter(x=>x!==id);drawComposer();}
function wrap(m){const el=$("#cBody");const s=el.selectionStart,e=el.selectionEnd;
  el.value=el.value.slice(0,s)+m+el.value.slice(s,e)+m+el.value.slice(e);el.focus();}
function ins(x){const el=$("#cBody");const s=el.selectionStart;
  el.value=el.value.slice(0,s)+x+el.value.slice(s);el.focus();}

async function sendCompose(){
  const subject=$("#cSubj")?$("#cSubj").value:"";
  const bodyText=$("#cBody")?$("#cBody").value:"";
  const n=compose.recips.length;
  const cancel=compose.purpose==="cancel";
  if(LIVE){
    const tgId=compose.tgId, recips=compose.recips.slice(), lang=compose.lang;
    closeSheet();
    try{
      const args={training:tgId,recipients:recips,lang,subject,body:bodyText};
      if(cancel)args.status="no";
      const d=await apiCall("request.create",args);
      await pull(); buildNav();
      if(route==="detail")renderDetail(); if(route==="dash")renderDash();
      toast(cancel?t("cancelSent",d.sent!=null?d.sent:n):t("sentToast",d.sent!=null?d.sent:n),cancel?"warn":"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  compose.recips.forEach(id=>setStatus(compose.tgId,id,cancel?"no":"asked"));
  compose.recips.forEach(id=>{const trx=S.trainers.find(t=>t.id===id); if(trx)demoLog(trx.email,subject,compose.lang,"logged");});
  closeSheet();
  toast(cancel?t("cancelSent",n):t("sentToast",n),cancel?"warn":"good");
  if(route==="detail")renderDetail();
  if(route==="dash")renderDash();
  buildNav();
  if(cancel)return;   // Absage: keine simulierten Rückläufer
  compose.recips.forEach((id,i)=>{
    setTimeout(()=>{
      if(Math.random()<0.7){
        const roll=Math.random();const st=roll<0.6?"yes":roll<0.82?"maybe":"no";
        setStatus(compose.tgId,id,st);
        const tr=S.trainers.find(t=>t.id===id);
        toast(`↩ ${tr.name.split(" ").slice(-1)}: ${spLabel(st)}`,st==="yes"?"good":st==="no"?"crit":"warn");
        if(route==="detail")renderDetail();
        if(route==="dash")renderDash();
        buildNav();
      }
    }, 2600+i*1500+Math.random()*1500);
  });
}

const AIRLINES=["LH","EW","EK","EY","OS","LX","BA"];
function flightSuggestions(tr,tg){
  const o=AIRPORTS[tr.region]||["FRA","Frankfurt"], d=DESTAP[tg.country]||["FRA","Frankfurt"];
  const seed=(tr.name.length*7+tg.topic.length*3);
  const al=AIRLINES[seed%AIRLINES.length], al2=AIRLINES[(seed+3)%AIRLINES.length];
  const n1=100+(seed*7)%800, n2=200+(seed*5)%700;
  return [
    {out:`${al} ${n1} ${o[0]}→${d[0]} 21:55–06:40 (+1)`, ret:`${al} ${n1+1} ${d[0]}→${o[0]} 02:35–07:10`},
    {out:`${al2} ${n2} ${o[0]}→${d[0]} 10:20–19:15`,      ret:`${al2} ${n2+1} ${d[0]}→${o[0]} 08:45–13:20`}
  ];
}
function showFlightSuggestions(tgId,trId){
  const tr=S.trainers.find(x=>x.id===trId), tg=S.trainings.find(x=>x.id===tgId);
  const sug=flightSuggestions(tr,tg); window._flSug=sug;
  $("#flSug").innerHTML=`<div class="meta" style="margin:8px 0 4px">${t("flSuggestHint")}</div>`+
    sug.map((s,i)=>`<div class="row" style="padding:8px 4px">
      <div class="rowgrow"><div class="nm" style="font-size:13px">${ic("plane")}${esc(s.out)}</div>
        <div class="meta">${ic("reply")}${esc(s.ret)}</div></div>
      <button class="btn sm primary" onclick="useFlight(${i})">${t("flUse")}</button></div>`).join("");
}
function useFlight(i){const s=window._flSug[i]; if($("#flOut"))$("#flOut").value=s.out; if($("#flRet"))$("#flRet").value=s.ret;}

function trainingYear(tg){const m=(tg.month||"").match(/(\d{2})\D*$/); return m?2000+parseInt(m[1],10):2026;}
function trainingKw(tg){return parseInt((tg.kw||"").replace(/\D/g,""))||1;}
function isoWeekMonday(year,week){
  const s=new Date(Date.UTC(year,0,1+(week-1)*7)); const dow=s.getUTCDay();
  if(dow<=4)s.setUTCDate(s.getUTCDate()-dow+1); else s.setUTCDate(s.getUTCDate()+8-dow);
  return s;
}
function trainingDates(tg){
  if(/^\d{4}-\d{2}-\d{2}$/.test(tg.date||"")){
    const start=new Date(tg.date+"T00:00:00Z");
    const e=/^\d{4}-\d{2}-\d{2}$/.test(tg.dateEnd||"")?new Date(tg.dateEnd+"T00:00:00Z"):new Date(start);
    const end=new Date(e); end.setUTCDate(end.getUTCDate()+1); // DTEND exklusiv
    return {start,end};
  }
  const start=isoWeekMonday(trainingYear(tg),trainingKw(tg));
  const end=new Date(start); end.setUTCDate(end.getUTCDate()+2); return {start,end};}
const MONTHS_DE=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTHS_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Zeitraum-Label: echter Datumsbereich wenn vorhanden, sonst KW · Monat */
function whenLabel(tg){
  if(/^\d{4}-\d{2}-\d{2}$/.test(tg.date||"")){
    const M=(S.lang==='de'?MONTHS_DE:MONTHS_EN);
    const s=new Date(tg.date+"T00:00:00Z");
    const e=/^\d{4}-\d{2}-\d{2}$/.test(tg.dateEnd||"")?new Date(tg.dateEnd+"T00:00:00Z"):s;
    const kw=tg.kw?` · ${kwLabel(tg.kw)}`:"";  // KW immer mit anzeigen
    if(s.getUTCMonth()===e.getUTCMonth()&&s.getUTCFullYear()===e.getUTCFullYear())
      return s.getUTCDate()+".–"+e.getUTCDate()+". "+M[e.getUTCMonth()]+" "+e.getUTCFullYear()+kw;
    return s.getUTCDate()+". "+M[s.getUTCMonth()]+" – "+e.getUTCDate()+". "+M[e.getUTCMonth()]+" "+e.getUTCFullYear()+kw;
  }
  return kwLabel(tg.kw)+(tg.month?" · "+tg.month:"");
}
function pad2(n){return String(n).padStart(2,"0");}
function icsDate(d){return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate());}
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsStamp(){try{return new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";}catch(e){return "20260101T000000Z";}}
function sortedForCal(){return curTrainings().slice().sort((a,b)=>trainingDates(a).start-trainingDates(b).start);}
function buildICS(){
  const stamp=icsStamp();
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ETAF//Trainer-Koordination//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:"+icsEsc("ETAF Trainings"+(activeClient()?" · "+activeClient().name:""))];
  sortedForCal().forEach(tg=>{
    const d=trainingDates(tg), cl=clientOf(tg), r=rosterStats(tg), st=statusOf(tg);
    lines.push("BEGIN:VEVENT","UID:"+tg.id+"@etaf-trainer","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+icsDate(d.start),"DTEND;VALUE=DATE:"+icsDate(d.end),
      "SUMMARY:"+icsEsc((cl?cl.short+" · ":"")+tg.topic),
      "LOCATION:"+icsEsc(tg.city+", "+tg.country),
      "CATEGORIES:"+icsEsc(cl?cl.name:"ETAF"));
    if(cl&&cl.cal)lines.push("COLOR:"+cl.cal);
    lines.push("DESCRIPTION:"+icsEsc(tg.spec+" — "+r.yes+"/"+r.need+" "+t("confirmedShort")+" · "+t(st.key)+(cl?" · "+cl.name:"")),"END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function download(name,text,mime){
  try{const b=new Blob([text],{type:mime||"text/plain"});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
    a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){toast("Export: "+e.message,"crit");}
}
function exportIcs(){
  const suffix=activeClient()?("-"+(activeClient().short||"kunde").toLowerCase()):"-alle";
  download("etaf-trainings"+suffix+".ics",buildICS(),"text/calendar;charset=utf-8");
  toast(t("icsToast"),"good");
}
function setPageOrient(o){const el=$("#pageOrient");
  if(el)el.textContent="@page{size:A4 "+o+";margin:"+(o==="landscape"?"12mm":"16mm")+"}";}
function openCalendar(){
  const M=(S.lang==='de'?MONTHS_DE:MONTHS_EN); const list=sortedForCal();
  const legend=(S.clients||[]).map(c=>`<span class="cal-lg"><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join("");
  let body;

  else{
    const groups={};
    list.forEach(tg=>{const s=trainingDates(tg).start; const key=s.getUTCFullYear()+"-"+pad2(s.getUTCMonth()+1);
      (groups[key]=groups[key]||{y:s.getUTCFullYear(),m:s.getUTCMonth(),items:[]}).items.push({tg,s});});
    body="<div class='cal-grid'>"+Object.keys(groups).sort().map(k=>{const g=groups[k];
      return `<div class="cal-month"><h3>${M[g.m]} ${g.y}</h3>`+
        g.items.map(({tg,s})=>{const cl=clientOf(tg),r=rosterStats(tg),st=statusOf(tg);

            <div class="cal-main"><div class="cal-tt">${esc(tg.topic)}</div>
              <div class="cal-ss">${esc(tg.city+", "+tg.country)}${cl?" · "+esc(cl.name):""}</div></div>
            <div class="cal-bd" style="color:${stcol}">${r.yes}/${r.need}</div>
          </div>`;}).join("")+`</div>`;
    }).join("")+"</div>";
  }
  $("#calBody").innerHTML=`<div class="cal-sheet">
    <div class="ag-top"><div><div class="ag-eyebrow">${t("calTitle")}</div>
      <div class="ag-h1">${activeClient()?esc(activeClient().name):t("clientAll")}</div>
      <div class="meta">${t("calSub")}</div></div>

    <div class="ag-bar"></div>
    <div class="cal-legend">${legend}</div>${body}
    <div class="meta" style="text-align:center;margin-top:22px">ETAF · Trainer-Koordination</div></div>`;
  setPageOrient("landscape"); $("#agPrintLbl2")&&($("#agPrintLbl2").textContent=t("calPrint"));
  $("#calPrint").classList.add("on");
}

function deriveWhen(startISO){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(startISO||""))return{kw:"",month:""};
  const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const sd=new Date(startISO+"T00:00:00Z");
  return {kw:"KW "+isoWeekNum(sd), month:MON[sd.getUTCMonth()]+" ’"+String(sd.getUTCFullYear()).slice(2)};
}
function updateEdWhen(){
  const s=$("#edStart").value, e=$("#edEnd").value, el=$("#edWhen"); if(!el)return;
  if(!s){el.textContent=t("fDateHint");return;}
  const w=deriveWhen(s);
  el.textContent="→ "+fmtDateRange(s,e)+(w.kw?" · "+w.kw:"");
}
async function saveTrainingEditor(){
  const topic=$("#edTopic").value.trim(), city=$("#edCity").value.trim();
  if(!topic||!city){toast(t("fieldReq"),"warn");return;}
  const start=$("#edStart").value.trim(), end=$("#edEnd").value.trim();
  const w=deriveWhen(start);
  // Alten Zeitraum merken (für „Termin verschoben“-Benachrichtigung)
  const oldStart=edTraining?edTraining.date:null, oldKw=edTraining?edTraining.kw:null, oldEnd=edTraining?edTraining.dateEnd:null;
  const data={clientId:$("#edClient").value,topic,city,country:$("#edCountry").value.trim().toUpperCase(),
    date:start||null,dateEnd:end||null,kw:w.kw,month:w.month,spec:$("#edSpec").value,
    need:parseInt($("#edNeed").value)||1,participants:parseInt($("#edPart").value)||0};
  let newId=null, prefilled=0;
  if(LIVE){
    try{ const d=await apiCall("training.save",Object.assign({id:edTraining?edTraining.id:null,client:data.clientId},data));
      await pull(); newId=d.id; if(d.prefilled)prefilled=d.prefilled; }catch(e){ toast("Fehler: "+e.message,"crit"); return; }
  } else {
    if(edTraining){ Object.assign(edTraining,data); newId=edTraining.id; }
    else {
      const prefill=(S.matPresets&&S.matPresets[data.spec])?JSON.parse(JSON.stringify(S.matPresets[data.spec])):[];
      prefilled=prefill.length;
      const tg=Object.assign({id:uid("tg")},data,{travel:{venue:"",hotel:"",hotelAddr:"",meetingPoint:"",contactName:"",contactPhone:"",dresscode:"",perDiem:"",notes:"",agenda:[]},materials:prefill,roster:[]});
      S.trainings.push(tg); newId=tg.id;
    }
    save();
  }
  closeSheet();toast(t("trainingSaved"),"good");
  if(prefilled)setTimeout(()=>toast(t("matPrefilled",prefilled),"good"),400);
  if(newId){ curTg=S.trainings.find(x=>x.id===newId); route="detail"; render(); }
  else go("trainings");
  buildNav();
  // Termin verschoben? → Trainer informieren / neu anfragen anbieten
  const shifted = edTraining && ((oldStart||"")!==(data.date||"") || (oldKw||"")!==(data.kw||"") || (oldEnd||"")!==(data.dateEnd||""));
  if(shifted && newId){
    const tg=S.trainings.find(x=>x.id===newId);
    const affected=(tg&&tg.roster||[]).filter(r=>["yes","confirmed","maybe","asked"].includes(r.status));
    if(affected.length){
      const oldTxt=(oldStart?fmtDateRange(oldStart,oldEnd):oldKw)||"—";
      setTimeout(()=>promptShiftNotify(newId, oldTxt, affected.length), 500);
    }
  }
}
