let matTg=null;
function openMaterials(tgId){
  matTg=tgId; const tg=S.trainings.find(t=>t.id===tgId); if(!tg.materials)tg.materials=[];
  $("#sheetTitle").textContent=t("matEdit");
  $("#sheetBody").innerHTML=`
    <div class="fldrow"><div class="meta">${esc(tg.topic)} · <b>${esc(tg.spec||"")}</b></div>
      <button class="btn sm" onclick="openMaterialCatalog()">${t("matManage")}</button></div>
    <div id="matLines" style="margin-top:12px"></div>
    <button class="btn sm" onclick="matAddLine()" style="margin-top:8px">${t("matAddPos")}</button>
    <div class="divider"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" onclick="loadMatPreset()">${t("matLoadPreset")}</button>
      <button class="btn sm" onclick="saveMatPreset()">${t("matSavePreset",tg.spec||"—")}</button>
    </div>
    <div class="meta" style="margin-top:8px">${t("matPresetHint")}</div>`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("cancel")}</button>
    <button class="btn" onclick="printMaterials('${tgId}')">${ic("printer")}${t("matPrint")}</button>
    <div class="spacer"></div>
    <button class="btn primary" onclick="saveMaterials('${tgId}')">${t("save")}</button>`;
  drawMatLines(); openSheet();
}
function drawMatLines(){
  const tg=S.trainings.find(t=>t.id===matTg); const lines=tg.materials||[];
  $("#matLines").innerHTML=lines.length?lines.map((l,i)=>`
    <div style="display:flex;gap:8px;margin-bottom:6px;align-items:center">
      <select style="flex:1;min-width:0" onchange="matSetLine(${i},'matId',this.value)">
        ${S.materials.map(m=>`<option value="${m.id}" ${m.id===l.matId?'selected':''}>${esc(m.name)}${m.unit?' ('+esc(m.unit)+')':''}</option>`).join("")}
      </select>
      <input class="inp" type="number" min="0" style="width:84px" value="${l.qty!=null?l.qty:1}" onchange="matSetLine(${i},'qty',this.value)">
      <button class="btn sm" onclick="matRmLine(${i})">✕</button>
    </div>`).join(""):`<div class="meta">${t("matNone")} ${t("matPickHint")}</div>`;
}
function matAddLine(){const tg=S.trainings.find(t=>t.id===matTg);tg.materials.push({matId:(S.materials[0]||{}).id||"",qty:1});drawMatLines();}
function matSetLine(i,k,v){const tg=S.trainings.find(t=>t.id===matTg);tg.materials[i][k]=(k==='qty'?(parseInt(v)||0):v);}
function matRmLine(i){const tg=S.trainings.find(t=>t.id===matTg);tg.materials.splice(i,1);drawMatLines();}
async function saveMaterials(tgId){
  const tg=S.trainings.find(t=>t.id===tgId); tg.materials=(tg.materials||[]).filter(l=>l.matId);
  if(LIVE){ try{ await apiCall("training.materials.save",{training:tgId,materials:tg.materials}); }catch(e){ toast("Fehler: "+e.message,"crit"); return; } }
  save();closeSheet();toast(t("matSaved"),"good");if(route==="detail")renderDetail();
}
function loadMatPreset(){
  const tg=S.trainings.find(t=>t.id===matTg); const p=(S.matPresets||{})[tg.spec];
  if(!p||!p.length){toast(t("matNoPreset"),"warn");return;}
  tg.materials=JSON.parse(JSON.stringify(p)); drawMatLines(); toast(t("matPresetLoaded"),"good");
}
async function saveMatPreset(){
  const tg=S.trainings.find(t=>t.id===matTg); if(!tg.spec){return;}
  const lines=(tg.materials||[]).filter(l=>l.matId);
  S.matPresets=S.matPresets||{}; S.matPresets[tg.spec]=JSON.parse(JSON.stringify(lines));
  if(LIVE){ try{ await apiCall("matpreset.save",{spec:tg.spec,materials:lines}); }catch(e){ toast("Fehler: "+e.message,"crit"); return; } }
  save(); toast(t("matPresetSaved"),"good");
}
/* Material-Katalog verwalten */
function openMaterialCatalog(){drawCatalog();openSheet();}
function drawCatalog(){
  $("#sheetTitle").textContent=t("catTitle");
  $("#sheetBody").innerHTML=`
    <div class="meta" style="margin-bottom:10px">${t("catSub")}</div>
    <div id="catRows">${(S.materials||[]).map(catRow).join("")}</div>
    <button class="btn" style="margin-top:12px" onclick="catAdd()">${t("catAdd")}</button>`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("close")}</button><div class="spacer"></div>
    <button class="btn primary" onclick="saveCatalog()">${t("save")}</button>`;
}
function catRow(m){
  return `<div class="row" style="gap:8px;padding:8px 2px">
    <input class="inp" value="${esc(m.name||'')}" placeholder="${t("matName")}" oninput="catSet('${m.id}','name',this.value)" style="flex:1;min-width:0">
    <input class="inp" value="${esc(m.unit||'')}" placeholder="${t("matUnit")}" oninput="catSet('${m.id}','unit',this.value)" style="width:64px">
    <input class="inp" value="${esc(m.cat||'')}" placeholder="${t("matCat")}" oninput="catSet('${m.id}','cat',this.value)" style="width:104px">
    <button class="btn sm" onclick="catDel('${m.id}')">✕</button>
  </div>`;
}
function catSet(id,k,v){const m=S.materials.find(x=>x.id===id);if(m)m[k]=v;}
function catAdd(){S.materials.push({id:uid("m-"),name:"",unit:"Stk",cat:""});drawCatalog();}
function catDel(id){
  if(!confirm(t("matDelCat")))return;
  S.materials=S.materials.filter(m=>m.id!==id);
  S.trainings.forEach(tg=>{if(tg.materials)tg.materials=tg.materials.filter(l=>l.matId!==id);});
  Object.keys(S.matPresets||{}).forEach(k=>{S.matPresets[k]=(S.matPresets[k]||[]).filter(l=>l.matId!==id);});
  if(LIVE)apiCall("material.delete",{id}).catch(()=>{});
  drawCatalog();
}
async function saveCatalog(){
  S.materials=(S.materials||[]).filter(m=>(m.name||"").trim());
  if(!S.materials.length)S.materials=seedMaterials();
  if(LIVE){ try{ for(const m of S.materials){ await apiCall("material.save",m); } }catch(e){ toast("Fehler: "+e.message,"crit"); } }
  save();closeSheet();toast(t("catSaved"),"good");if(route==="detail")renderDetail();
}
/* Druckbare Materialliste / Packliste (nutzt das Kalender-Overlay) */
function printMaterials(tgId){
  const tg=S.trainings.find(t=>t.id===tgId); const cl=clientOf(tg);
  const lines=(tg.materials||[]).filter(l=>l.matId);
  const rows=lines.map(l=>`<tr><td>${esc(matName(l.matId))}</td><td class="ag-t" style="text-align:right">${+l.qty||0}</td><td class="ag-d">${esc(matUnit(l.matId))}</td></tr>`).join("");
  $("#calBody").innerHTML=`<div class="cal-sheet" style="max-width:640px">
    <div class="ag-top"><div><div class="ag-eyebrow">${t("matPrintTitle")}</div>
      <div class="ag-h1">${esc(tg.topic)}</div>
      <div class="meta">${esc(tg.city+", "+tg.country+" · "+whenLabel(tg))}${cl?" · "+esc(cl.name):""}</div></div>
      <span style="color:var(--brand);display:inline-flex">${etafLogo(34)}</span></div>
    <div class="ag-bar"></div>
    ${rows?`<table class="ag-table"><thead><tr><th style="text-align:left">${t("matColHead")}</th><th style="text-align:right;width:70px">${t("matColQty")}</th><th style="text-align:left;width:80px">${t("matColUnit")}</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">${t("matNone")}</div>`}
    <div class="meta" style="text-align:center;margin-top:22px">ETAF · Trainer-Koordination</div></div>`;
  setPageOrient("portrait"); $("#agPrintLbl2").textContent=t("calPrint"); $("#calPrint").classList.add("on");
}

/* ============================================================
   IMPORT (mock)
   ============================================================ */
let importProfiles=[];
const IMPORT_SAMPLE="Dr. Amir Haddad — Implantologie, Guided Surgery. Sprachen: DE, EN, AR. Region: UAE. Viel Erfahrung in Abu Dhabi.\nDr. Lena Vogt, DNA-Diagnostik & Prothetik, DE-West, DE/EN, Bewertung 4.7\nDr. Youssef Karim, Fingerprint Dental, UAE, EN/AR";
function openImport(){
  importProfiles=[];
  $("#sheetTitle").textContent=t("importTitle");
  $("#sheetBody").innerHTML=`
    <div class="meta" style="margin-bottom:10px">${t("importDesc")}</div>
    ${LIVE?'':`<div class="meta" style="margin-bottom:10px">${t("importNoAI")}</div>`}
    <label class="fld">${t("importPaste")}</label>
    <textarea id="impText" style="min-height:150px">${LIVE?'':esc(IMPORT_SAMPLE)}</textarea>
    <div id="impResult"></div>`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("close")}</button><div class="spacer"></div>
    <button class="btn primary" id="impBtnAnalyze" onclick="runImportAnalyze()">✨ ${t("importAnalyze")}</button>`;
  openSheet();
}
async function runImportAnalyze(){
  const text=($("#impText")?$("#impText").value:"").trim();
  if(!text){toast(t("importErr"),"warn");return;}
  const btn=$("#impBtnAnalyze"); if(btn){btn.disabled=true;btn.textContent="… "+t("importAnalyzing");}
  try{
    if(LIVE){ const d=await apiCall("ai.extract",{text}); importProfiles=d.profiles||[]; }
    else { importProfiles=demoExtract(text); await new Promise(r=>setTimeout(r,500)); }
    drawImportReview();
  }catch(e){ toast(t("importErr")+": "+e.message,"crit"); if(btn){btn.disabled=false;btn.textContent="✨ "+t("importAnalyze");} }
}
function demoExtract(text){
  const SP=["Implantologie","DNA-Diagnostik","Fingerprint Dental","Prothetik","Guided Surgery","Parodontologie","Chirurgie"];
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).slice(0,8).map(line=>{
    const name=(line.match(/Dr\.?\s+[A-Za-zÄÖÜäöü'\-]+\s+[A-Za-zÄÖÜäöü'\-]+/)||[line.split(/[,—-]/)[0].trim()])[0];
    const spec=SP.filter(s=>line.toLowerCase().includes(s.toLowerCase().slice(0,6)));
    const langs=(line.match(/\b(DE|EN|AR)\b/g)||[]).filter((v,i,a)=>a.indexOf(v)===i);
    const uae=/uae|abu dhabi|dubai/i.test(line);
    const reg=(line.match(/DE-(Süd|West|Nord)|AT|CH|UAE|UK/)||[uae?"UAE":"DE-West"])[0];
    const rate=(line.match(/([45]\.\d)/)||["4.5"])[0];
    return {name:name.trim(),email:"",phone:"",spec:spec.length?spec:[SP[0]],region:reg,langs:langs.length?langs:["DE","EN"],uae,rating:rate};
  });
}
function drawImportReview(){
  const n=importProfiles.length;
  $("#impResult").innerHTML=`
    <label class="fld">${t("importReview")} · ${t("importFound",n)}</label>
    ${importProfiles.map((p,i)=>`
      <div class="row">
        <div class="av" style="background:var(--brand-solid)">${initials(p.name||"?")}</div>
        <div class="rowgrow"><div class="nm">${esc(p.name||"—")}</div>
          <div class="meta">${(p.spec||[]).join(", ")} · ${esc(p.region||"")} · ${(p.langs||[]).join("/")}${p.uae?" · UAE":""} · ⭐ ${esc(p.rating||"4.5")}</div></div>
        <button class="btn sm" onclick="rmImport(${i})">✕</button>
      </div>`).join("")}`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("cancel")}</button><div class="spacer"></div>
    <button class="btn primary" onclick="applyImport()">${t("importApply",n)}</button>`;
}
function rmImport(i){importProfiles.splice(i,1);drawImportReview();}
async function applyImport(){
  const profs=importProfiles.slice(); const n=profs.length;
  if(!n){closeSheet();return;}
  if(LIVE){
    try{ const d=await apiCall("trainers.bulkCreate",{profiles:profs}); await pull();
      closeSheet(); if(route==="trainers")renderTrainers(); toast(t("importCreated",d.created!=null?d.created:n),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  const COL=["#3E4852","#B23A42","#4E6E8E","#6E5A86","#3F7A5E","#A6642E","#557088","#8A5A52"];
  profs.forEach((p,i)=>S.trainers.push({id:uid("tr"),name:p.name||"—",email:p.email||"",phone:p.phone||"",
    spec:p.spec||[],region:p.region||"",langs:p.langs||[],uae:!!p.uae,load:0,
    color:COL[i%COL.length],rating:String(p.rating||"4.5")}));
  save();closeSheet();if(route==="trainers")renderTrainers();toast(t("importCreated",n),"good");
}

/* ============================================================
   AUTOMATION (Erinnerungen + Nachrücken)
   ============================================================ */
function renderAutomation(){
  if(LIVE && !S._settingsLoaded){
    S._settingsLoaded=true;
    apiCall("settings.get").then(d=>{S.settings=d.settings;renderAutomation();}).catch(()=>{});
  }
  const s=S.settings||{reminder_hours:48,escalate_hours:72,auto_advance:false,passport_lead_days:180};
  $("#v-automation").innerHTML=`
    <div class="panel">
      <div class="panel-h"><h3>${t("tp_auto")}</h3><div class="sub">${t("tp_autoSub")}</div></div>
      <div class="panel-b">
        <div class="meta" style="margin-bottom:14px">${t("autoDesc")}</div>
        <div class="kv"><span class="k">${t("autoReminderLbl")}</span>
          <input class="inp" style="width:110px" type="number" min="1" id="aRem" value="${s.reminder_hours}" onchange="saveAuto()"></div>
        <div class="kv"><span class="k">${t("autoEscalateLbl")}</span>
          <input class="inp" style="width:110px" type="number" min="1" id="aEsc" value="${s.escalate_hours}" onchange="saveAuto()"></div>
        <div class="kv" style="align-items:flex-start">
          <span class="k">${t("autoAdvanceLbl")}<div class="meta" style="max-width:360px;margin-top:2px">${t("autoAdvanceHint")}</div></span>
          <label class="sw"><input type="checkbox" id="aAdv" ${s.auto_advance?'checked':''} onchange="saveAuto()"><span></span></label></div>
        <div class="kv" style="align-items:flex-start">
          <span class="k">${ic("id",15)}${t("ppLeadLbl")}<div class="meta" style="max-width:360px;margin-top:2px">${t("ppLeadHint")}</div></span>
          <input class="inp" style="width:110px" type="number" min="14" step="1" id="aPpLead" value="${s.passport_lead_days||180}" onchange="saveAuto()"></div>
      </div>
      <div class="panel-b" style="border-top:1px solid var(--line)">
        <button class="btn amber" onclick="runAutoNow()">⚡ ${t("autoRunNow")}</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>${ic("lock",18)} ${t("secTitle")}</h3><div class="sub">${t("secSub")}</div></div>
      <div class="panel-b">
        <div class="meta" style="margin-bottom:14px">${t("secLockInfo")}</div>
        ${LIVE?`
        <div class="kv"><span class="k">${t("secCurPin")}</span>
          <input class="inp" style="width:150px" type="password" inputmode="numeric" autocomplete="off" id="pinCur"></div>
        <div class="kv"><span class="k">${t("secNewPin")}</span>
          <input class="inp" style="width:150px" type="password" inputmode="numeric" autocomplete="off" id="pinNew"></div>
        <div class="kv"><span class="k">${t("secNewPin2")}</span>
          <input class="inp" style="width:150px" type="password" inputmode="numeric" autocomplete="off" id="pinNew2"></div>
        <div style="margin-top:12px"><button class="btn" onclick="changePin()">${ic("check",16)} ${t("secChangeBtn")}</button></div>
        `:`<div class="meta">${t("secDemoNote")}</div>`}
      </div>
    </div>`;
}
async function changePin(){
  const cur=$("#pinCur").value, nw=$("#pinNew").value, nw2=$("#pinNew2").value;
  if(!/^\d{4,8}$/.test(nw)){ toast(t("secPinFormat"),"crit"); return; }
  if(nw!==nw2){ toast(t("secPinMismatch"),"crit"); return; }
  try{
    await apiCall("pin.change",{current:cur,new:nw});
    $("#pinCur").value=$("#pinNew").value=$("#pinNew2").value="";
    toast(t("secPinSaved"),"good");
  }catch(e){ toast("Fehler: "+e.message,"crit"); }
}
function saveAuto(){
  const s={reminder_hours:parseInt($("#aRem").value)||48,escalate_hours:parseInt($("#aEsc").value)||72,auto_advance:$("#aAdv").checked,passport_lead_days:Math.max(14,parseInt($("#aPpLead").value)||180)};
  S.settings=s;save();
  if(LIVE){ apiCall("settings.save",s).then(()=>toast(t("autoSaved"),"good")).catch(e=>toast("Fehler: "+e.message,"crit")); }
  else toast(t("autoSaved"),"good");
}
async function runAutoNow(){
  if(LIVE){
    try{ const d=await apiCall("automation.run"); await pull(); buildNav();
      if(route==="detail")renderDetail(); if(route==="dash")renderDash();
      toast(t("autoRan",d.reminded,d.advanced),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  const s=S.settings||{}; let reminded=0,advanced=0;
  S.trainings.forEach(tg=>{
    tg.roster.forEach(r=>{ if(r.status==="asked" && !r.reminded){ r.reminded=true; reminded++;
      const trx=S.trainers.find(x=>x.id===r.trainerId); if(trx)demoLog(trx.email,(S.lang==='de'?'Erinnerung: ':'Reminder: ')+tg.topic,S.emailLang,"logged"); } });
    if(s.auto_advance){
      const active=tg.roster.filter(r=>["asked","maybe","yes","confirmed"].includes(r.status)).length;
      const gaps=tg.roster.filter(r=>r.status==="no").length;
      const toAdd=Math.min(gaps,Math.max(0,tg.need-active));
      const next=ranked(tg).filter(x=>!x.status);
      for(let i=0;i<toAdd && i<next.length;i++){ tg.roster.push({trainerId:next[i].tr.id,status:"asked"}); advanced++; }
    }
  });
  save();buildNav();renderAutomation();if(route==="dash")renderDash();
  toast(t("autoRan",reminded,advanced),"good");
}

/* ============================================================
   HELPERS
   ============================================================ */
function initials(n){return n.replace(/^Dr\.\s*/,"").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function openSheet(){$("#scrim").classList.add("on");$("#sheet").classList.add("on");}
function closeSheet(){$("#scrim").classList.remove("on");$("#sheet").classList.remove("on");}
let toastT;
function toast(msg,kind){
  const el=$("#toast");el.textContent=msg;
  el.style.borderLeft=kind?`4px solid var(--${kind==='good'?'good':kind==='crit'?'crit':kind==='warn'?'warn':'brand'})`:"none";
  el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
}

buildKeys();drawDots();applyStatic();
/* Live-Modus: gültiges Login aus dem Browser-Speicher fortsetzen — kein
   erneutes PIN-Eingeben nach „Seite aktualisieren“, und die zuletzt
   geöffnete Ansicht (z. B. ein Training) wird wiederhergestellt. */
(async function resumeSession(){
  if(!(LIVE && AUTH))return;
  try{ await pull(); restoreView(); unlock(); markSynced(); }
  catch(e){ try{localStorage.removeItem("etaf_token");}catch(_){} AUTH=""; }
})();
</script>
