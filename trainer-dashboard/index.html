/* ============================================================
   REISEPASS je Trainer - einmal hinterlegt, mit Verfallsdatum, Ampel,
   Foto-Upload + KI-Auslesen. Erinnerung läuft über die Automatik.
   ============================================================ */
function ppLeadDays(){ return (S.settings&&S.settings.passport_lead_days)||180; }
/* Ampel-Status eines Passes: crit=abgelaufen/sehr knapp, warn=läuft bald ab, ok=gültig, none=nicht hinterlegt */
function passportHealth(pp){
  if(!pp || !pp.expiry) return {level:pp?"nodate":"none", days:null};
  const exp=new Date(pp.expiry+"T00:00:00"); if(isNaN(exp)) return {level:"nodate",days:null};
  const days=Math.floor((exp-new Date(new Date().toDateString()))/86400000);
  const lead=ppLeadDays();
  const level = days<0 ? "crit" : days<=Math.min(60,lead) ? "crit" : days<=lead ? "warn" : "ok";
  return {level,days};
}
const PP_DOT={ok:"var(--good)",warn:"var(--warn)",crit:"var(--crit)",nodate:"var(--muted)",none:"var(--line)"};
function passportChip(tr){
  const pp=tr.passport, h=passportHealth(pp);
  const dot=`<span style="width:9px;height:9px;border-radius:50%;background:${PP_DOT[h.level]||'var(--line)'};flex:none;display:inline-block"></span>`;
  let label;
  if(h.level==="none") label=`<span class="meta">${t("ppNone")}</span>`;
  else if(h.level==="nodate") label=`<span class="meta">${t("ppNoExpiry")}</span>`;
  else if(h.days<0) label=`<b style="color:var(--crit)">${t("ppExpired")}</b> <span class="meta">${fmtDate(pp.expiry)}</span>`;
  else if(h.level!=="ok") label=`<b style="color:${h.level==='crit'?'var(--crit)':'var(--warn)'}">${t("ppExpSoon",h.days)}</b> <span class="meta">${fmtDate(pp.expiry)}</span>`;
  else label=`<span class="meta">${t("ppExpValid")} · ${fmtDate(pp.expiry)}</span>`;
  return `<div style="display:flex;gap:8px;align-items:center">${ic("id",15)}${dot}${label}</div>`;
}
/* Datum hübsch: YYYY-MM-DD → DD.MM.YYYY (de) / DD Mon YYYY (en) */
function fmtDate(iso){
  if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return S.lang==="de" ? d.toLocaleDateString("de-DE") : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

async function ppFileChosen(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  if(file.size>8*1024*1024){ toast(t("ppBig"),"crit"); return; }
  const dataUrl=await downscaleImage(file, 1600, 0.82);
  ppEditImg=dataUrl;
  // Vorschau sofort + optional KI-Auslesen
  const cur=collectPassport(); cur.hasFile=true; drawPassport(cur);
  const im=$("#ppThumb"); if(im){ im.src=dataUrl; im.style.display=""; }
  if(!LIVE){ $("#ppScanMsg").textContent=t("ppScanDemo"); return; }
  const msg=$("#ppScanMsg"); if(msg){ msg.textContent="… "+t("ppScanning"); }
  try{
    const d=await apiCall("passport.scan",{image:dataUrl}); const p=d.data||{};
    if($("#ppNo")&&!$("#ppNo").value) $("#ppNo").value=p.number||"";
    if($("#ppNm")) $("#ppNm").value=$("#ppNm").value||p.full_name||[p.given_names,p.surname].filter(Boolean).join(" ");
    if($("#ppNat")&&!$("#ppNat").value) $("#ppNat").value=p.nationality||"";
    if($("#ppBd")&&!$("#ppBd").value&&/^\d{4}-\d{2}-\d{2}$/.test(p.birthdate||"")) $("#ppBd").value=p.birthdate;
    if($("#ppExp")&&!$("#ppExp").value&&/^\d{4}-\d{2}-\d{2}$/.test(p.expiry||"")) $("#ppExp").value=p.expiry;
    if(msg) msg.textContent=t("ppScanOk");
  }catch(e){ if(msg) msg.textContent=t("ppScanErr")+": "+e.message; }
}
function collectPassport(){
  return {number:val("ppNo"),name:val("ppNm"),nationality:val("ppNat"),
    birthdate:val("ppBd"),expiry:val("ppExp"),notes:val("ppNt"),
    hasFile:(ppEditImg!==undefined)?(ppEditImg!==null):((S.trainers.find(x=>x.id===ppEditId)||{}).passport||{}).hasFile,
    updatedAt:(((S.trainers.find(x=>x.id===ppEditId)||{}).passport||{}).updatedAt)||""};
}
function val(id){ const e=$("#"+id); return e?e.value:""; }
async function savePassport(){
  const tr=S.trainers.find(x=>x.id===ppEditId); if(!tr) return;
  const pp=collectPassport();
  if(pp.expiry && !/^\d{4}-\d{2}-\d{2}$/.test(pp.expiry)){ toast(t("ppScanErr"),"crit"); return; }
  if(LIVE){
    const payload={id:ppEditId,number:pp.number,name:pp.name,nationality:pp.nationality,
      birthdate:pp.birthdate,expiry:pp.expiry,notes:pp.notes};
    if(ppEditImg!==undefined) payload.image = ppEditImg===null ? "null" : ppEditImg;
    try{ await apiCall("passport.save",payload); await pull(); }
    catch(e){ toast("Fehler: "+e.message,"crit"); return; }
  } else {
    tr.passport=Object.assign({},pp,{updatedAt:new Date().toISOString(),
      hasFile:(ppEditImg!==undefined)?(ppEditImg!==null):(tr.passport&&tr.passport.hasFile),
      _img:(ppEditImg!==undefined)?ppEditImg:(tr.passport&&tr.passport._img)});
    save();
  }
  closeSheet(); if(route==="trainers")renderTrainers(); if(route==="dash")renderDash();
  toast(t("ppSaved"),"good");
}
async function removePassport(){
  if(LIVE){ try{ await apiCall("passport.clear",{id:ppEditId}); await pull(); }catch(e){ toast("Fehler: "+e.message,"crit"); return; } }
  else { const tr=S.trainers.find(x=>x.id===ppEditId); if(tr) tr.passport=null; save(); }
  closeSheet(); if(route==="trainers")renderTrainers(); if(route==="dash")renderDash();
  toast(t("ppRemoved"),"good");
}
/* Bild clientseitig verkleinern → JPEG-DataURL (spart Speicher & Upload). */
function downscaleImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ let{width:w,height:h}=img; const sc=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ resolve(c.toDataURL("image/jpeg",quality)); }catch(e){ resolve(fr.result); } };
      img.onerror=()=>resolve(fr.result); img.src=fr.result; };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}

/* ============================================================
   BELEGUNG / BUCHUNGEN - Steuerzentrale: Filter (Trainer/Kunde/Status/
   Monat/Suche), Gruppierung, Doppelbuchungs-Warnung, CSV-Export
   ============================================================ */
let bookingTr="all", bookingStatus="all", bookingClient="all", bookingMonth="all",
    bookingSearch="", bookingGroup="none", bookingView="list";
function clientOf(tg){ return (S.clients||[]).find(c=>c.id===tg.clientId)||null; }
function bookingMonthKey(tg){ return tg.month || (tg.date?String(tg.date).slice(0,7):"") || tg.kw || ""; }
function allBookings(){
  const rel=["yes","confirmed","maybe","asked"]; const out=[];
  S.trainings.forEach(tg=>(tg.roster||[]).forEach(r=>{
    if(!rel.includes(r.status))return;
    const tr=S.trainers.find(t=>t.id===r.trainerId); if(!tr)return;
    out.push({tr,tg,status:r.status,flight:r.flight});
  }));
  return out.sort((a,b)=>
    String(a.tg.date||a.tg.kw||"zzz").localeCompare(String(b.tg.date||b.tg.kw||"zzz"))
    || a.tr.name.localeCompare(b.tr.name));
}
/* Schlüssel Trainer+KW; Konflikt = Trainer mehrfach in derselben KW gebucht. */
function bkKey(x){ return x.tr.id+"|"+(x.tg.kw||x.tg.date||""); }
function conflictKeys(){
  const seen={}, conf=new Set();
  allBookings().forEach(x=>{ if(!(x.tg.kw||x.tg.date))return; const k=bkKey(x); seen[k]=(seen[k]||0)+1; });
  for(const k in seen) if(seen[k]>1) conf.add(k);
  return conf;
}
function filteredBookings(){
  let list=allBookings();
  if(bookingTr!=="all")     list=list.filter(x=>x.tr.id===bookingTr);
  if(bookingClient!=="all") list=list.filter(x=>(x.tg.clientId||"")===bookingClient);
  if(bookingStatus!=="all") list=list.filter(x=> bookingStatus==="yes"
    ? (x.status==="yes"||x.status==="confirmed") : x.status===bookingStatus);
  if(bookingMonth!=="all")  list=list.filter(x=>bookingMonthKey(x.tg)===bookingMonth);
  const q=bookingSearch.trim().toLowerCase();
  if(q) list=list.filter(x=>{ const cl=clientOf(x.tg);
    return [x.tr.name,x.tg.topic,x.tg.city,x.tg.country,x.tg.kw,x.tg.spec,cl?cl.name:""]
      .filter(Boolean).join(" ").toLowerCase().includes(q); });
  return list;
}
function bkRow(x,conf){
  const tg=x.tg, cl=clientOf(tg);
  const when=whenText(tg);
  const kwSub=(tg.kw && fmtDateRange(tg.date,tg.dateEnd))?kwLabel(tg.kw):"";
  const trav=travelLine(x.flight,tg);
  const dbl=conf.has(bkKey(x))?`<span class="pill crit" title="${t("bkConflictHint")}">⚠ ${t("bkConflict")}</span>`:"";
  const clientChip=cl?`<span class="cchip" style="--cc:${cl.color}">${esc(cl.short||cl.name)}</span>`:"";
  return `<tr class="clickrow" title="${t("bkOpenModule")}" onclick="openDetail('${tg.id}')">
    <td><div class="bktr"><span class="av xs" style="background:${x.tr.color}">${initials(x.tr.name)}</span><b>${esc(x.tr.name)}</b></div></td>
    <td class="nowrap"><span class="pill ${spCls(x.status)}">${spLabel(x.status)}</span>${dbl}</td>
    <td class="nowrap">${esc(when||"-")}${kwSub?`<div class="meta">${esc(kwSub)}</div>`:""}</td>
    <td>${esc(tg.city||"")}${tg.country?", "+esc(tg.country):""}</td>
    <td>${clientChip}<b>${esc(tg.topic)}</b>${trav?`<div class="meta travrow">${ic("bag")}${trav}</div>`:""}</td>
    <td class="nowrap"><div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn sm" title="${t("bkOpenModule")}" onclick="event.stopPropagation();openDetail('${tg.id}')">${ic("users",15)}</button>
      <button class="btn sm" title="${t("planView")}" onclick="event.stopPropagation();openPlan('${x.tr.id}')">${ic("clip",15)}</button>
    </div></td>
  </tr>`;
}
function groupBookings(list){
  if(bookingGroup==="none") return [["",list]];
  const keyFn = bookingGroup==="trainer" ? x=>x.tr.name
    : bookingGroup==="client" ? x=>{const c=clientOf(x.tg);return c?c.name:t("bkNoClient");}
    : x=>bookingMonthKey(x.tg)||"-";
  const g={}, order=[];
  list.forEach(x=>{const k=keyFn(x); if(!(k in g)){g[k]=[];order.push(k);} g[k].push(x);});
  if(bookingGroup!=="month") order.sort((a,b)=>a.localeCompare(b));
  return order.map(k=>[k,g[k]]);
}
function renderBookings(){
  const list=filteredBookings(), conf=conflictKeys();
  const uTr=new Set(list.map(x=>x.tr.id)).size, uTg=new Set(list.map(x=>x.tg.id)).size;
  const confN=list.filter(x=>conf.has(bkKey(x))).length;
  const opt=(v,l,sel)=>`<option value="${v}" ${sel?"selected":""}>${l}</option>`;
  const trOpts=opt("all",t("bkAllTrainers"),bookingTr==="all")+
    S.trainers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(tr=>opt(tr.id,esc(tr.name),bookingTr===tr.id)).join("");
  const clOpts=opt("all",t("bkAllClients"),bookingClient==="all")+
    (S.clients||[]).map(c=>opt(c.id,esc(c.name),bookingClient===c.id)).join("");
  const stOpts=[["all",t("bkAllStatus")],["yes",spLabel("yes")],["maybe",spLabel("maybe")],["asked",spLabel("asked")]]
    .map(([v,l])=>opt(v,l,bookingStatus===v)).join("");
  const months=[...new Set(allBookings().map(x=>bookingMonthKey(x.tg)).filter(Boolean))];
  const moOpts=opt("all",t("bkAllMonths"),bookingMonth==="all")+months.map(m=>opt(m,esc(m),bookingMonth===m)).join("");
  const grOpts=[["none",t("bkGrpNone")],["trainer",t("bkTrainer")],["client",t("bkClient")],["month",t("bkMonth")]]
    .map(([v,l])=>opt(v,l,bookingGroup===v)).join("");

  const groups=groupBookings(list);
  const cols=6;
  const body = list.length ? groups.map(([label,items])=>{
    const head = label ? `<tr class="grouprow"><td colspan="${cols}">${esc(label)} · ${items.length}</td></tr>` : "";
    return head+items.map(x=>bkRow(x,conf)).join("");
  }).join("") : `<tr><td colspan="${cols}" class="meta" style="padding:16px 8px">${t("bkEmpty")}</td></tr>`;
  const listPanel=`<div class="panel"><div class="panel-b"><div class="tscroll">
      <table class="plantable bktable">
        <tr><th>${t("bkTrainer")}</th><th>${t("planColStatus")}</th><th>${t("planColWhen")}</th><th>${t("planColWhere")}</th><th>${t("planColWhat")}</th><th></th></tr>
        ${body}
      </table></div></div></div>`;
  const second = bookingView==="calendar" ? renderCalendar(list) : listPanel;
  const vbtn=(v,l)=>`<button class="btn sm ${bookingView===v?'primary':''}" onclick="bookingView='${v}';renderBookings()">${l}</button>`;

  $("#v-bookings").innerHTML=`
    <div class="panel"><div class="panel-b">
      <div class="bktop">
        <div class="rowgrow">
          <b>${t("bkCount",list.length)}</b>
          <div class="meta">${t("bkStats",uTr,uTg)}${confN?` · <span style="color:var(--crit)">⚠ ${t("bkConflictN",confN)}</span>`:""}</div>
        </div>
        <span class="segbtn">${vbtn("list",ic("list")+t("bkViewList"))}${vbtn("calendar",ic("grid")+t("bkViewCal"))}</span>
        ${bookingClient!=="all"?`<button class="btn sm" onclick="openTransfer('${bookingClient}')">${ic("plane")}${t("trfBtn")}</button>`:""}
        <button class="btn sm" onclick="exportBookingsCSV()">${ic("down")}CSV</button>
      </div>
      <div class="bkfilter">
        <input class="inp bksearch" placeholder="${t("bkSearch")}" value="${esc(bookingSearch)}"
          oninput="bookingSearch=this.value;renderBookings();focusBkSearch()">
        <span class="bkf"><span class="fld">${t("bkClient")}</span>
          <select class="rstat bksel" onchange="bookingClient=this.value;renderBookings()">${clOpts}</select></span>
        <span class="bkf"><span class="fld">${t("bkTrainer")}</span>
          <select class="rstat bksel" onchange="bookingTr=this.value;renderBookings()">${trOpts}</select></span>
        <span class="bkf"><span class="fld">${t("bkMonth")}</span>
          <select class="rstat bksel" onchange="bookingMonth=this.value;renderBookings()">${moOpts}</select></span>
        <span class="bkf"><span class="fld">${t("planColStatus")}</span>
          <select class="rstat bksel" onchange="bookingStatus=this.value;renderBookings()">${stOpts}</select></span>
        ${bookingView==="list"?`<span class="bkf"><span class="fld">${t("bkGroup")}</span>
          <select class="rstat bksel" onchange="bookingGroup=this.value;renderBookings()">${grOpts}</select></span>`:""}
        ${(bookingTr!=="all"||bookingClient!=="all"||bookingStatus!=="all"||bookingMonth!=="all"||bookingSearch||bookingGroup!=="none")
          ?`<button class="btn sm" onclick="resetBookings()">✕ ${t("bkReset")}</button>`:""}
      </div>
    </div></div>
    ${second}`;
}
function focusBkSearch(){ const el=$(".bksearch"); if(el){const v=el.value;el.focus();el.setSelectionRange(v.length,v.length);} }
function resetBookings(){ bookingTr="all";bookingClient="all";bookingStatus="all";bookingMonth="all";bookingSearch="";bookingGroup="none";renderBookings(); }
function exportBookingsCSV(){
  const list=filteredBookings();
  const esc=s=>`"${String(s==null?"":s).replace(/"/g,'""')}"`;
  const head=["Trainer",t("planColStatus"),t("planColWhen"),t("bkClient"),t("planColWhere"),t("planColWhat"),"Reise"];
  const lines=[head.map(esc).join(";")];
  list.forEach(x=>{const tg=x.tg,cl=clientOf(tg);
    lines.push([x.tr.name, spLabel(x.status), [tg.date,tg.kw].filter(Boolean).join(" "),
      cl?cl.name:"", [tg.city,tg.country].filter(Boolean).join(", "), tg.topic,
      travelParts(x.flight,tg).join(" · ")].map(esc).join(";"));
  });
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="ETAF-Belegung.csv"; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast(t("bkCsvToast",list.length),"good");
}
function kwNum(k){ const m=/(\d+)/.exec(k||""); return m?+m[1]:9999; }
function renderCalendar(list){
  if(!list.length) return `<div class="panel"><div class="panel-b"><div class="meta" style="padding:12px">${t("bkCalEmpty")}</div></div></div>`;
  // Wochen-Spalten (KW) mit frühestem Datum als Sortier-/Anzeigehilfe
  const wk={};
  list.forEach(x=>{ const k=x.tg.kw||"-"; if(!wk[k])wk[k]={kw:k,minDate:x.tg.date||""};
    if(x.tg.date && (!wk[k].minDate || x.tg.date<wk[k].minDate)) wk[k].minDate=x.tg.date; });
  const weeks=Object.values(wk).sort((a,b)=>
    (a.minDate&&b.minDate) ? a.minDate.localeCompare(b.minDate) : kwNum(a.kw)-kwNum(b.kw));
  const trs=[...new Map(list.map(x=>[x.tr.id,x.tr])).values()].sort((a,b)=>a.name.localeCompare(b.name));
  const cell={};
  list.forEach(x=>{ const k=x.tr.id+"|"+(x.tg.kw||"-"); (cell[k]=cell[k]||[]).push(x); });
  const head=`<tr><th class="calcorner">${t("bkCalTrainer")}</th>`+
    weeks.map(w=>`<th class="calh"><div>${esc(kwLabel(w.kw))}</div>${w.minDate?`<div class="calhd">${esc(shortDay(w.minDate))}</div>`:""}</th>`).join("")+`</tr>`;
  const rows=trs.map(tr=>{
    const tds=weeks.map(w=>{
      const items=cell[tr.id+"|"+w.kw]||[]; const clash=items.length>1;
      const chips=items.map(x=>{ const cl=clientOf(x.tg); const st=x.status==='confirmed'?'yes':x.status;
        return `<span class="calchip s-${st}" style="--cc:${cl?cl.color:'#888'}" title="${esc(x.tg.topic+' · '+(x.tg.city||'')+' · '+spLabel(x.status))}" onclick="openDetail('${x.tg.id}')">${esc(x.tg.city||x.tg.topic)}</span>`;
      }).join("");
      return `<td class="calcell${clash?' clash':''}">${chips}</td>`;
    }).join("");
    return `<tr><th class="calname"><span class="av xs" style="background:${tr.color}">${initials(tr.name)}</span>${esc(tr.name)}</th>${tds}</tr>`;
  }).join("");
  const legend=`<div class="callegend"><b>${t("bkLegend")}</b>
    <span class="lg"><span class="calchip s-yes" style="--cc:#3E4852">${t("bkLegYes")}</span></span>
    <span class="lg"><span class="calchip s-maybe" style="--cc:#3E4852">${t("bkLegMaybe")}</span></span>
    <span class="lg"><span class="calchip s-asked" style="--cc:#3E4852">${t("bkLegAsked")}</span></span>
    <span class="lg"><span class="clashdot"></span>${t("bkLegClash")}</span></div>`;
  return `<div class="panel"><div class="panel-b">
    <div class="tscroll"><table class="calgrid">${head}${rows}</table></div>${legend}</div></div>`;
}
function planBadge(tr){
  const p=tr.plan; if(!p)return "";
  if(p.confirmedAt&&p.status==="ok")   return `<span class="pill good">${t("planOk")}</span>`;
  if(p.confirmedAt&&p.status==="issue")return `<span class="pill crit">${t("planIssue")}</span>`;
  if(p.sentAt)                         return `<span class="pill neutral">${t("planSent")}</span>`;
  return "";
}

/* ============================================================
   WOCHENPLAN - Sessions je Trainingswoche (aus dem ETAF Dashboard
   zusammengeführt): Mo-Fr × Vormittag/Nachmittag, Auswechselbank,
   Trainer-Zuordnung aus der echten Besetzung, PowerPoint-Status.
   ============================================================ */
const WK_SLOTKEYS=["mon_am","mon_pm","tue_am","tue_pm","wed_am","wed_pm","thu_am","thu_pm","fri_am","fri_pm"];
const WK_DAYS=["mon","tue","wed","thu","fri"];
const SESS_TYPES=["orga","theorie","uebung","praxis","simulation","assessment","deliverable"];
const SESS_COL={orga:"#8A939A",theorie:"#4E6E8E",uebung:"#3F7A5E",praxis:"#2E9E6B",
                simulation:"#B23A42",assessment:"#C77E1E",deliverable:"#6E5A86"};
let curWeekId=null, WKD=null, wkEditSid=null;
/* Wohin der Wochenplan zeichnet: eigener Reiter (#wkBody) oder eingebettet
   in der Trainings-Detailansicht (#wkDetail) - gleiche Daten, gleiche Logik. */
let wkTarget="#wkBody";

function wkTrainings(){ return curTrainings().slice()
  .sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999"))); }
function openWeek(id){ curWeekId=id; if(route!=="week") go("week"); else renderWeek(); }
function wkPptRelevant(s){ return s.type!=="orga" && s.type!=="deliverable"; }
/* Titel/Deliverable in der UI-Sprache (EN-Fassungen sind aus dem Programm importiert). */
function sessTitle(s){ return (S.lang==="en" && s.titleEn) ? s.titleEn : (s.title||""); }
/* Co-Teaching: Liste der Trainer-IDs einer Session (immer als Strings). */
function sessTrIds(s){ return ((s&&s.trainerIds)||[]).map(String); }
function wkDelivText(){ return (S.lang==="en" && WKD.deliverableEn) ? WKD.deliverableEn : (WKD.deliverable||""); }
function wkSess(id){ return (WKD&&WKD.sessions||[]).find(s=>String(s.id)===String(id)); }
function wkCurTg(){ return S.trainings.find(x=>String(x.id)===String(curWeekId)); }

/* Daten je Woche laden - live aus der DB, im Demo-Modus aus dem Browser-Speicher */
async function loadWeekData(tgId){
  if(!LIVE){
    S.weekData=S.weekData||{};
    const tg=S.trainings.find(x=>x.id===tgId)||{};
    return WKD=S.weekData[tgId]=S.weekData[tgId]||{sessions:[],plan:{},deliverable:tg.deliverable||"",deliverableEn:"",stage:"",star:0};
  }
  const d=await apiCall("sessions.list",{training:tgId});
  return WKD={sessions:d.sessions||[],plan:d.plan||{},deliverable:d.deliverable||"",
              deliverableEn:d.deliverableEn||"",stage:d.stage||"",star:d.star||0};
}

/* Platzierung auflösen: alles, was in keinem Slot liegt, gehört auf die Bank. */
function wkPlacement(){
  const plan=WKD.plan||{}; const placed=new Set(); const slots={};
  for(const k of WK_SLOTKEYS){
    slots[k]=((plan[k]||[]).map(String)).filter(id=>wkSess(id)&&!placed.has(id)&&(placed.add(id)||true));
  }
  const bench=(WKD.sessions||[]).map(s=>String(s.id)).filter(id=>!placed.has(id));
  return {slots,bench};
}
function wkPlanPayload(){ const p=wkPlacement(); return {...p.slots,bench:p.bench}; }
async function persistWeekPlan(extra){
  if(LIVE){
    try{ await apiCall("weekplan.save",{training:curWeekId,plan:wkPlanPayload(),...(extra||{})}); }
    catch(e){ toast(e.message,"crit"); return false; }
  } else save();
  return true;
}

async function renderWeek(){
  wkTarget="#wkBody";
  const el=$("#v-week"); const list=wkTrainings();
  if(!list.length){ el.innerHTML=`<div class="panel"><div class="panel-b empty">${t("wkNoTrainings")}</div></div>`; return; }
  if(!curWeekId || !list.find(x=>String(x.id)===String(curWeekId))){
    const today=new Date().toISOString().slice(0,10);
    const up=list.find(x=>String(x.dateEnd||x.date||"")>=today);
    curWeekId=(up||list[0]).id;
  }
  const tabs=`<div class="wktabs tscroll">${list.map(x=>{
    const on=String(x.id)===String(curWeekId);
    const d=x.date?x.date.slice(8,10)+"."+x.date.slice(5,7)+".":"";
    return `<button class="wktab ${on?'on':''}" onclick="openWeek('${x.id}')"><b>${esc(x.code||x.kw||"?")}</b><small>${d}</small></button>`;
  }).join("")}</div>`;
  el.innerHTML=tabs+`<div id="wkBody"><div class="panel"><div class="panel-b meta">…</div></div></div>`;
  try{ await loadWeekData(curWeekId); }
  catch(e){ $("#wkBody").innerHTML=`<div class="panel"><div class="panel-b meta">${esc(e.message)}</div></div>`; return; }
  drawWeekBody();
}

function wkDayDate(i){
  const tg=wkCurTg(); if(!tg||!tg.date) return "";
  const d=new Date(tg.date+"T00:00:00"); d.setDate(d.getDate()+i);
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";
}

/* Doppelbelegung: derselbe Trainer mehrfach im selben Halbtag. */
let wkConflictSet=new Set();
function wkConflictIds(){
  const {slots}=wkPlacement(); const bad=new Set();
  for(const k of WK_SLOTKEYS){
    const byTr={};
    for(const id of slots[k]){ const s=wkSess(id);
      for(const tid of sessTrIds(s)) (byTr[tid]=byTr[tid]||[]).push(id); }
    for(const tid in byTr) if(byTr[tid].length>1) byTr[tid].forEach(id=>bad.add(id));
  }
  return bad;
}
function wkTile(id){
  const s=wkSess(id); if(!s) return "";
  const col=SESS_COL[s.type]||"#8A939A";
  const trs=sessTrIds(s).map(tid=>S.trainers.find(x=>String(x.id)===tid)).filter(Boolean);
  const avs=trs.slice(0,3).map(tr2=>`<span class="av" style="width:18px;height:18px;font-size:9px;background:${tr2.color||'#607d94'}" title="${esc(tr2.name)}">${initials(tr2.name)}</span>`).join("")
    +(trs.length>3?`<span class="meta" title="${esc(trs.slice(3).map(x=>x.name).join(", "))}">+${trs.length-3}</span>`:"");
  const conflict=wkConflictSet.has(String(id));
  const dot=wkPptRelevant(s)
    ? `<span class="ppdot ${s.ppt==='vorhanden'?'g':s.ppt==='inArbeit'?'y':'r'}" title="PPT: ${t('ppt_'+(s.ppt||''))}"></span>`:"";
  return `<div class="sess" draggable="true" data-id="${s.id}"
      ondragstart="wkDragStart(event)" ondragend="wkDragEnd()" onclick="openSessEdit('${s.id}')">
    <span class="srail" style="background:${col}"></span>
    <span class="snudge">
      <button onclick="wkNudge('${s.id}',-1,event)" title="${t("wkUp")}">▲</button>
      <button onclick="wkNudge('${s.id}',1,event)" title="${t("wkDown")}">▼</button>
    </span>
    <div class="st">${esc(sessTitle(s))}</div>
    <div class="sm"><span class="tag" style="border-color:${col};color:${col}">${t("type_"+(s.type||"theorie"))}</span>
      <span>${esc(String(s.dur||1))} h</span>
      ${avs}
      ${s.mat?`<span title="${esc(t("wkMat")+": "+s.mat)}">📦</span>`:""}
      ${conflict?`<span title="${esc(t("wkConflict"))}" style="color:var(--crit);font-weight:800">⚠</span>`:""}
      ${dot}</div></div>`;
}

  wkConflictSet=wkConflictIds();
  const {slots,bench}=wkPlacement();
  const cl=clientOf(tg); const r=rosterStats(tg);
  const totalH=(WKD.sessions||[]).reduce((a,s)=>a+(parseFloat(s.dur)||0),0);

      }).join("")
    : `<span class="meta">${t("wkNoTeam")}</span>`;

  const head=`<div class="panel"><div class="panel-b">
    <div class="wkhead" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">
      <div class="rowgrow" style="min-width:220px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <b style="font-size:17px">${esc(tg.code||"")}${tg.star?" ★":""} - ${esc(tg.topic)}</b>
          ${cl?`<span class="tag" style="border-color:${cl.color};color:${cl.color}">${esc(cl.short||cl.name)}</span>`:""}
          ${WKD.stage?`<span class="tag">${t("wkStage",WKD.stage)}</span>`:""}
        </div>
        <div class="meta" style="margin-top:3px">${esc(tg.city||"")} · ${whenLabel(tg)} · ${t("wkSessN",(WKD.sessions||[]).length)} · ${t("wkHrsN",totalH)}</div>
        <div class="wkteam" style="margin-top:10px"><span class="meta" style="font-weight:700">${t("wkTeam")}: ${r.yes}/${r.need}</span>${teamHtml}</div>
      </div>
      <div style="flex:1 1 260px;min-width:240px">
        <div class="wkdeliv"><b>${t("wkDeliverable")}</b>${esc(wkDelivText()||"-")}
          <div style="margin-top:6px"><button class="btn sm" onclick="openDelivEdit()">${ic("pen",13)}${t("edit")}</button></div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="btn sm" onclick="openPptSheet()">${ic("clip",14)}${t("wkPptChip",done,rel.length)}</button>
      ${wkTarget==="#wkBody"
        ? `<button class="btn sm" onclick="openDetail('${tg.id}')">${ic("users",14)}${t("open")} - ${t("nav_trainings")}</button>`
        : `<button class="btn sm" onclick="openWeek('${tg.id}')">${ic("week",14)}${t("nav_week")}</button>`}
      <button class="btn sm" onclick="printWeek()">${ic("printer",14)}${t("wkPrint")}</button>
      <button class="btn sm" onclick="openWeekCopy()">${ic("grid",14)}${t("wkCopy")}</button>
      <span class="spacer"></span>
      <button class="btn sm" id="wkAiBtn" onclick="wkAiSuggest()">✦ ${t("wkAi")}</button>
      <button class="btn sm" onclick="wkAutofill()">${ic("auto",14)}${t("wkAuto")}</button>
      <button class="btn sm primary" onclick="openSessEdit(null)">${ic("plus",14)}${t("wkNew")}</button>

  const grid=`<div class="wkgrid">${WK_DAYS.map((d,i)=>{
    const cols=["am","pm"].map(half=>{
      const key=d+"_"+half;
      const hrs=slots[key].reduce((a,id)=>a+(parseFloat((wkSess(id)||{}).dur)||0),0);
      return `<div class="slotbox">
        <div class="sl-h"><span>${t(half==="am"?"wkAM":"wkPM")}</span><span>${hrs?t("wkHrsN",hrs):""}</span></div>
        <div class="zone" data-slot="${key}" ondragover="wkDragOver(event)" ondragleave="wkDragLeave(event)" ondrop="wkDrop(event)">

  const tgt=$(wkTarget); if(tgt) tgt.innerHTML=head+grid+benchHtml;

/* Wochenplan in die Trainings-Detailansicht einbetten (gleiche Datenbasis -
   Änderungen hier und im Reiter „Wochenplan“ sind automatisch dasselbe).
   Wird auch vom 8-Sekunden-Hintergrundabgleich aufgerufen - deshalb:
   nie den Platzhalter zeigen, wenn die Woche schon dasteht, und nur neu
   zeichnen, wenn sich die Daten wirklich geändert haben (kein Flackern). */
let wkEmbedKey=null, wkDragBusy=false, wkDrawnSig="";
/* Fingerabdruck dessen, was der Wochenplan darstellt: Sessions/Platzierung
   PLUS Besetzung (Team der Woche) und UI-Sprache - ändert sich davon nichts,
   muss auch nichts neu gezeichnet werden. */
function wkSig(){
  const tg=wkCurTg();
  const team=((tg&&tg.roster)||[]).map(r=>r.trainerId+":"+r.status).join(",");
  return JSON.stringify(WKD)+"|"+team+"|"+S.lang;
}
async function renderWeekEmbed(tgId){
  const el=$("#wkDetail"); if(!el) return;
  const same = wkEmbedKey===String(tgId) && !!el.querySelector(".wkgrid");
  wkEmbedKey=String(tgId);
  curWeekId=tgId; wkTarget="#wkDetail";
  // Mitten in einer Bearbeitung (Blatt offen) oder beim Ziehen: nicht anfassen.
  if(same && (wkDragBusy || $("#sheet").classList.contains("on"))) return;
  if(!same) el.innerHTML=`<div class="panel"><div class="panel-b meta">…</div></div>`;
  try{ await loadWeekData(tgId); }
  catch(e){ if(!same) el.innerHTML=`<div class="panel"><div class="panel-b meta">${esc(e.message)}</div></div>`; return; }
  if(wkTarget!=="#wkDetail" || !$("#wkDetail")) return;   // Ansicht inzwischen gewechselt
  if(same && wkSig()===wkDrawnSig) return;                // exakt derselbe Stand → nichts neu zeichnen
  drawWeekBody();
}

/* ---- Ziehen & Ablegen (Desktop); Antippen öffnet den Editor mit „Verschieben nach“ ---- */
/* Ziehen wird komplett auf Ebene des Halbtags (.zone) ausgewertet - so ist die
   ganze Fläche inklusive der Kacheln ein Ablageziel (kein Zielen mehr nötig),
   und die Einfügestelle ergibt sich aus der Mausposition. */
let wkDragId=null, wkDragTr=null;
function wkDragStart(ev){
  wkDragBusy=true; wkDragId=ev.currentTarget.dataset.id; wkDragTr=null;
  ev.dataTransfer.setData("text/plain",wkDragId);
  ev.dataTransfer.effectAllowed="move";
  ev.currentTarget.classList.add("dragging");
}
/* Trainer-Chip ziehen → auf einer Session-Kachel loslassen = zuteilen.
   Der Trainer bleibt oben im Team und kann weitere Sessions bekommen. */
function wkTrDragStart(ev,trId){ wkDragBusy=true; wkDragTr=String(trId); wkDragId=null;
  ev.dataTransfer.setData("text/plain","tr:"+trId); ev.dataTransfer.effectAllowed="copy"; }
function wkDragEnd(){ wkDragBusy=false; wkDragId=null; wkDragTr=null; wkClearDrop(); }
function wkClearDrop(){
  $$(".zone.dragover").forEach(z=>z.classList.remove("dragover"));
  $$(".slotbox.dropbox").forEach(z=>z.classList.remove("dropbox"));
  $$(".sess.trtarget").forEach(z=>z.classList.remove("trtarget"));
  $$(".sess.dragging").forEach(z=>z.classList.remove("dragging"));
  $$(".dropline").forEach(l=>l.remove());
}
/* An welche Stelle im Halbtag käme die Kachel? (Mitte der Nachbarkachel entscheidet) */
function wkInsertIndex(zone,y){
  const tiles=[...zone.querySelectorAll(".sess:not(.dragging)")];
  for(let i=0;i<tiles.length;i++){
    const r=tiles[i].getBoundingClientRect();
    if(y < r.top + r.height/2) return i;
  }
  return tiles.length;
}
function wkDragOver(ev){
  ev.preventDefault();
  const zone=ev.currentTarget;
  if(wkDragTr){                       // Trainer-Chip: nur die Kachel darunter markieren
    ev.dataTransfer.dropEffect="copy";
    $$(".sess.trtarget").forEach(z=>z.classList.remove("trtarget"));
    const tile=ev.target.closest&&ev.target.closest(".sess");
    if(tile) tile.classList.add("trtarget");
    return;
  }
  ev.dataTransfer.dropEffect="move";
  // Ziel-Halbtag deutlich hervorheben
  $$(".zone.dragover").forEach(z=>{ if(z!==zone) z.classList.remove("dragover"); });
  $$(".slotbox.dropbox").forEach(z=>z.classList.remove("dropbox"));
  zone.classList.add("dragover");
  zone.closest(".slotbox")&&zone.closest(".slotbox").classList.add("dropbox");
  if(zone.dataset.slot==="bench"){ $$(".dropline").forEach(l=>l.remove()); return; }
  // Einfügemarke an der richtigen Stelle zeigen
  const idx=wkInsertIndex(zone,ev.clientY);
  const tiles=[...zone.querySelectorAll(".sess:not(.dragging)")];
  let line=zone.querySelector(".dropline");
  if(!line){ $$(".dropline").forEach(l=>l.remove()); line=document.createElement("div"); line.className="dropline"; }
  if(idx>=tiles.length) zone.appendChild(line); else zone.insertBefore(line,tiles[idx]);
}
function wkDragLeave(ev){
  // nur räumen, wenn der Zeiger den Halbtag wirklich verlässt
  if(ev.relatedTarget && ev.currentTarget.contains(ev.relatedTarget)) return;
  ev.currentTarget.classList.remove("dragover");
  ev.currentTarget.closest(".slotbox")&&ev.currentTarget.closest(".slotbox").classList.remove("dropbox");
  ev.currentTarget.querySelectorAll(".dropline").forEach(l=>l.remove());
}
async function wkDrop(ev){
  ev.preventDefault();
  const zone=ev.currentTarget, slot=zone.dataset.slot;
  const idx=slot==="bench"?null:wkInsertIndex(zone,ev.clientY);
  const trId=wkDragTr, sid=wkDragId;
  const tile=ev.target.closest&&ev.target.closest(".sess");
  wkClearDrop(); wkDragBusy=false; wkDragTr=null; wkDragId=null;
  if(trId){ if(tile) assignTrainerToSess(tile.dataset.id, trId); return; }
  const id=sid || ev.dataTransfer.getData("text/plain");
  if(!id || !wkSess(id)) return;
  wkMoveTo(id, slot, idx);
}
/* Pfeile an der Kachel: eine Position höher/tiefer - über die Halbtags-Grenze
   hinaus landet die Kachel im Nachbar-Halbtag. Auch am Handy nutzbar. */
async function wkNudge(id,dir,ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const {slots}=wkPlacement();
  let cur=null, idx=-1;
  for(const k of WK_SLOTKEYS){ const i=slots[k].indexOf(String(id)); if(i>=0){ cur=k; idx=i; break; } }
  if(cur===null){   // von der Bank ins Raster
    return wkMoveTo(id, dir<0?WK_SLOTKEYS[WK_SLOTKEYS.length-1]:WK_SLOTKEYS[0], null);
  }
  const ni=idx+dir;
  if(ni>=0 && ni<slots[cur].length) return wkMoveTo(id,cur,ni);
  const pos=WK_SLOTKEYS.indexOf(cur)+dir;
  if(pos<0||pos>=WK_SLOTKEYS.length) return;
  const target=WK_SLOTKEYS[pos];
  return wkMoveTo(id,target, dir<0 ? slots[target].length : 0);
}
async function assignTrainerToSess(sid,trId){
  const s=wkSess(sid); if(!s) return;
  const tr=S.trainers.find(x=>String(x.id)===String(trId));
  const ids=sessTrIds(s);
  // Co-Teaching: Hinzufügen statt Ersetzen - mehrere Trainer je Session sind normal.
  if(ids.includes(String(trId))){ toast(t("wkAlreadyAssigned", tr?tr.name:"?"),"warn"); return; }
  ids.push(String(trId)); s.trainerIds=ids;
  if(LIVE){
    try{ await apiCall("session.save",{training:curWeekId,id:sid,title:s.title,titleEn:s.titleEn||"",
      type:s.type,dur:s.dur,desc:s.desc||"",trainerIds:ids,ppt:s.ppt||"",pptBy:s.pptBy||0,pptDue:s.pptDue||"",mat:s.mat||""}); }
    catch(e){ toast(e.message,"crit"); return; }
  } else save();
  drawWeekBody();
  if(wkConflictSet.has(String(sid))) toast(t("wkConflictToast", tr?tr.name:"?"),"warn");
  else toast(t("wkAssigned", s.title, tr?tr.name:"?"),"good");
}
/* Kachel verschieben. index = Einfügestelle im Halbtag (null = ans Ende). */
async function wkMoveTo(id,slot,index){
  const {slots}=wkPlacement();
  for(const k of WK_SLOTKEYS) slots[k]=slots[k].filter(x=>x!==String(id));
  if(slot!=="bench" && WK_SLOTKEYS.includes(slot)){
    const arr=slots[slot];
    const i=(index===null||index===undefined||index<0||index>arr.length)?arr.length:index;
    arr.splice(i,0,String(id));
  }
  WKD.plan={...slots,bench:[]};   // Bank ergibt sich aus „nirgends platziert“
  drawWeekBody();
  await persistWeekPlan();
}

/* ---- Auto-Verteilung: Sessions der Reihe nach auf Mo-Fr füllen (~4 h je Halbtag) ---- */
async function wkAutofill(){
  if(!(WKD.sessions||[]).length){ toast(t("wkEmpty"),"warn"); return; }
  if(!confirm(t("wkAutoAsk"))) return;
  const plan={}; WK_SLOTKEYS.forEach(k=>plan[k]=[]);
  const hrs=k=>plan[k].reduce((a,id)=>a+(parseFloat((wkSess(id)||{}).dur)||1),0);
  let i=0;
  for(const s of WKD.sessions){
    const d=parseFloat(s.dur)||1;
    while(i<WK_SLOTKEYS.length-1 && hrs(WK_SLOTKEYS[i])+d>4.25) i++;
    plan[WK_SLOTKEYS[i]].push(String(s.id));
  }
  WKD.plan={...plan,bench:[]};
  drawWeekBody();
  if(await persistWeekPlan()) toast(t("wkSaved"),"good");
}

/* ---- Session-Editor (Blatt): Felder + Trainer + PPT + Verschieben ---- */
function wkTrainerOptions(sel){
  const tg=wkCurTg();
  const teamIds=(tg&&tg.roster||[]).filter(x=>["yes","confirmed","maybe","asked"].includes(x.status)).map(x=>String(x.trainerId));
  const team=S.trainers.filter(tr2=>teamIds.includes(String(tr2.id)));
  const rest=S.trainers.filter(tr2=>!teamIds.includes(String(tr2.id))).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const opt=tr2=>`<option value="${tr2.id}" ${String(sel||"")===String(tr2.id)?"selected":""}>${esc(tr2.name)}</option>`;
  return `<option value="">${t("wkTrainerNone")}</option>`
    +(team.length?`<optgroup label="${t("wkTeam")}">${team.map(opt).join("")}</optgroup>`:"")
    +`<optgroup label="${t("nav_trainers")}">${rest.map(opt).join("")}</optgroup>`;
}
let wkEdTrainers=[];   // Arbeitsliste der Trainer im Session-Editor (Co-Teaching)
function wsDrawTrainers(){
  const box=$("#wsTrList"); if(!box) return;
  box.innerHTML=wkEdTrainers.length?wkEdTrainers.map(tid=>{
    const tr2=S.trainers.find(x=>String(x.id)===String(tid));
    return `<span class="tmchip" style="cursor:default">
      <span class="av" style="width:22px;height:22px;font-size:10px;background:${tr2?tr2.color||'#607d94':'#607d94'}">${tr2?initials(tr2.name):"?"}</span>
      ${esc(tr2?tr2.name:"?")}
      <button onclick="wsRemoveTrainer('${tid}')" style="border:none;background:none;cursor:pointer;color:var(--crit);font-weight:800;font-size:14px;padding:0 2px">×</button></span>`;
  }).join(""):`<span class="meta">${t("wkTrainerNone")}</span>`;
  const tg=wkCurTg();
  const teamIds=((tg&&tg.roster)||[]).filter(x=>["yes","confirmed","maybe","asked"].includes(x.status)).map(x=>String(x.trainerId));
  const opt=tr2=>`<option value="${tr2.id}">${esc(tr2.name)}</option>`;
  const avail=S.trainers.filter(tr2=>!wkEdTrainers.includes(String(tr2.id)));
  const team=avail.filter(tr2=>teamIds.includes(String(tr2.id)));
  const rest=avail.filter(tr2=>!teamIds.includes(String(tr2.id))).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const sel=$("#wsTrAdd");

/* ---- KI-Wochenrhythmus: Verteilung von der KI vorschlagen lassen ---- */
async function wkAiSuggest(){
  if(!(WKD.sessions||[]).length){ toast(t("wkEmpty"),"warn"); return; }
  if(!confirm(t("wkAiAsk"))) return;
  if(!LIVE){ toast(t("wkAiDemo"),"warn");
    const plan={}; WK_SLOTKEYS.forEach(k=>plan[k]=[]);
    const hrs=k=>plan[k].reduce((a,id)=>a+(parseFloat((wkSess(id)||{}).dur)||1),0);
    let i=0;
    for(const s of WKD.sessions){ const d=parseFloat(s.dur)||1;
      while(i<WK_SLOTKEYS.length-1 && hrs(WK_SLOTKEYS[i])+d>4.25) i++;
      plan[WK_SLOTKEYS[i]].push(String(s.id)); }
    WKD.plan={...plan,bench:[]}; save(); drawWeekBody(); return; }
  // Sichtbar machen, dass gearbeitet wird: Knopf zeigt einen Fortschrittskringel.
  const btn=$("#wkAiBtn");
  if(btn){ btn.disabled=true; btn.innerHTML=`<span class="btnspin"></span>${t("wkAiRunShort")}`; }
  toast(t("wkAiRun"),"good");
  try{
    const d=await apiCall("weekplan.suggest",{training:curWeekId});
    WKD.plan=d.plan||{};
    drawWeekBody();   // zeichnet auch den Knopf zurück
    toast(t("wkAiDone")+(d.unplaced?` (${d.unplaced} → ${t("wkBench")})`:""),"good");
  }catch(e){
    drawWeekBody();
    // Fehler deutlich zeigen - ein kurzer Toast reicht hier nicht (KI-Läufe dauern).
    alert(t("wkAi")+": "+e.message);
  }
}

/* ---- Dokumenttitel der Druckbögen: wird zum Dateinamen der PDF und steht in
       der Kopfzeile des Ausdrucks - deshalb Woche und Zeitraum hineinnehmen. ---- */
let docTitleOld=null;
function setSheetTitle(txt){
  if(docTitleOld===null) docTitleOld=document.title;
  document.title=String(txt).replace(/[\/\\:*?"<>|]/g," ").replace(/\s+/g," ").trim();
  document.body.classList.add("sheetprint");
}
function clearSheetTitle(){
  if(docTitleOld!==null){ document.title=docTitleOld; docTitleOld=null; }
  document.body.classList.remove("sheetprint");
}
/* Kurzer Zeitraum „09.11.-13.11.2026“ für Titel und Dateinamen. */
function dateSpan(tg){
  if(!tg||!tg.date) return "";
  const f=s=>{const d=new Date(s+"T00:00:00");return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";};
  const y=(tg.dateEnd||tg.date).slice(0,4);
  return (tg.dateEnd&&tg.dateEnd!==tg.date) ? `${f(tg.date)}-${f(tg.dateEnd)}${y}` : `${f(tg.date)}${y}`;
}

async function doWeekCopy(){

    const cur=S.weekData[curWeekId]={sessions:[],plan:{},deliverable:src.deliverable||"",deliverableEn:src.deliverableEn||""};

  }
}

async function saveGuarded(action, payload, onDone){
  try{
    const d=await apiCall(action,payload);
    if(onDone)await onDone(d);
    return true;
  }catch(e){
    if(e && e.conflict){
      conflictDialog(e, null, async()=>{
        try{ const d=await apiCall(action,Object.assign({},payload,{force:1}));
          if(onDone)await onDone(d); toast(t("cfForced"),"warn");
        }catch(e2){ toast(e2.message,"crit"); }
      });
      return false;
    }
    toast("Fehler: "+e.message,"crit"); return false;
  }
}

function travelParts(fl,tg){

    ?{arr:'Anreise',dep:'Abreise',out:'Hinflug',ret:'Rückflug',hotel:'Hotel',room:'Zimmer',visa:'Visum',pass:'Pass gültig bis'}

/* ---- Datum: echte Zeiträume statt nur KW ---- */
const MONTHS={de:["","Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
              en:["","January","February","March","April","May","June","July","August","September","October","November","December"]};
function pad2(n){return String(n).padStart(2,"0");}
function pdate(s){ if(!s)return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m?{y:+m[1],mo:+m[2],d:+m[3]}:null; }
function shiftD(x,delta){ const dt=new Date(x.y,x.mo-1,x.d+delta); return {y:dt.getFullYear(),mo:dt.getMonth()+1,d:dt.getDate()}; }
function fmtDateRange(s,e,lang){
  lang=lang||S.lang; const mon=MONTHS[lang==='en'?'en':'de'];
  const P=pdate(s); if(!P)return "";
  const Q=pdate(e);
  const dm=x=> lang==='de' ? `${x.d}. ${mon[x.mo]}` : `${x.d} ${mon[x.mo]}`;
  if(!Q || (P.y===Q.y&&P.mo===Q.mo&&P.d===Q.d)) return `${dm(P)} ${P.y}`;
  if(P.y===Q.y&&P.mo===Q.mo) return lang==='de' ? `${P.d}.-${Q.d}. ${mon[P.mo]} ${P.y}` : `${P.d}-${Q.d} ${mon[P.mo]} ${P.y}`;
  return `${dm(P)} - ${dm(Q)} ${Q.y}`;
}
/* Reisefenster: ein Tag vor Beginn bis ein Tag nach Ende (An-/Abreise-Puffer). */
function fmtTravelWindow(s,e,lang){
  const P=pdate(s); if(!P)return ""; const Q=pdate(e)||P;
  const a=shiftD(P,-1), b=shiftD(Q,1);
  return fmtDateRange(`${a.y}-${pad2(a.mo)}-${pad2(a.d)}`,`${b.y}-${pad2(b.mo)}-${pad2(b.d)}`,lang);
}
function shortDay(s){ const P=pdate(s); return P?`${pad2(P.d)}.${pad2(P.mo)}`:""; }
/* Kalenderwoche sprachabhängig: "KW 20" (de) → "Week 20" (en). */
function kwLabel(kw,lang){ lang=lang||S.lang; return (lang==='en') ? String(kw||"").replace(/^\s*KW\s*/,"Week ") : (kw||""); }
/* Zeitraum-Anzeige: echtes Datum wenn vorhanden, sonst KW/Monat. */
function whenText(tg){ return fmtDateRange(tg.date,tg.dateEnd) || kwLabel(tg.kw) || tg.month || ""; }
function openPlan(trId){ curPlanTr=S.trainers.find(t=>t.id===trId)||null; route="plan"; render(); }
function renderPlan(){
  const tr=curPlanTr; if(!tr){go("trainers");return;}
  const sched=trainerSchedule(tr.id);
  const cnt={yes:0,maybe:0,asked:0};
  sched.forEach(x=>{ if(x.status==="yes"||x.status==="confirmed")cnt.yes++; else if(x.status==="maybe")cnt.maybe++; else cnt.asked++; });
  const p=tr.plan;
  const confirmLine = p&&p.confirmedAt
    ? `<div class="planconf ${p.status==="issue"?"bad":"ok"}">${p.status==="issue"
        ? `${ic("alert")}${t("planIssueMsg")}${p.note?`: „${esc(p.note)}“`:""}`
        : `${ic("check")}${t("planOkMsg")}`} <span class="meta">(${esc((p.confirmedAt||"").slice(0,16).replace("T"," "))})</span></div>`
    : (p&&p.sentAt ? `<div class="planconf sent">${ic("send")}${t("planSentMsg")} <span class="meta">(${esc((p.sentAt||"").slice(0,16).replace("T"," "))})</span></div>` : "");

  const rows=sched.length ? sched.map(x=>{
    const tg=x.tg, cl=(S.clients||[]).find(c=>c.id===tg.clientId);
    const when=whenText(tg);
    const kwSub=(tg.kw && fmtDateRange(tg.date,tg.dateEnd))?kwLabel(tg.kw):"";
    const sub=[tg.spec||"", cl?cl.name:""].filter(Boolean).join(" · ");
    const trav=travelLine(x.flight,tg);
    const twin=fmtTravelWindow(tg.date,tg.dateEnd);
    return `<tr class="clickrow" title="${t("bkOpenModule")}" onclick="openDetail('${tg.id}')">
      <td><span class="pill ${spCls(x.status)}">${spLabel(x.status)}</span></td>
      <td class="nowrap">${esc(when||"-")}${kwSub?`<div class="meta">${esc(kwSub)}</div>`:""}</td>
      <td>${esc(tg.city||"")}${tg.country?", "+esc(tg.country):""}</td>
      <td><b>${esc(tg.topic)}</b>${sub?`<div class="meta">${esc(sub)}</div>`:""}${twin?`<div class="meta">${ic("plane")}${t("travelWin")}: ${esc(twin)}</div>`:""}${trav?`<div class="meta travrow">${ic("bag")}${trav}</div>`:""}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" class="meta" style="padding:16px 8px">${t("planEmpty")}</td></tr>`;

  $("#v-plan").innerHTML=`
    <button class="btn sm noprint" onclick="go('trainers')" style="margin-bottom:14px">${ic("back")}${t("back")}</button>
    <div class="panel plandoc"><div class="panel-b">
      <div class="planhead">
        <div>
          <div class="planlogo">ETAF<span>.</span></div>
          <h2 style="margin:6px 0 2px">${t("planTitle")}</h2>
          <div class="meta">${esc(tr.name)} · ✉︎ ${esc(tr.email||"-")}${tr.phone?" · ☎ "+esc(tr.phone):""}</div>
        </div>
        <div class="plansum">
          <span class="pill good">${t("sp_yes")}: ${cnt.yes}</span>
          <span class="pill warn">${t("sp_maybe")}: ${cnt.maybe}</span>
          <span class="pill neutral">${t("sp_asked")}: ${cnt.asked}</span>
        </div>
      </div>
      ${confirmLine}
      <div class="tscroll"><table class="plantable">
        <tr><th>${t("planColStatus")}</th><th>${t("planColWhen")}</th><th>${t("planColWhere")}</th><th>${t("planColWhat")}</th></tr>
        ${rows}
      </table></div>
      <div class="meta planfoot">${t("planFoot")}</div>
    </div></div>
    <div class="planactions noprint">
      <button class="btn" onclick="printPlan()">${ic("printer")}${t("planPrint")}</button>
      <button class="btn primary" onclick="sendPlan('${tr.id}')">${ic("send")}${t("planSend")}</button>
    </div>`;
}
function printPlan(){ document.body.classList.add("printing-plan"); window.print(); setTimeout(()=>document.body.classList.remove("printing-plan"),400); }
async function sendPlan(trId){
  const tr=S.trainers.find(t=>t.id===trId); if(!tr)return;
  if(!tr.email){ toast(t("planNoMail"),"crit"); return; }
  if(LIVE){
    try{ const d=await apiCall("plan.send",{trainer:trId,lang:trainerLang(tr)});
      await pull(); curPlanTr=S.trainers.find(t=>t.id===trId)||curPlanTr; renderPlan();
      toast(t("planSentToast",tr.name.split(" ").slice(-1)),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
  } else {
    demoLog(tr.email, t("planSubject"), trainerLang(tr), "logged");
    toast(t("planSentToast",tr.name.split(" ").slice(-1)),"good");
  }
}

let curTransferCl=null;
function clientTransferRows(clientId){
  const out=[];
  S.trainings.filter(tg=>tg.clientId===clientId).forEach(tg=>(tg.roster||[]).forEach(r=>{
    if(r.status!=="yes"&&r.status!=="confirmed")return;
    const tr=S.trainers.find(t=>t.id===r.trainerId); if(!tr)return;
    out.push({tg,tr,flight:r.flight});
  }));
  return out.sort((a,b)=>String(a.tg.date||"zzz").localeCompare(String(b.tg.date||"zzz"))||a.tr.name.localeCompare(b.tr.name));
}
function openTransfer(clientId){ curTransferCl=(S.clients||[]).find(c=>c.id===clientId)||null; route="transfer"; render(); }
function renderTransfer(){
  const cl=curTransferCl; if(!cl){go("bookings");return;}
  const rows=clientTransferRows(cl.id); const tr=cl.transfer;
  const conf = tr&&tr.confirmedAt
    ? `<div class="planconf ok">${ic("check")}${t("trfConfirmed")} <span class="meta">(${esc((tr.confirmedAt||"").slice(0,16).replace("T"," "))})</span>${tr.note?` - „${esc(tr.note)}“`:""}</div>`
    : (tr&&tr.sentAt ? `<div class="planconf sent">${ic("send")}${t("trfSent")} <span class="meta">(${esc((tr.sentAt||"").slice(0,16).replace("T"," "))})</span></div>` : "");
  const body=rows.length?rows.map(x=>{
    const fl=x.flight||{}, tg=x.tg;
    const arr=[fl.arrival||"",fl.flightOut||""].filter(Boolean).join(" · ");
    const dep=[fl.departure||"",fl.flightReturn||""].filter(Boolean).join(" · ");
    const hotel=[(tg.travel&&tg.travel.hotel)||"",fl.room||""].filter(Boolean).join(" · ");
    return `<tr>
      <td><div class="bktr"><span class="av xs" style="background:${x.tr.color}">${initials(x.tr.name)}</span><b>${esc(x.tr.name)}</b></div>${x.tr.phone?`<div class="meta">☎ ${esc(x.tr.phone)}</div>`:""}</td>
      <td>${esc(arr||"-")}</td><td>${esc(dep||"-")}</td><td>${esc(hotel||"-")}</td>
      <td><b>${esc(tg.topic)}</b><div class="meta">${esc(tg.city||"")}${tg.country?", "+esc(tg.country):""}${tg.date?" · "+esc(fmtDateRange(tg.date,tg.dateEnd)):""}</div></td>
    </tr>`;
  }).join(""):`<tr><td colspan="5" class="meta" style="padding:16px 8px">${t("trfEmpty")}</td></tr>`;
  $("#v-transfer").innerHTML=`
    <button class="btn sm noprint" onclick="go('bookings')" style="margin-bottom:14px">${ic("back")}${t("back")}</button>
    <div class="panel plandoc"><div class="panel-b">
      <div class="planhead"><div>
        <div class="planlogo">ETAF<span>.</span></div>
        <h2 style="margin:6px 0 2px">${t("trfTitle")}</h2>
        <div class="meta">${esc(cl.name)}${cl.contactName?" · "+esc(cl.contactName):""}${cl.contactEmail?" · ✉︎ "+esc(cl.contactEmail):""}</div>
      </div></div>
      ${conf}
      <div class="tscroll"><table class="plantable">
        <tr><th>${t("bkTrainer")}</th><th>${t("trfArr")}</th><th>${t("trfDep")}</th><th>${t("trfHotel")}</th><th>${t("planColWhat")}</th></tr>
        ${body}
      </table></div>
      <div class="meta planfoot">${t("trfFoot")}</div>
    </div></div>
    <div class="planactions noprint">
      <button class="btn" onclick="printPlan()">${ic("printer")}${t("planPrint")}</button>
      <button class="btn primary" onclick="sendTransfer('${cl.id}')">${ic("send")}${t("trfSend")}</button>
      ${(tr&&tr.sentAt&&!tr.confirmedAt)?`<button class="btn" onclick="remindTransfer('${cl.id}')">${ic("bell")}${t("trfRemind")}</button>`:""}
    </div>`;
}
async function remindTransfer(cid){
  const cl=(S.clients||[]).find(c=>c.id===cid); if(!cl)return;
  if(LIVE){
    try{ await apiCall("transfer.remind",{client:cid,lang:S.emailLang||"en"});
      await pull(); curTransferCl=(S.clients||[]).find(c=>c.id===cid)||curTransferCl; renderTransfer();
      toast(t("trfRemindToast",cl.name),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
  } else { toast(t("trfRemindToast",cl.name),"good"); }
}
async function sendTransfer(cid){
  const cl=(S.clients||[]).find(c=>c.id===cid); if(!cl)return;
  if(!cl.contactEmail){ toast(t("trfNoMail"),"crit"); return; }
  if(LIVE){
    try{ const d=await apiCall("transfer.send",{client:cid,lang:S.emailLang||"en"});
      await pull(); curTransferCl=(S.clients||[]).find(c=>c.id===cid)||curTransferCl; renderTransfer();
      toast(t("trfSentToast",cl.name),"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
  } else { demoLog(cl.contactEmail,t("trfTitle"),S.emailLang||"en","logged"); toast(t("trfSentToast",cl.name),"good"); }
}

}

/* ============================================================
   COMPOSER (E-Mail slide-over) - mit Sprachwahl DE/EN
   ============================================================ */
let compose={tgId:null,recips:[],tplId:"t1",lang:"en"};
function fillTpl(str,tg,tr){
  const lang=(typeof compose!=="undefined"&&compose&&compose.lang)?compose.lang:(S.emailLang||S.lang);
  return str
    .replace(/{{firstName}}/g,tr?tr.name.replace(/^Dr\.\s*/,"").split(" ")[0]:"{{firstName}}")
    .replace(/{{topic}}/g,tg.topic).replace(/{{city}}/g,tg.city)
    .replace(/{{country}}/g,tg.country).replace(/{{kw}}/g,kwLabel(tg.kw,lang))
    .replace(/{{month}}/g,tg.month).replace(/{{teamSize}}/g,tg.need);
}
function composeFor(tgId,trId,tplId){
  const tg=S.trainings.find(t=>t.id===tgId);
  let auto=trId?[trId]:ranked(tg).filter(x=>!x.status);
  if(!trId){ const seen=new Set();   // pro E-Mail nur einmal vorschlagen (Dubletten-Schutz)
    auto=auto.filter(x=>{const e=(x.tr.email||"").toLowerCase(); if(!e)return true; if(seen.has(e))return false; seen.add(e); return true;})
      .slice(0,tg.need).map(x=>x.tr.id); }
  // Bei genau einem Empfänger: Ansprache-Sprache aus dem Trainerprofil vorwählen
  const lang0 = auto.length===1 ? trainerLang(S.trainers.find(x=>x.id===auto[0])) : (S.emailLang||"en");
  compose={tgId,recips:auto, tplId:tplId||"t1", lang:lang0, purpose:"ask"};
  drawComposer();openSheet();
}
function setComposeLang(l){compose.lang=l;S.emailLang=l;save();drawComposer();}
function drawComposer(){
  const tg=S.trainings.find(t=>t.id===compose.tgId);
  const tpl=S.templates.find(t=>t.id===compose.tplId);
  const v=tpl[compose.lang];
  const first=compose.recips.length===1?S.trainers.find(t=>t.id===compose.recips[0]):null;
  const recipChips=compose.recips.map(id=>{const tr=S.trainers.find(t=>t.id===id);
    return `<span class="recip">${initials(tr.name)} · ${tr.name.split(" ").slice(-1)}
      <span style="cursor:pointer;opacity:.6" onclick="rmRecip('${id}')">✕</span></span>`}).join("");
  $("#sheetTitle").textContent=compose.recips.length>1?t("bulkTitle",compose.recips.length):t("sendReq");
  $("#sheetBody").innerHTML=`
    <label class="fld">${t("from")}</label>
    <input class="inp" value="trainer@dvi-systems.com" readonly style="color:var(--muted)">
    <label class="fld">${t("to",compose.recips.length)}</label>
    <div class="chips">${recipChips||`<span class="meta">${t("noRecip")}</span>`}</div>
    <div class="fldrow">
      <label class="fld">${t("emailLang")}</label>
      <span class="langsw">
        <button onclick="setComposeLang('de')" class="${compose.lang==='de'?'on':''}">DE</button>
        <button onclick="setComposeLang('en')" class="${compose.lang==='en'?'on':''}">EN</button>
      </span>
    </div>
    <label class="fld">${t("template")}</label>
    <div class="chips">${S.templates.map(tp=>`<span class="chip ${tp.id===compose.tplId?'on':''}" onclick="pickTpl('${tp.id}')">${tp[compose.lang].name}</span>`).join("")}</div>
    <label class="fld">${t("subject")}</label>
    <input class="inp" id="cSubj" value="${esc(fillTpl(v.subject,tg,first))}">
    <label class="fld">${t("message")}</label>
    <div class="rte">
      <button onclick="wrap('**')" title="${t("boldT")}">B</button>
      <button onclick="wrap('_')" title="${t("italicT")}"><i>I</i></button>
      <button onclick="ins('\\n• ')" title="${t("listT")}">•</button>
      <button onclick="insResp()" title="${t("btnsT")}">⛶</button>
    </div>
    <textarea id="cBody">${esc(fillTpl(v.body,tg,first))}</textarea>
    <div class="meta" style="margin-top:8px">${t("composerHint")}</div>`;
  $("#sheetFoot").innerHTML=`
    <button class="btn" onclick="closeSheet()">${t("discard")}</button>
    <div class="spacer"></div>
    <button class="btn primary" onclick="sendCompose()">${svg(IC.mail)} ${t("sendCheck")}</button>`;
}
function pickTpl(id){compose.tplId=id;drawComposer();}
function rmRecip(id){compose.recips=compose.recips.filter(x=>x!==id);drawComposer();}
function wrap(m){const el=$("#cBody");const s=el.selectionStart,e=el.selectionEnd;
  el.value=el.value.slice(0,s)+m+el.value.slice(s,e)+m+el.value.slice(e);el.focus();}
function ins(x){const el=$("#cBody");const s=el.selectionStart;
  el.value=el.value.slice(0,s)+x+el.value.slice(s);el.focus();}
function insResp(){ins(RESP[compose.lang]);}
async function sendCompose(){
  const subject=$("#cSubj")?$("#cSubj").value:"";
  const bodyText=$("#cBody")?$("#cBody").value:"";
  const n=compose.recips.length;
  const cancel=compose.purpose==="cancel";
  if(LIVE){
    const tgId=compose.tgId, recips=compose.recips.slice(), lang=compose.lang;
    closeSheet();
    try{
      const args={training:tgId,recipients:recips,lang,subject,body:bodyText};
      if(cancel)args.status="no";
      const d=await apiCall("request.create",args);
      await pull(); buildNav();
      if(route==="detail")renderDetail(); if(route==="dash")renderDash();
      toast(cancel?t("cancelSent",d.sent!=null?d.sent:n):t("sentToast",d.sent!=null?d.sent:n),cancel?"warn":"good");
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
    return;
  }
  compose.recips.forEach(id=>setStatus(compose.tgId,id,cancel?"no":"asked"));
  compose.recips.forEach(id=>{const trx=S.trainers.find(t=>t.id===id); if(trx)demoLog(trx.email,subject,compose.lang,"logged");});
  closeSheet();
  toast(cancel?t("cancelSent",n):t("sentToast",n),cancel?"warn":"good");
  if(route==="detail")renderDetail();
  if(route==="dash")renderDash();
  buildNav();
  if(cancel)return;   // Absage: keine simulierten Rückläufer
  compose.recips.forEach((id,i)=>{
    setTimeout(()=>{
      if(Math.random()<0.7){
        const roll=Math.random();const st=roll<0.6?"yes":roll<0.82?"maybe":"no";
        setStatus(compose.tgId,id,st);
        const tr=S.trainers.find(t=>t.id===id);
        toast(`↩ ${tr.name.split(" ").slice(-1)}: ${spLabel(st)}`,st==="yes"?"good":st==="no"?"crit":"warn");
        if(route==="detail")renderDetail();
        if(route==="dash")renderDash();
        buildNav();
      }
    }, 2600+i*1500+Math.random()*1500);
  });
}

   QUICK REPLACEMENT

let quick={tgId:null,recips:[]};
function quickDefaultPool(tg){return ranked(tg).filter(x=>!x.status||x.status==="no").slice(0,5).map(x=>x.tr.id);}
function openQuick(tgId){
  const tg=tgId?S.trainings.find(t=>t.id===tgId):S.trainings.find(t=>statusOf(t).cls!=="good")||S.trainings[0];
  quick={tgId:tg.id, recips:quickDefaultPool(tg)};
  drawQuick(); openSheet();
}
function quickPickTraining(id){
  const tg=S.trainings.find(t=>t.id===id); if(!tg)return;
  quick={tgId:id, recips:quickDefaultPool(tg)};   // neues Training → passende Vorschläge
  drawQuick();
}
function quickRm(id){ quick.recips=quick.recips.filter(x=>x!==id); drawQuick(); }
function quickAdd(id){ if(id&&!quick.recips.includes(id))quick.recips.push(id); drawQuick(); }
function drawQuick(){
  const tg=S.trainings.find(t=>t.id===quick.tgId);
  const rows=quick.recips.map(id=>{
    const tr=S.trainers.find(t=>t.id===id); if(!tr)return "";
    return `<div class="row">
      <div class="av" style="background:${tr.color}">${initials(tr.name)}</div>
      <div class="rowgrow"><div class="nm">${esc(tr.name)}</div>
        <div class="meta">${esc(tr.region)} · ${esc(tr.spec[0]||"")} · ⚡ ${t("reachable")}</div></div>
      <span class="fit">${scoreTrainer(tr,tg)}%</span>
      <button class="btn sm" onclick="quickRm('${id}')" title="${t("remove")}">✕</button></div>`;
  }).join("");
  const avail=S.trainers.filter(tr=>!quick.recips.includes(tr.id))
    .map(tr=>({tr,fit:scoreTrainer(tr,tg)})).sort((a,b)=>b.fit-a.fit);
  $("#sheetTitle").textContent=t("quickTitle");
  $("#sheetBody").innerHTML=`
    <div class="meta" style="margin-bottom:12px">${t("quickDesc")}</div>
    <label class="fld">${t("trainingLbl")}</label>
    <select id="qTg" onchange="quickPickTraining(this.value)">${S.trainings.map(x=>`<option value="${x.id}" ${x.id===quick.tgId?'selected':''}>${esc(x.topic)} - ${esc(x.city)} (${esc(x.kw)})</option>`).join("")}</select>
    <label class="fld">${t("replCand")} (${quick.recips.length})</label>
    <div id="quickRows">${rows||`<div class="meta">${t("quickEmpty")}</div>`}</div>
    <label class="fld">${t("quickAdd")}</label>
    <select id="quickAddSel" onchange="quickAdd(this.value);this.value='';">
      <option value="">${t("quickAddPh")}</option>
      ${avail.map(x=>`<option value="${x.tr.id}">${esc(x.tr.name)} · ${esc(x.tr.region)} · ${x.fit}%</option>`).join("")}
    </select>`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("cancel")}</button><div class="spacer"></div>
    <button class="btn amber" onclick="sendQuick()" ${quick.recips.length?"":"disabled style=\"opacity:.5;cursor:not-allowed\""}>${t("sendBlitz")}</button>`;
}
async function sendQuick(){
  const tgId=quick.tgId; const tg=S.trainings.find(t=>t.id===tgId);
  const recips=quick.recips.slice();
  if(!recips.length){ toast(t("quickEmpty"),"warn"); return; }
  if(LIVE){
    const lang=S.emailLang||"en"; const tpl=S.templates.find(t=>t.id==="t3")||S.templates[0];
    closeSheet();
    try{
      const d=await apiCall("request.create",{training:tgId,recipients:recips,lang,
        subject:tpl[lang].subject, body:tpl[lang].body});

/* Kompakte Wochenübersicht für die Agenda: alle Sessions Mo-Fr,
   die des Trainers rot umrandet + mit Kürzel (wie im Wochenplan). */
function agWeekGrid(sessions,plan,tg,trId){
  const sess=id=>sessions.find(s=>String(s.id)===String(id));
  const placed=new Set(); const slots={};
  for(const k of WK_SLOTKEYS){ slots[k]=((plan[k]||[]).map(String)).filter(id=>sess(id)&&!placed.has(id)&&(placed.add(id)||true)); }
  if(!Object.values(slots).some(a=>a.length)) return "";
  const tr=S.trainers.find(x=>String(x.id)===String(trId));
  const dayDate=i=>{ if(!tg.date) return ""; const d=new Date(tg.date+"T00:00:00"); d.setDate(d.getDate()+i);
    return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."; };
  let myN=0, myH=0, myPpt=0;
  const cell=k=>slots[k].map(id=>{ const s=sess(id); const mine=sessTrIds(s).includes(String(trId));
    const others=sessTrIds(s).filter(x=>x!==String(trId))
      .map(tid=>{const x=S.trainers.find(y=>String(y.id)===tid);return x?x.name:null;}).filter(Boolean);
    const pptMine=mine&&s.pptBy&&String(s.pptBy)===String(trId);
    if(mine){ myN++; myH+=Number(s.dur||1); if(pptMine) myPpt++; }
    const sub=`${esc(String(s.dur||1))} h`
      +(mine&&tr?` · <b style="color:var(--crit)">${initials(tr.name)}</b>`:"")
      +(mine&&others.length?`<br><span style="color:var(--good);font-weight:650">👥 ${esc(t("agWith")+" "+others.join(", "))}</span>`
        :(!mine&&others.length?`<br>${esc(others.join(", "))}`:""))
      // Vorbereitung nur an den eigenen Kacheln - sonst wird das Raster unruhig
      +(pptMine?`<br><span style="color:var(--crit);font-weight:650">${t("agPptMine")}</span>`:"")
      +(mine&&s.mat?`<br>📦 ${esc(s.mat)}`:"");
    return `<div style="border:1.5px solid ${mine?'var(--crit)':'var(--line)'};border-left:4px solid ${mine?'var(--crit)':(SESS_COL[s.type]||'#8A939A')};border-radius:7px;padding:5px 7px;margin:0 0 5px;font-size:11px;line-height:1.35;${mine?'background:rgba(216,31,38,.07);font-weight:650':''}">${esc(sessTitle(s))}
      <div style="color:var(--faint);font-size:10px">${sub}</div></div>`;
  }).join("")||`<div style="color:var(--faint);font-size:11px">-</div>`;
  // Kacheln zuerst bauen, damit die Zusammenfassung die gezählten Werte kennt
  const grid=WK_DAYS.map((d,i)=>`<div style="min-width:0">
      <div style="text-align:center;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">${t("day_"+d)}<span style="color:var(--faint);font-weight:600"> ${dayDate(i)}</span></div>
      <div style="font-size:9px;color:var(--faint);text-transform:uppercase;margin:5px 0 3px">${t("wkAM")}</div>${cell(d+"_am")}
      <div style="font-size:9px;color:var(--faint);text-transform:uppercase;margin:5px 0 3px">${t("wkPM")}</div>${cell(d+"_pm")}
    </div>`).join("");
  const hTxt=String(Math.round(myH*10)/10).replace(".",S.lang==="en"?".":",");
  return `<div class="ag-h2">${t("agWeekHead")}</div>
    <div class="ag-mine">${esc(t("agMineSum",myN,hTxt,myPpt))}</div>
    <div class="agwk" style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">${grid}</div>
    <div style="font-size:10.5px;color:var(--faint);margin-top:6px">${t("agWeekLegend")}</div>`;
}

/* ---------- Flug-Vorschläge (automatisch, Route Region→Ziel) ---------- */
const AIRPORTS={"DE-Süd":["MUC","München"],"DE-West":["DUS","Düsseldorf"],"DE-Nord":["HAM","Hamburg"],"AT":["VIE","Wien"],"CH":["ZRH","Zürich"],"UAE":["AUH","Abu Dhabi"],"UK":["LHR","London"]};
const DESTAP={"UAE":["AUH","Abu Dhabi"],"DE":["FRA","Frankfurt"],"AT":["VIE","Wien"],"CH":["ZRH","Zürich"]};
const AIRLINES=["LH","EW","EK","EY","OS","LX","BA"];
function flightSuggestions(tr,tg){
  const o=AIRPORTS[tr.region]||["FRA","Frankfurt"], d=DESTAP[tg.country]||["FRA","Frankfurt"];
  const seed=(tr.name.length*7+tg.topic.length*3);
  const al=AIRLINES[seed%AIRLINES.length], al2=AIRLINES[(seed+3)%AIRLINES.length];
  const n1=100+(seed*7)%800, n2=200+(seed*5)%700;
  return [
    {out:`${al} ${n1} ${o[0]}→${d[0]} 21:55-06:40 (+1)`, ret:`${al} ${n1+1} ${d[0]}→${o[0]} 02:35-07:10`},
    {out:`${al2} ${n2} ${o[0]}→${d[0]} 10:20-19:15`,      ret:`${al2} ${n2+1} ${d[0]}→${o[0]} 08:45-13:20`}
  ];
}
function showFlightSuggestions(tgId,trId){
  const tr=S.trainers.find(x=>x.id===trId), tg=S.trainings.find(x=>x.id===tgId);
  const sug=flightSuggestions(tr,tg); window._flSug=sug;
  $("#flSug").innerHTML=`<div class="meta" style="margin:8px 0 4px">${t("flSuggestHint")}</div>`+

function trainingYear(tg){const m=(tg.month||"").match(/(\d{2})\D*$/); return m?2000+parseInt(m[1],10):2026;}
function trainingKw(tg){return parseInt((tg.kw||"").replace(/\D/g,""))||1;}
function isoWeekMonday(year,week){
  const s=new Date(Date.UTC(year,0,1+(week-1)*7)); const dow=s.getUTCDay();
  if(dow<=4)s.setUTCDate(s.getUTCDate()-dow+1); else s.setUTCDate(s.getUTCDate()+8-dow);
  return s;
}
function trainingDates(tg){
  if(/^\d{4}-\d{2}-\d{2}$/.test(tg.date||"")){
    const start=new Date(tg.date+"T00:00:00Z");
    const e=/^\d{4}-\d{2}-\d{2}$/.test(tg.dateEnd||"")?new Date(tg.dateEnd+"T00:00:00Z"):new Date(start);
    const end=new Date(e); end.setUTCDate(end.getUTCDate()+1); // DTEND exklusiv
    return {start,end};
  }
  const start=isoWeekMonday(trainingYear(tg),trainingKw(tg));
  const end=new Date(start); end.setUTCDate(end.getUTCDate()+2); return {start,end};}
const MONTHS_DE=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTHS_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Zeitraum-Label: echter Datumsbereich wenn vorhanden, sonst KW · Monat */
function whenLabel(tg){
  if(/^\d{4}-\d{2}-\d{2}$/.test(tg.date||"")){
    const M=(S.lang==='de'?MONTHS_DE:MONTHS_EN);
    const s=new Date(tg.date+"T00:00:00Z");
    const e=/^\d{4}-\d{2}-\d{2}$/.test(tg.dateEnd||"")?new Date(tg.dateEnd+"T00:00:00Z"):s;
    const kw=tg.kw?` · ${kwLabel(tg.kw)}`:"";  // KW immer mit anzeigen
    if(s.getUTCMonth()===e.getUTCMonth()&&s.getUTCFullYear()===e.getUTCFullYear())
      return s.getUTCDate()+".-"+e.getUTCDate()+". "+M[e.getUTCMonth()]+" "+e.getUTCFullYear()+kw;
    return s.getUTCDate()+". "+M[s.getUTCMonth()]+" - "+e.getUTCDate()+". "+M[e.getUTCMonth()]+" "+e.getUTCFullYear()+kw;
  }
  return kwLabel(tg.kw)+(tg.month?" · "+tg.month:"");
}
function pad2(n){return String(n).padStart(2,"0");}
function icsDate(d){return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate());}
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsStamp(){try{return new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";}catch(e){return "20260101T000000Z";}}
function sortedForCal(){return curTrainings().slice().sort((a,b)=>trainingDates(a).start-trainingDates(b).start);}
function buildICS(){
  const stamp=icsStamp();
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ETAF//Trainer-Koordination//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:"+icsEsc("ETAF Trainings"+(activeClient()?" · "+activeClient().name:""))];
  sortedForCal().forEach(tg=>{
    const d=trainingDates(tg), cl=clientOf(tg), r=rosterStats(tg), st=statusOf(tg);
    lines.push("BEGIN:VEVENT","UID:"+tg.id+"@etaf-trainer","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+icsDate(d.start),"DTEND;VALUE=DATE:"+icsDate(d.end),
      "SUMMARY:"+icsEsc((cl?cl.short+" · ":"")+tg.topic),
      "LOCATION:"+icsEsc(tg.city+", "+tg.country),
      "CATEGORIES:"+icsEsc(cl?cl.name:"ETAF"));
    if(cl&&cl.cal)lines.push("COLOR:"+cl.cal);
    lines.push("DESCRIPTION:"+icsEsc(tg.spec+" - "+r.yes+"/"+r.need+" "+t("confirmedShort")+" · "+t(st.key)+(cl?" · "+cl.name:"")),"END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function download(name,text,mime){
  try{const b=new Blob([text],{type:mime||"text/plain"});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
    a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){toast("Export: "+e.message,"crit");}
}

  const suffix=activeClient()?("-"+(activeClient().short||"kunde").toLowerCase()):"-alle";
  download("etaf-trainings"+suffix+".ics",buildICS(),"text/calendar;charset=utf-8");

}

/* Kompakte Tagesliste einer Woche für den Ausdruck. */
function calWeekDetail(tg){
  const wd=calWeeks&&calWeeks[String(tg.id)];
  if(!wd||!(wd.sessions||[]).length) return "";
  const sess=id=>(wd.sessions||[]).find(s=>String(s.id)===String(id));
  const plan=wd.plan||{}; const placed=new Set();
  const slots={};
  for(const k of WK_SLOTKEYS) slots[k]=((plan[k]||[]).map(String)).filter(id=>sess(id)&&!placed.has(id)&&(placed.add(id)||true));
  const sTitle=s=>esc((S.lang==="en"&&s.titleEn)?s.titleEn:s.title);
  const sTr=s=>(s.trainerIds||[]).map(tid=>{const x=S.trainers.find(y=>String(y.id)===String(tid));return x?x.name.replace(/^Dr\.\s*/,""):null;}).filter(Boolean);
  const line=s=>{
    const trs=sTr(s);
    return `<div class="cal-s"><span class="cal-sd" style="background:${SESS_COL[s.type]||'#8A939A'}"></span>`
      +sTitle(s)
      +`<i> · ${esc(String(s.dur||1))} h${trs.length?" · "+esc(trs.join(", ")):""}</i></div>`;
  };
  // Ohne Tageszuordnung reicht der Titel - als Fließzeile statt einer Zeile je Session,
  // sonst wächst der Wandkalender im Ausdruck auf ein Vielfaches an.
  const inl=s=>{ const trs=sTr(s); return sTitle(s)+(trs.length?` <i>(${esc(trs.join(", "))})</i>`:""); };
  const del0=(S.lang==="en"&&tg.deliverableEn)?tg.deliverableEn:(tg.deliverable||"");
  // Woche noch nicht auf Tage verteilt → Inhalte trotzdem auflisten
  if(!Object.values(slots).some(a=>a.length)){
    return `<div class="cal-det">${del0?`<div class="cal-del"><b>${t("wkDeliverable")}:</b> ${esc(del0)}</div>`:""}
      <div class="cal-day full"><div class="cal-dn">${t("calNotPlanned")} (${(wd.sessions||[]).length})</div><div class="cal-inl">${(wd.sessions||[]).map(inl).join(" · ")}</div></div></div>`;
  }
  const dayLbl=["mon","tue","wed","thu","fri"];
  const rows=dayLbl.map((d,i)=>{
    const halves=["am","pm"].map(h=>{
      const items=slots[d+"_"+h].map(id=>line(sess(id))).join("");
      return items?`<div class="cal-h"><b>${t(h==="am"?"wkAM":"wkPM")}</b>${items}</div>`:"";
    }).join("");
    if(!halves) return "";
    let dt="";
    if(tg.date){ const dd=new Date(tg.date+"T00:00:00"); dd.setDate(dd.getDate()+i);
      dt=" "+String(dd.getDate()).padStart(2,"0")+"."+String(dd.getMonth()+1).padStart(2,"0")+"."; }
    return `<div class="cal-day"><div class="cal-dn">${t("day_"+d).slice(0,2)}${dt}</div><div>${halves}</div></div>`;
  }).join("");
  // Nicht verplante Sessions am Ende ergänzen (Auswechselbank)
  const restIds=(wd.sessions||[]).map(s=>String(s.id)).filter(id=>!placed.has(id));
  const rest=restIds.length
    ? `<div class="cal-day full"><div class="cal-dn">${t("wkBench")}</div><div class="cal-inl">${restIds.map(id=>inl(sess(id))).join(" · ")}</div></div>` : "";
  return `<div class="cal-det">${del0?`<div class="cal-del"><b>${t("wkDeliverable")}:</b> ${esc(del0)}</div>`:""}${rows}${rest}</div>`;
}
function openCalendar(){

  const db=$("#calDetailBtn"); if(db) db.textContent=calDetail?t("calDetailOff"):t("calDetailOn");
  const legend=(S.clients||[]).map(c=>`<span class="cal-lg"><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join("");

    <div class="cal-legend">${legend}</div>${body}
    <div class="meta" style="text-align:center;margin-top:22px">ETAF · Trainer-Koordination</div></div>`;
  setPageOrient("landscape"); $("#agPrintLbl2")&&($("#agPrintLbl2").textContent=t("calPrint"));
  // Titel mit Kunde und Zeitraum - so ist die PDF schon am Dateinamen erkennbar
  const first=list[0], last=list[list.length-1];
  const span=(first&&last)?`${(first.date||"").slice(0,7).split("-").reverse().join(".")}-${(last.dateEnd||last.date||"").slice(0,7).split("-").reverse().join(".")}`:"";
  setSheetTitle(`ETAF ${t("calTitle")} ${activeClient()?activeClient().name:t("clientAll")}${span?" ("+span+")":""}${calDetail?" - "+t("calDetailOn"):""}`);
  $("#calPrint").classList.add("on");
}

    else {
      const prefill=(S.matPresets&&S.matPresets[data.spec])?JSON.parse(JSON.stringify(S.matPresets[data.spec])):[];
      prefilled=prefill.length;
      const tg=Object.assign({id:uid("tg")},data,{travel:{venue:"",hotel:"",hotelAddr:"",meetingPoint:"",contactName:"",contactPhone:"",dresscode:"",perDiem:"",notes:"",agenda:[]},materials:prefill,roster:[]});
      S.trainings.push(tg); newId=tg.id;
    }
    save();
  }
  closeSheet();toast(t("trainingSaved"),"good");
  if(prefilled)setTimeout(()=>toast(t("matPrefilled",prefilled),"good"),400);
  if(newId){ curTg=S.trainings.find(x=>x.id===newId); route="detail"; render(); }
  else go("trainings");
  buildNav();
  // Termin verschoben? → Trainer informieren / neu anfragen anbieten
  const shifted = edTraining && ((oldStart||"")!==(data.date||"") || (oldKw||"")!==(data.kw||"") || (oldEnd||"")!==(data.dateEnd||""));
  if(shifted && newId){
    const tg=S.trainings.find(x=>x.id===newId);
    const affected=(tg&&tg.roster||[]).filter(r=>["yes","confirmed","maybe","asked"].includes(r.status));
    if(affected.length){
      const oldTxt=(oldStart?fmtDateRange(oldStart,oldEnd):oldKw)||"-";
      setTimeout(()=>promptShiftNotify(newId, oldTxt, affected.length), 500);
    }
  }
}

function demoExtract(text){
  const SP=["Implantologie","DNA-Diagnostik","Fingerprint Dental","Prothetik","Guided Surgery","Parodontologie","Chirurgie"];
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).slice(0,8).map(line=>{
    const name=(line.match(/Dr\.?\s+[A-Za-zÄÖÜäöü'\-]+\s+[A-Za-zÄÖÜäöü'\-]+/)||[line.split(/[,--]/)[0].trim()])[0];
    const spec=SP.filter(s=>line.toLowerCase().includes(s.toLowerCase().slice(0,6)));
    const langs=(line.match(/\b(DE|EN|AR)\b/g)||[]).filter((v,i,a)=>a.indexOf(v)===i);
    const uae=/uae|abu dhabi|dubai/i.test(line);
    const reg=(line.match(/DE-(Süd|West|Nord)|AT|CH|UAE|UK/)||[uae?"UAE":"DE-West"])[0];
    const rate=(line.match(/([45]\.\d)/)||["4.5"])[0];
    return {name:name.trim(),email:"",phone:"",spec:spec.length?spec:[SP[0]],region:reg,langs:langs.length?langs:["DE","EN"],uae,rating:rate};
  });
}

      toast(t("autoRan",d.reminded,d.advanced),"good");

    return;
  }
  const s=S.settings||{}; let reminded=0,advanced=0;
  S.trainings.forEach(tg=>{
    tg.roster.forEach(r=>{ if(r.status==="asked" && !r.reminded){ r.reminded=true; reminded++;
      const trx=S.trainers.find(x=>x.id===r.trainerId); if(trx)demoLog(trx.email,(S.lang==='de'?'Erinnerung: ':'Reminder: ')+tg.topic,S.emailLang,"logged"); } });
    if(s.auto_advance){
      const active=tg.roster.filter(r=>["asked","maybe","yes","confirmed"].includes(r.status)).length;
      const gaps=tg.roster.filter(r=>r.status==="no").length;
      const toAdd=Math.min(gaps,Math.max(0,tg.need-active));
      const next=ranked(tg).filter(x=>!x.status);
      for(let i=0;i<toAdd && i<next.length;i++){ tg.roster.push({trainerId:next[i].tr.id,status:"asked"}); advanced++; }
    }
  });
  save();buildNav();renderAutomation();if(route==="dash")renderDash();
  toast(t("autoRan",reminded,advanced),"good");
}
