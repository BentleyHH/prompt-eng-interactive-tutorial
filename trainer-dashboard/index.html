/* Zweisprachiges Label aus einem Katalog-Tripel [key, de, en]. */
function dbL(tri){ return S.lang==="en" ? tri[2] : tri[1]; }
function dbGroupLabel(g){ return S.lang==="en" ? g.en : g.de; }
function dbLabelOf(key){
  for(const g of DB_GROUPS) for(const it of g.items) if(it[0]===key) return dbL(it);
  for(const it of DB_TRK) if(it[0]===key) return dbL(it);
  for(const it of DB_FLAGS) if(it[0]===key) return dbL(it);
  return key;
}
function dbGroupOf(key){
  for(const g of DB_GROUPS) for(const it of g.items) if(it[0]===key) return g;
  return null;
}
function dbAllKeys(){ return DB_GROUPS.flatMap(g=>g.items.map(i=>i[0])); }

/* Ampelband eines Mittelwerts - dieselbe Sprache wie überall im Cockpit. */
function dbBand(v){ return v==null?"":(v>=4?"good":(v>=3?"warn":"crit")); }
function dbNum(v){ return v==null?"-":Number(v).toFixed(1).replace(".",S.lang==="en"?".":","); }

/* ---------- Formular ---------- */
let dbCur=null, dbTg=null;

function dbEmpty(tgId){
  return {training:String(tgId),status:"draft",overall:0,recommend:"",
          scores:{},trainers:{},flags:[],texts:{},actions:[],version:0};
}
/* Wer war im Einsatz? Bestätigte Besetzung plus alle, die im Wochenplan stehen. */
function dbTrainersOf(tg){
  const ids=new Set((tg.roster||[]).filter(r=>["yes","confirmed"].includes(r.status)).map(r=>String(r.trainerId)));
  const wd=(S.weekData||{})[tg.id];
  if(wd) (wd.sessions||[]).forEach(s=>(s.trainerIds||[]).forEach(x=>ids.add(String(x))));
  (dbCur&&dbCur.trainers?Object.keys(dbCur.trainers):[]).forEach(x=>ids.add(String(x)));
  return [...ids].map(id=>S.trainers.find(x=>String(x.id)===id)).filter(Boolean);
}

async function openDebrief(tgId){
  const tg=S.trainings.find(x=>String(x.id)===String(tgId)); if(!tg) return;
  dbTg=tg; dbCur=dbEmpty(tgId);
  if(LIVE){
    try{ const d=await apiCall("debrief.get",{training:tgId}); if(d.debrief) dbCur=d.debrief; }
    catch(e){ toast(e.message,"crit"); return; }
  } else {
    const st=(S.debriefs||{})[String(tgId)]; if(st) dbCur=JSON.parse(JSON.stringify(st));
  }
  drawDebrief(); openSheet();
}

function dbScale(kind,key,val){
  const cur=val==null?null:Number(val);
  const btn=v=>`<button class="s${v}${cur===v?" on":""}" data-v="${v}" title="${esc(dbL(DB_SCALE[v-1]))}"
      onclick="dbPick('${kind}','${key}',${v})">${v}</button>`;
  return `<span class="scale" id="sc-${esc(kind)}-${esc(key)}">${[1,2,3,4,5].map(btn).join("")}
    <button class="na${cur==null?" on":""}" data-v="0" title="${esc(t("dbNaHint"))}"
      onclick="dbPick('${kind}','${key}',0)">${esc(t("dbNa"))}</button></span>`;
}
/* Klick auf die Skala: nur die betroffene Zeile umschalten - sonst verlöre
   ein offenes Textfeld beim Neuzeichnen den Fokus. */
function dbPick(kind,key,v){
  if(kind==="sc"){ if(v) dbCur.scores[key]=v; else delete dbCur.scores[key]; }
  else if(kind==="ov"){ dbCur.overall=v; }
  else { const [,tid,fld]=kind.split(":");
    dbCur.trainers[tid]=dbCur.trainers[tid]||{};
    if(v) dbCur.trainers[tid][fld]=v; else delete dbCur.trainers[tid][fld]; }
  const box=document.getElementById("sc-"+kind+"-"+key);
  if(box) box.querySelectorAll("button").forEach(b=>b.classList.toggle("on",Number(b.dataset.v)===v));
  dbCount();
}
function dbFlagToggle(k,el){
  const i=dbCur.flags.indexOf(k);
  if(i<0) dbCur.flags.push(k); else dbCur.flags.splice(i,1);
  el.classList.toggle("on",i<0);
}
function dbRec(v){ dbCur.recommend=v;
  $$("#dbRec button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); }
function dbText(k,el){ dbCur.texts[k]=el.value; }
function dbCount(){
  const el=$("#dbCount"); if(!el||!dbTg) return;
  const tot=dbTotalOf(dbTg), fil=dbFilledOfObj(dbCur);

async function saveDebrief(status){
  if(status==="final" && !Object.keys(dbCur.scores).length && !dbCur.overall){
    toast(t("dbNeedSome"),"warn"); return;
  }
  const payload={...dbCur,status,training:dbCur.training};
  payload.actions=(dbCur.actions||[]).filter(a=>(a.text||"").trim());
  if(LIVE){
    const ok=await saveGuarded("debrief.save",payload,d=>{
      dbCur=d.debrief;
      const tg=S.trainings.find(x=>String(x.id)===String(dbCur.training));
      if(tg) tg.debrief={status:dbCur.status,overall:dbCur.overall,at:dbCur.updatedAt,
                         filled:(typeof dbCur.filled==="number"?dbCur.filled:dbFilledOfObj(dbCur))};
    });
    if(!ok) return;
  } else {
    S.debriefs=S.debriefs||{};
    payload.version=(payload.version||0)+1;
    payload.updatedAt=new Date().toISOString().slice(0,19).replace("T"," ");
    S.debriefs[String(dbCur.training)]=JSON.parse(JSON.stringify(payload));
    dbCur=S.debriefs[String(dbCur.training)];
    const tg=S.trainings.find(x=>String(x.id)===String(dbCur.training));
    if(tg) tg.debrief={status:dbCur.status,overall:dbCur.overall,at:dbCur.updatedAt};
    save();
  }
  toast(status==="final"?t("dbFinished"):t("dbSaved"),"good");
  closeSheet(); render();
}
async function deleteDebrief(){
  if(!confirm(t("dbDeleteAsk"))) return;
  const id=dbCur.training;
  if(LIVE){ try{ await apiCall("debrief.delete",{training:id}); }catch(e){ toast(e.message,"crit"); return; } }
  else { if(S.debriefs) delete S.debriefs[String(id)]; save(); }
  const tg=S.trainings.find(x=>String(x.id)===String(id)); if(tg) tg.debrief=null;
  closeSheet(); render(); toast(t("dbDelete"),"good");
}

/* ---------- Ausfüllstand ----------
   Nenner: 22 Kriterien + Gesamteindruck + Empfehlung + 4 Werte je eingesetztem
   Trainer. So bleibt die Prozentzahl über alle Trainings vergleichbar und
   wächst nur, wenn wirklich mehr zu bewerten ist. */
function dbTeamOf(tg){
  const ids=new Set((tg.roster||[]).filter(r=>["yes","confirmed"].includes(r.status)).map(r=>String(r.trainerId)));
  const wd=(S.weekData||{})[tg.id];
  if(wd) (wd.sessions||[]).forEach(s=>(s.trainerIds||[]).forEach(x=>ids.add(String(x))));
  return [...ids].filter(id=>S.trainers.some(x=>String(x.id)===id));
}
function dbTotalOf(tg){ return dbAllKeys().length + 2 + 4*dbTeamOf(tg).length; }
/* Beantwortete Felder - live kommt der Wert aus dem Backend, im Demo-Modus
   wird er aus dem lokal gespeicherten Bericht gezählt. */
function dbFilledOf(tg){
  if(tg.debrief && typeof tg.debrief.filled==="number") return tg.debrief.filled;
  const d=(S.debriefs||{})[String(tg.id)];
  if(!d) return 0;
  return dbFilledOfObj(d);
}
function dbFilledOfObj(d){
  let n=Object.keys(d.scores||{}).filter(k=>dbAllKeys().includes(k)).length;
  if(d.overall>=1) n++;
  if(d.recommend) n++;
  Object.values(d.trainers||{}).forEach(tv=>DB_TRK.forEach(([k])=>{ if(tv&&tv[k]>=1) n++; }));
  return n;
}
function dbPctOf(tg){
  const tot=dbTotalOf(tg); if(!tot) return 0;
  return Math.min(100, Math.round(dbFilledOf(tg)/tot*100));
}
/* Ring: ein Kreis, ein Wert - die Zahl steht immer daneben, damit der
   Fortschritt nicht allein an der Farbe hängt. */
function dbRing(pct,size,done,hue){
  const S0=size||34, r=S0/2-3, c=2*Math.PI*r;
  const shown=done?100:Math.max(0,Math.min(100,pct));
  const off=c*(1-shown/100);
  const col=hue ? (shown>0?hue:"var(--line)")
                : (done||shown>=100?"var(--good)":shown>0?"var(--info)":"var(--line)");
  return `<svg class="dbring" viewBox="0 0 ${S0} ${S0}" width="${S0}" height="${S0}" aria-hidden="true">
    <circle cx="${S0/2}" cy="${S0/2}" r="${r}" fill="none" stroke="var(--brand-050)" stroke-width="3"/>
    ${shown>0?`<circle cx="${S0/2}" cy="${S0/2}" r="${r}" fill="none" stroke="${col}" stroke-width="3"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${S0/2} ${S0/2})"/>`:""}
    ${done?`<path d="M${(S0*0.33).toFixed(1)} ${(S0*0.51).toFixed(1)} l${(S0*0.11).toFixed(1)} ${(S0*0.12).toFixed(1)} l${(S0*0.23).toFixed(1)} -${(S0*0.26).toFixed(1)}" fill="none"
      stroke="var(--good)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:""}
  </svg>`;
}

/* ---------- Planungsstand eines Trainings ----------
   Fünf Bausteine, die man auch nachrechnen kann - der Tooltip zeigt sie
   einzeln. Bausteine ohne Grundlage (kein Wochenplan, niemand zugesagt)
   fallen aus der Rechnung, sonst wäre 100 % nie erreichbar. */
function tgWeekAgg(tg){
  if(tg.week) return tg.week;
  const wd=(S.weekData||{})[tg.id];
  if(!wd) return null;
  const ses=wd.sessions||[], plan=wd.plan||{};
  const seen=new Set();
  WK_SLOTKEYS.forEach(k=>(plan[k]||[]).forEach(id=>seen.add(String(id))));
  const rel=ses.filter(x=>!["orga","deliverable"].includes(x.type));
  return {sessions:ses.length, placed:seen.size,
          pptAll:rel.length, pptDone:ses.filter(x=>x.ppt==="vorhanden").length};
}
function tgReady(tg){
  const parts=[]; const r=rosterStats(tg);
  if(tg.need>0) parts.push({key:"rdStaff",have:Math.min(r.yes,tg.need),need:tg.need,w:2});
  const wk=tgWeekAgg(tg);
  if(wk&&wk.sessions>0) parts.push({key:"rdPlan",have:wk.placed||0,need:wk.sessions,w:1});
  if(wk&&wk.pptAll>0)   parts.push({key:"rdPpt", have:Math.min(wk.pptDone||0,wk.pptAll),need:wk.pptAll,w:1});
  const conf=(tg.roster||[]).filter(x=>["yes","confirmed"].includes(x.status));
  if(conf.length) parts.push({key:"rdTravel",
    have:conf.filter(x=>x.flight&&((x.flight.flightOut||"")||(x.flight.arrival||""))).length,need:conf.length,w:1});
  parts.push({key:"rdMat",have:(tg.materials||[]).filter(l=>l.matId).length?1:0,need:1,w:1});
  const wSum=parts.reduce((a,p)=>a+p.w,0)||1;
  const pct=Math.round(parts.reduce((a,p)=>a+p.w*Math.min(1,p.have/(p.need||1)),0)/wSum*100);
  return {pct,parts};
}
/* Beschriftetes Ringpaar: „Plan" (Vorbereitung) und „Bericht" (Nachbereitung).
   Ohne Beschriftung ist eine nackte Zahl neben einem Training mehrdeutig. */
function rdPair(tg){
  const rd=tgReady(tg);
  const tip=t("rdTitle")+"\n"+rd.parts.map(p=>"· "+t(p.key)+": "+p.have+"/"+p.need).join("\n");
  const cell=(pct,cap,tip2,hue,done,click)=>`<span class="rdcell" title="${esc(tip2)}"${
      click?` onclick="event.stopPropagation();${click}" style="cursor:pointer"`:""}>
    <span class="dbringwrap sm">${dbRing(pct,36,done,hue)}
      <b class="${done?"g":pct?"i":"f"}${pct>=100?" full":""}">${pct}<i>%</i></b></span>
    <span class="rdcap">${esc(cap)}</span></span>`;
  const showDb = tgIsPast(tg) || tg.debrief;
  const dbDone = tg.debrief && tg.debrief.status==="final";
  return `<span class="rdpair">
    ${cell(rd.pct,t("rdPlanCap"),tip,"var(--brand-solid)",false,"")}
    ${showDb?cell(dbPctOf(tg),t("rdRepCap"),
        t("dbFilled",dbFilledOf(tg),dbTotalOf(tg)),"",dbDone,`openDebrief('${tg.id}')`):""}
  </span>`;
}

/* Statusabzeichen für Listen und Detailkopf. */
function dbBadge(tg){
  const d=tg.debrief;
  if(d&&d.status==="final") return `<span class="dbbadge ok">${ic("star",11)}${esc(t("dbDone"))}${d.overall?" "+dbNum(d.overall):""}</span>`;
  if(d) return `<span class="dbbadge dr">${esc(t("dbDraft"))}</span>`;
  return "";
}
/* Ist das Training vorbei? Erst dann ist ein fehlender Bericht ein Hinweis. */
function tgIsPast(tg){
  const d=tg.dateEnd||tg.date; if(!d) return false;
  return new Date(d+"T23:59:59") < new Date();
}


/* ============================================================
   AUSWERTUNG - Woche / Monat / Jahr / Gesamt
   Diagramme sind bewusst reines HTML+SVG: keine Fremdbibliothek, damit
   auch der Ausdruck und der Offline-Betrieb sicher funktionieren.
   ============================================================ */
/* Einstieg bewusst auf „Gesamt": ein Programm läuft über Jahre, und ein
   voreingestelltes Fenster würde beim ersten Öffnen eine leere Seite zeigen. */
let rpState={period:"all",from:"",to:"",bucket:"month",client:"",drafts:false,data:null,loading:false};

/* Zeitraum-Schnellwahl in konkrete Daten übersetzen. */
function rpRange(){
  const now=new Date(); const iso=d=>d.toISOString().slice(0,10);
  if(rpState.period==="all") return {from:"",to:""};
  if(rpState.period==="custom") return {from:rpState.from,to:rpState.to};
  const to=new Date(now);
  const from=new Date(now);
  if(rpState.period==="week")  from.setDate(from.getDate()-7);
  if(rpState.period==="month") from.setMonth(from.getMonth()-1);
  if(rpState.period==="quarter") from.setMonth(from.getMonth()-3);
  if(rpState.period==="year")  from.setFullYear(from.getFullYear()-1);
  return {from:iso(from),to:iso(to)};
}
function rpSetPeriod(p){ rpState.period=p; rpState.data=null;
  rpState.bucket = p==="week"?"week" : (p==="month"||p==="quarter")?"week" : "month";
  renderReports(); }
function rpSetBucket(b){ rpState.bucket=b; rpState.data=null; renderReports(); }
/* Zwischenstand ein/aus: Entwürfe zählen mit. Alles, was danach gezeigt
   oder gedruckt wird, trägt den Vermerk „vorläufig". */
function rpSetDrafts(v){ const on=(v==="on"); if(rpState.drafts===on) return;
  rpState.drafts=on; rpState.data=null; renderReports(); }
function rpSetDate(which,v){ rpState[which]=v; rpState.period="custom"; rpState.data=null; renderReports(); }

/* Auswertung im Demo-Modus: dieselbe Rechnung wie im Backend, nur lokal. */
function rpLocal(from,to,client,bucket,withDrafts){
  const all=Object.values(S.debriefs||{})
    .filter(d=>d.status==="final"||(withDrafts&&d.status==="draft"));
  const tgOf=d=>S.trainings.find(x=>String(x.id)===String(d.training));
  const rows=all.map(d=>({d,tg:tgOf(d)})).filter(x=>x.tg)
    .filter(({tg})=>{
      const end=tg.dateEnd||tg.date||"";
      if(from && end && end<from) return false;
      if(to && tg.date && tg.date>to) return false;
      if(client && tg.clientId!==client) return false;
      return true; })
    .sort((a,b)=>String(a.tg.date||"").localeCompare(String(b.tg.date||"")));
  const avg=a=>{const v=a.filter(x=>x>=1&&x<=5); return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length*100)/100:null;};
  const per=dt=>{ if(!dt) return "";
    const d=new Date(dt+"T00:00:00");
    if(bucket==="year") return String(d.getFullYear());
    if(bucket==="month") return dt.slice(0,7);
    const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day);
    const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
    return x.getUTCFullYear()+"-W"+String(Math.ceil(((x-y0)/86400000+1)/7)).padStart(2,"0"); };

  const byKey={}, byGroup={}, overall=[], rec={yes:0,partly:0,no:0}, flags={}, trs={}, trend={}, items=[];
  rows.forEach(({d,tg})=>{
    const p=per(tg.date), vals=[];
    Object.entries(d.scores||{}).forEach(([k,v])=>{
      if(!(v>=1&&v<=5)) return;
      (byKey[k]=byKey[k]||[]).push(v); vals.push(v);
      const g=dbGroupOf(k); if(g){ (byGroup[g.key]=byGroup[g.key]||[]).push(v);
        if(p){ trend[p]=trend[p]||{o:[],g:{},n:0}; (trend[p].g[g.key]=trend[p].g[g.key]||[]).push(v); } }
    });
    if(d.overall>=1) overall.push(d.overall);
    if(p){ trend[p]=trend[p]||{o:[],g:{},n:0}; trend[p].o.push(d.overall>=1?d.overall:(avg(vals)||0)); trend[p].n++; }
    if(rec[d.recommend]!==undefined) rec[d.recommend]++;
    (d.flags||[]).forEach(f=>flags[f]=(flags[f]||0)+1);
    Object.entries(d.trainers||{}).forEach(([tid,tv])=>{
      DB_TRK.forEach(([k])=>{ const x=tv[k];
        if(x>=1&&x<=5){ trs[tid]=trs[tid]||{all:[]}; (trs[tid][k]=trs[tid][k]||[]).push(x); trs[tid].all.push(x); } });
    });
    items.push({id:d.training,training:String(tg.id),code:tg.code||"",topic:tg.topic||"",city:tg.city||"",
      date:tg.date||"",overall:d.overall||avg(vals)||0,recommend:d.recommend||"",flags:(d.flags||[]).length,
      status:d.status||"final",filled:dbFilledOfObj(d)});
  });

  const past=S.trainings.filter(tg=>{
    const end=tg.dateEnd||tg.date||""; if(!end) return false;
    if(end>new Date().toISOString().slice(0,10)) return false;
    if(from && end<from) return false;
    if(to && tg.date>to) return false;
    if(client && tg.clientId!==client) return false;
    return true; });
  const actions=[];
  rows.forEach(({d,tg})=>(d.actions||[]).filter(a=>!a.done&&(a.text||"").trim())
    .forEach((a,i)=>actions.push({id:tg.id+"-"+i,text:a.text,owner:a.owner||"",due:a.due||"",
      code:tg.code||"",training:String(tg.id)})));

  return {
    n:rows.length, nDraft:rows.filter(x=>x.d.status==="draft").length, withDrafts:!!withDrafts,
    due:past.length,
    dueDone:past.filter(tg=>(S.debriefs||{})[String(tg.id)]?.status==="final").length,
    overall:avg(overall) ?? avg(items.map(i=>i.overall)),
    recommend:rec,
    criteria:dbAllKeys().filter(k=>byKey[k]).map(k=>({key:k,group:dbGroupOf(k).key,avg:avg(byKey[k]),n:byKey[k].length})),
    groups:Object.entries(byGroup).map(([k,v])=>({key:k,avg:avg(v),n:v.length})),
    trend:Object.keys(trend).sort().map(p=>({period:p,n:trend[p].n,avg:avg(trend[p].o),
      groups:Object.fromEntries(Object.entries(trend[p].g).map(([g,v])=>[g,avg(v)]))})),
    trainers:Object.entries(trs).map(([id,v])=>{
      const tr=S.trainers.find(x=>String(x.id)===String(id));
      const e={id,name:tr?tr.name:"#"+id,avg:avg(v.all),n:v.all.length};
      DB_TRK.forEach(([k])=>e[k]=avg(v[k]||[])); return e;
    }).sort((a,b)=>(b.avg||0)-(a.avg||0)),
    flags:Object.entries(flags).sort((a,b)=>b[1]-a[1]).map(([k,n])=>({key:k,n})),
    actions, items,
  };
}

async function rpLoad(){
  const {from,to}=rpRange();
  if(LIVE){
    const d=await apiCall("report.build",{from,to,client:S.clientFilter||"",
      bucket:rpState.bucket,drafts:rpState.drafts?1:0});
    return d.report;
  }
  return rpLocal(from,to,S.clientFilter||"",rpState.bucket,rpState.drafts);
}

/* ---------- Diagramm-Bausteine ---------- */
/* Waagerechte Balken 1-5 mit Ampelband, Wert immer als Zahl daneben
   (Farbe allein trägt nie die Aussage). */
function chBars(rows,opts){
  const o=opts||{}, max=o.max||5;
  if(!rows.length) return `<div class="meta">${esc(o.empty||"-")}</div>`;
  return `<div class="rpbars">${rows.map(r=>{
    const v=r.value==null?0:r.value;
    const band=o.plain?"":dbBand(r.value);
    const col=o.plain?"var(--info)":(band==="good"?"var(--good)":band==="warn"?"var(--warn)":"var(--crit)");
    const pct=Math.max(2,Math.min(100, v/max*100));
    return `<div class="rprow"${r.title?` title="${esc(r.title)}"`:""}>
      <span class="rplbl">${esc(r.label)}</span>
      <span class="rpbar"><i style="width:${pct.toFixed(1)}%;background:${col}"></i></span>
      <span class="rpval">${o.plain?String(v):dbNum(r.value)}</span>
      <span class="rpn">${r.n!=null?"n="+r.n:""}</span>
    </div>`;}).join("")}</div>`;
}
/* Liniendiagramm 1-5 über die Perioden. Eine Reihe → keine Legende nötig,
   der Titel sagt, was gezeigt wird. Endwert wird direkt beschriftet. */
function chLine(points,opts){
  const o=opts||{}, W=520, H=o.h||170, PL=26, PR=40, PT=10, PB=24;
  const pts=points.filter(p=>p.v!=null);
  if(pts.length<1) return `<div class="meta">${esc(o.empty||"-")}</div>`;
  const n=pts.length;
  const x=i=> n===1 ? PL+(W-PL-PR)/2 : PL+i*(W-PL-PR)/(n-1);
  const y=v=> PT+(5-v)/4*(H-PT-PB);
  const grid=[1,2,3,4,5].map(v=>`<line class="grid" x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}"/>
    <text class="axis" x="${PL-7}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const d=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area=`M${x(0).toFixed(1)},${y(1).toFixed(1)} `+pts.map((p,i)=>`L${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")
    +` L${x(n-1).toFixed(1)},${y(1).toFixed(1)} Z`;
  const step=Math.ceil(n/8);
  const labels=pts.map((p,i)=> (i%step===0||i===n-1)
    ? `<text class="axis" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>` : "").join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5"
      fill="var(--info)" stroke="var(--panel)" stroke-width="2"><title>${esc(p.label)}: ${dbNum(p.v)}</title></circle>`).join("");
  const last=pts[n-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"")}">
    ${grid}
    <path d="${area}" fill="var(--info)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--info)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
    <text class="val" x="${W-PR+7}" y="${(y(last.v)+4).toFixed(1)}" font-size="12">${dbNum(last.v)}</text>
  </svg>`;
}
/* Kleine Vielfache: je Bereich eine eigene Mini-Linie, gleiche Skala. */
function chSpark(vals,w,h){
  const pts=vals.filter(v=>v!=null);
  if(pts.length<2) return "";
  const W=w||150,H=h||34;
  const x=i=>i*(W-2)/(pts.length-1)+1, y=v=>H-2-((v-1)/4)*(H-4);
  const d=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--info)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1]).toFixed(1)}" r="3.5"
      fill="var(--info)" stroke="var(--panel)" stroke-width="2"/></svg>`;
}
/* Periodenschlüssel lesbar machen: 2026-W45 → KW 45 · 2026-11 → Nov 26 */
function rpPerLabel(p){
  if(/^\d{4}-W\d{2}$/.test(p)) return (S.lang==="en"?"W":"KW ")+p.slice(6);
  if(/^\d{4}-\d{2}$/.test(p)){ const m=(S.lang==="de"?MONTHS_DE:MONTHS_EN)[Number(p.slice(5,7))-1]||p;
    return m.slice(0,3)+" "+p.slice(2,4); }
  return p;
}

          <th style="text-align:right">n</th></tr>${trRows}</table>`:`<div class="meta">-</div>`}</div></div>

   nur abgeschlossene Berichte gezählt werden) */
function rpDraftCount(){
  return S.trainings.filter(tg=>tg.debrief&&tg.debrief.status==="draft"
    &&(!S.clientFilter||tg.clientId===S.clientFilter)).length;
}

/* ---------- Datengrundlage: woran hakt es noch? ----------
   Zwei Fragen, die vor jeder Interpretation stehen: Auf wie vielen
   Bewertungen steht ein Kriterium - und welche Berichte haben Lücken. */
function rpBasisPanel(R){
  const n=R.n||0;
  // Kriterien, die deutlich weniger Bewertungen haben als es Berichte gibt
  const thin=(R.criteria||[]).filter(c=>c.n<n).sort((a,b)=>a.n-b.n).slice(0,8);
  const never=dbAllKeys().filter(k=>!(R.criteria||[]).some(c=>c.key===k));
  const gaps=(R.items||[]).filter(i=>i.status==="draft"||(i.filled!=null&&i.filled<dbTotalOfId(i.training)))
    .sort((a,b)=>(a.filled||0)-(b.filled||0)).slice(0,10);
  if(!thin.length && !never.length && !gaps.length) return "";
  return `<div class="panel"><div class="panel-h"><h3>${esc(t("rpBasisHead"))}</h3>
      <span class="meta">${esc(t("rpBasisSub"))}</span></div>
    <div class="panel-b"><div class="rpgrid2">
      <div>
        <div class="fld" style="margin-top:0">${esc(t("rpThin"))}</div>
        ${thin.length||never.length ? `<div class="rpbars">
          ${thin.map(c=>`<div class="rprow">
            <span class="rplbl">${esc(dbLabelOf(c.key))}</span>
            <span class="rpbar"><i style="width:${Math.max(3,c.n/Math.max(1,n)*100).toFixed(1)}%;background:var(--info)"></i></span>
            <span class="rpval">${c.n}<span class="rpn">/${n}</span></span><span class="rpn"></span></div>`).join("")}
          ${never.length?`<div class="meta" style="margin-top:8px">${esc(t("rpNever"))}: ${
            never.map(k=>esc(dbLabelOf(k))).join(" · ")}</div>`:""}
          </div>` : `<div class="meta">${esc(t("rpThinNone"))}</div>`}
      </div>
      <div>
        <div class="fld" style="margin-top:0">${esc(t("rpGaps"))}</div>
        ${gaps.length ? gaps.map(i=>{
          const tot=dbTotalOfId(i.training), miss=Math.max(0,tot-(i.filled||0));
          const pct=tot?Math.round((i.filled||0)/tot*100):0;
          return `<div class="row dbrow-l" onclick="openDebrief('${esc(i.training)}')">
            <span class="dbringwrap sm">${dbRing(pct,36,false)}<b class="${pct?"i":"f"}${pct>=100?" full":""}">${pct}<i>%</i></b></span>
            <div class="rowgrow"><div class="nm">${esc(i.code?i.code+" - ":"")}${esc(i.topic)}</div>
              <div class="meta">${miss ? esc(t("rpMissingN",miss))+(i.status==="draft"?" · "+esc(t("dbDraft")):"")
                : esc(t("rpOnlyClose"))}</div></div>
            <button class="btn sm" onclick="event.stopPropagation();openDebrief('${esc(i.training)}')">${esc(t("dbEdit"))}</button>
          </div>`;}).join("") : `<div class="meta">${esc(t("rpGapsNone"))}</div>`}
      </div>
    </div></div></div>`;
}
/* Nenner eines Trainings über seine ID (die Auswertung liefert nur IDs). */

  const tg=S.trainings.find(x=>String(x.id)===String(id));

}

/* ---------- Alle Berichte auf einen Blick ----------
   Jedes Training bekommt hier eine Zeile - auch ohne angelegten Bericht.
   Eine Datenbankzeile entsteht erst beim ersten Speichern, damit keine
   leeren Berichte herumliegen; der Ring steht so lange auf 0 %. */
let rpListFilter="due";
function rpSetList(f){ rpListFilter=f; drawRpList(); }

function rpListRows(){
  const st=tg=>tg.debrief ? tg.debrief.status : "";
  return S.trainings
    .filter(tg=>!S.clientFilter||tg.clientId===S.clientFilter)
    .filter(tg=>{
      if(rpListFilter==="all") return true;
      if(rpListFilter==="due")   return tgIsPast(tg) && st(tg)!=="final";
      if(rpListFilter==="draft") return st(tg)==="draft";
      if(rpListFilter==="final") return st(tg)==="final";
      if(rpListFilter==="soon")  return !tgIsPast(tg);
      return true; })
    .sort((a,b)=>{
      // Zuerst, was fällig ist: gelaufen und noch nicht abgeschlossen
      const rank=x=>(tgIsPast(x)&&(!x.debrief||x.debrief.status!=="final"))?0:(tgIsPast(x)?1:2);
      const d=rank(a)-rank(b); if(d) return d;
      return rank(a)===2 ? String(a.date||"").localeCompare(String(b.date||""))
                         : String(b.date||"").localeCompare(String(a.date||""));
    });
}
function drawRpList(){
  const box=$("#rpList"); if(!box) return;
  const rows=rpListRows();
  const counts={
    all:S.trainings.filter(tg=>!S.clientFilter||tg.clientId===S.clientFilter).length,
    due:0,draft:0,final:0,soon:0};
  S.trainings.filter(tg=>!S.clientFilter||tg.clientId===S.clientFilter).forEach(tg=>{
    const st=tg.debrief?tg.debrief.status:"";
    if(tgIsPast(tg)&&st!=="final") counts.due++;
    if(st==="draft") counts.draft++;
    if(st==="final") counts.final++;
    if(!tgIsPast(tg)) counts.soon++;
  });
  const chips=[["due",t("rpFDue"),counts.due],["draft",t("dbDraft"),counts.draft],
    ["final",t("rpFFinal"),counts.final],["soon",t("rpFSoon"),counts.soon],["all",t("rpFAll"),counts.all]];
  $("#rpListChips").innerHTML=chips.map(([k,lbl,n])=>
    `<button${rpListFilter===k?' class="on"':""} onclick="rpSetList('${k}')">${esc(lbl)} <b>${n}</b></button>`).join("");

  box.innerHTML = rows.length ? rows.map(tg=>{
    const pct=dbPctOf(tg), done=(tg.debrief&&tg.debrief.status==="final");
    const past=tgIsPast(tg);
    const team=dbTeamOf(tg).length;
    return `<div class="row dbrow-l" onclick="openDebrief('${esc(String(tg.id))}')">
      <span class="dbringwrap">${dbRing(pct,38,done)}<b class="${done?"g":pct?"i":"f"}${pct>=100?" full":""}">${pct}<i>%</i></b></span>
      <div class="rowgrow">
        <div class="nm">${esc(tg.code?tg.code+" - ":"")}${esc(tg.topic)}</div>
        <div class="meta">${esc(tg.city||"")}${tg.date?" · "+fmtDate(tg.date):""}
          · ${dbFilledOf(tg)}/${dbTotalOf(tg)}${team?" · "+t("rpTeamN",team):""}</div>
      </div>
      ${done?`<span class="dbbadge ok">${esc(t("dbDone"))}${tg.debrief.overall?" "+dbNum(tg.debrief.overall):""}</span>`
        :tg.debrief?`<span class="dbbadge dr">${esc(t("dbDraft"))}</span>`
        :past?`<span class="dbbadge no">${esc(t("dbMissing"))}</span>`
        :`<span class="dbbadge no">${esc(t("rpNotYet"))}</span>`}
      ${tg.debrief?`<button class="btn sm" title="${esc(t("dbPrint"))}"
        onclick="event.stopPropagation();printDebrief('${esc(String(tg.id))}')">${ic("printer",14)}</button>`:""}
      ${(past||tg.debrief)?`<button class="btn sm${past&&!done?" primary":""}"
        onclick="event.stopPropagation();openDebrief('${esc(String(tg.id))}')">
        ${esc(tg.debrief?t("dbEdit"):t("dbNew"))}</button>`:""}
    </div>`;}).join("") : `<div class="empty">${esc(t("rpListEmpty"))}</div>`;
}

async function rpActDone(id){
  if(LIVE){ try{ await apiCall("debrief.actionDone",{id,done:1}); }catch(e){ toast(e.message,"crit"); return; } }
  else {
    const [tgId,idx]=String(id).split("-");
    const d=(S.debriefs||{})[tgId];
    if(d){ const open=(d.actions||[]).filter(a=>!a.done&&(a.text||"").trim());

/* ---------- CSV: Einzelwerte je Bericht, damit man in Excel weiterrechnen kann ---------- */
async function repCsv(){
  const R=rpState.data; if(!R) return;
  const keys=dbAllKeys();
  const head=[S.lang==="en"?"Code":"Code",S.lang==="en"?"Topic":"Thema",S.lang==="en"?"City":"Ort",
    S.lang==="en"?"Date":"Datum",S.lang==="en"?"Overall":"Gesamt",S.lang==="en"?"Recommend":"Empfehlung",
    S.lang==="en"?"Incidents":"Vorkommnisse", S.lang==="en"?"Status":"Status",
    ...keys.map(k=>dbLabelOf(k))];
  // Einzelwerte je Bericht: im Live-Betrieb einmal nachladen, sonst stünden
  // in der Tabelle nur die Kopfzahlen und man könnte nicht weiterrechnen.
  let src={};
  if(LIVE){
    try{ const d=await apiCall("debriefs.list",{});
      (d.debriefs||[]).forEach(x=>src[String(x.training)]=x); }
    catch(e){ toast(e.message,"crit"); return; }
  } else src=S.debriefs||{};
  const lines=[];
  if(R.withDrafts) lines.push([t("rpProvisional")]);   // steht ganz oben in der Datei
  lines.push(head);
  (R.items||[]).forEach(i=>{
    const d=src[String(i.training)];
    lines.push([i.code,i.topic,i.city,i.date,dbNum(i.overall),i.recommend,i.flags,
      i.status==="draft"?t("dbDraft"):t("rpFFinal"),
      ...keys.map(k=>d&&d.scores&&d.scores[k]!=null?d.scores[k]:"")]);
  });
  // Zusammenfassung unten anhängen - der häufigste Grund, warum man exportiert
  lines.push([]);
  lines.push([S.lang==="en"?"Average":"Durchschnitt","","","",dbNum(R.overall),"","","",
    ...keys.map(k=>{const c=(R.criteria||[]).find(x=>x.key===k); return c?dbNum(c.avg):"";})]);
  const csv="﻿"+lines.map(r=>r.map(c=>{
    const s=String(c==null?"":c);
    return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const {from,to}=rpRange();
  download(`${t("rpExportName")}${R.withDrafts?"-"+t("rpWithDrafts"):""}${from?"-"+from:""}${to?"-"+to:""}.csv`,
    csv,"text/csv;charset=utf-8");
  toast(t("rpCsv"),"good");
}

/* Bericht eines Trainings holen - live vom Server, im Demo aus dem Speicher. */
async function dbFetch(tgId){
  if(LIVE){ const d=await apiCall("debrief.get",{training:tgId}); return d.debrief||null; }
  return (S.debriefs||{})[String(tgId)]||null;
}

/* Ein Bericht als Druckbogen. Aufbau folgt dem Formular, damit man beim
   Gegenlesen nicht suchen muss: Kopf, Gesamturteil, Kriterien je Bereich,
   Trainer, Vorkommnisse, Texte, Maßnahmen. */
function debriefSheet(tg,d){
  const cl=clientOf(tg);
  const val=v=>v>=1&&v<=5 ? `<b class="${dbBand(v)}">${v}</b><i>/5</i>` : `<i>${esc(t("dbNa"))}</i>`;
  const groups=DB_GROUPS.map(g=>{
    const rows=g.items.filter(it=>d.scores&&d.scores[it[0]]);
    if(!rows.length) return "";
    const gv=debriefAvgOf(g.items.map(it=>d.scores[it[0]]).filter(Boolean));
    return `<div class="dsgrp"><h4>${esc(dbGroupLabel(g))}<span>${dbNum(gv)}</span></h4>
      <div class="dskv">${rows.map(it=>`<span class="k">${esc(dbL(it))}</span>
        <span class="v">${val(d.scores[it[0]])}</span>`).join("")}</div></div>`;
  }).join("");
  const trs=Object.entries(d.trainers||{}).map(([tid,tv])=>{
    const tr=S.trainers.find(x=>String(x.id)===String(tid));
    const vals=DB_TRK.map(k=>tv[k[0]]).filter(x=>x>=1);
    return `<tr><td>${esc(tr?tr.name:"#"+tid)}</td>
      <td class="num"><b class="${dbBand(debriefAvgOf(vals))}">${dbNum(debriefAvgOf(vals))}</b></td>
      ${DB_TRK.map(k=>`<td class="num">${tv[k[0]]>=1?tv[k[0]]:"-"}</td>`).join("")}
      <td class="nt">${esc(tv.note||"")}</td></tr>`;}).join("");
  const flags=(d.flags||[]).map(f=>`<span>${esc(dbLabelOf(f))}</span>`).join("");
  const texts=DB_TEXTS.filter(x=>(d.texts||{})[x[0]]).map(x=>
    `<div class="dstx"><b>${esc(dbL(x))}</b><div>${esc(d.texts[x[0]])}</div></div>`).join("");
  const acts=(d.actions||[]).filter(a=>(a.text||"").trim()).map(a=>
    `<li${a.done?' class="done"':""}>${esc(a.text)}<i> - ${a.owner?esc(a.owner):"?"}${a.due?", "+fmtDate(a.due):""}${a.done?" ✓":""}</i></li>`).join("");
  const rec=DB_REC.find(r=>r[0]===d.recommend);
  const tot=dbTotalOf(tg), fil=dbFilledOfObj(d);

  return `<div class="cal-sheet dsheet">
    <div class="ag-top"><div>
      <div class="ag-eyebrow">${esc(t("dbTitle"))}${cl?" · "+esc(cl.name):""}</div>
      <div class="ag-h1">${esc(tg.code?tg.code+" - ":"")}${esc(tg.topic)}</div>
      <div class="meta">${esc(tg.city||"")}${tg.country?", "+esc(tg.country):""} · ${whenLabel(tg)}
        · ${esc(t("dbFilled",fil,tot))}</div></div>
      <span style="color:var(--brand);display:inline-flex">${etafLogo(34)}</span></div>
    <div class="ag-bar"></div>
    ${d.status==="draft"?`<div class="rpprov">${esc(t("dbDraftNote"))}</div>`:""}
    <div class="dstop">
      <div class="dsbig"><span>${esc(t("dbOverall"))}</span>
        <b class="${dbBand(d.overall)}">${d.overall>=1?dbNum(d.overall):"-"}</b><i>/5</i></div>
      <div class="dsrec"><span>${esc(t("dbRecommend"))}</span>
        <b>${rec?esc(dbL(rec)):"-"}</b></div>
    </div>
    ${groups||`<div class="meta">${esc(t("dbUnrated"))}</div>`}
    ${trs?`<div class="ag-h2">${esc(t("dbTrainerHead"))}</div>
      <table class="rptable"><tr><th>${esc(t("dbTrainerHead"))}</th><th style="text-align:right">Ø</th>
        ${DB_TRK.map(k=>`<th style="text-align:right">${esc(dbL(k))}</th>`).join("")}
        <th>${esc(t("dbNoteShort"))}</th></tr>${trs}</table>`:""}
    ${flags?`<div class="ag-h2">${esc(t("dbFlagsShort"))}</div><div class="rpflags">${flags}</div>`:""}
    ${texts?`<div class="ag-h2">${esc(t("dbNotes"))}</div>${texts}`:""}
    ${acts?`<div class="ag-h2">${esc(t("dbActions"))}</div><ul class="rpacts">${acts}</ul>`:""}
    <div class="meta" style="margin-top:14px">ETAF · Trainer-Koordination
      ${d.author?" · "+esc(t("dbAuthor",d.author)):""}
      ${d.updatedAt?" · "+esc(fmtWhen(d.updatedAt)):""}</div>
  </div>`;
}
function debriefAvgOf(a){
  const v=(a||[]).filter(x=>x>=1&&x<=5);
  return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length*100)/100:null;
}

/* Einzelnen Bericht drucken (aus Liste, Formular oder Auswahlfeld). */
async function printDebrief(tgId){
  const tg=S.trainings.find(x=>String(x.id)===String(tgId)); if(!tg) return;
  let d;
  try{ d=await dbFetch(tgId); }catch(e){ toast(e.message,"crit"); return; }
  if(!d || !dbFilledOfObj(d)){ toast(t("dbNothingYet"),"warn"); return; }
  $("#repPrintBody").innerHTML=debriefSheet(tg,d);
  setPageOrient("portrait");
  setSheetTitle(`ETAF ${t("dbTitle")} ${tg.code||""} ${tg.topic}${dateSpan(tg)?" ("+dateSpan(tg)+")":""}`);
  $("#repPrint").classList.add("on");
}

/* Sammelmappe: alle Berichte des gewählten Zeitraums hintereinander -
   praktisch für Quartals- und Jahresdurchsprachen. */
async function printDebriefBatch(){
  const R=rpState.data; if(!R||!R.items||!R.items.length){ toast(t("rpNoData"),"warn"); return; }
  let all={};
  if(LIVE){
    try{ const d=await apiCall("debriefs.list",{});
      (d.debriefs||[]).forEach(x=>all[String(x.training)]=x); }
    catch(e){ toast(e.message,"crit"); return; }
  } else all=S.debriefs||{};
  const sheets=R.items.map(i=>{
    const tg=S.trainings.find(x=>String(x.id)===String(i.training));
    const d=all[String(i.training)];
    return (tg&&d)?debriefSheet(tg,d):"";
  }).filter(Boolean);
  if(!sheets.length){ toast(t("rpNoData"),"warn"); return; }

/* ---------- Weitergabe über das eigene Mailprogramm ----------
   Anhänge kann ein mailto-Link technisch nicht mitgeben (Browser-Grenze).
   Deshalb: Betreff und Text vorbereiten und - wo es einen Token-Link gibt -
   diesen Link mitschicken. Der Empfänger sieht damit immer den aktuellen
   Stand, nicht eine veraltete Datei. */
function mailtoOpen(to,subject,body){
  const u="mailto:"+encodeURIComponent(to||"")
    +"?subject="+encodeURIComponent(subject||"")
    +"&body="+encodeURIComponent(body||"");
  if(u.length>1900) toast(t("mtLong"),"warn");
  // Ein verstecktes <a> statt location.href: so bleibt die Seite garantiert stehen
  const a=document.createElement("a"); a.href=u; a.style.display="none";
  document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500);
}
async function copyText(txt,msg){
  try{ await navigator.clipboard.writeText(txt); toast(msg||t("mtCopied"),"good"); }
  catch(e){ prompt(t("mtCopyManual"),txt); }
}

/* ---------- Textaufbau für die Übergabe ans Mailprogramm ----------
   Reiner Text, der in jedem Mailprogramm gleich aussieht: keine Einrückung
   zum Ausrichten (proportionale Schrift!), sondern Blöcke mit Leerzeilen. */
const MT_LIMIT=1750;               // Zeichen, die eine mailto-Adresse sicher verträgt
function mtHead(title,sub){
  const out=[title, "=".repeat(Math.min(46,Math.max(12,title.length)))];
  if(sub) out.push(sub);
  out.push("");                       // Leerzeile trennt Kopf vom Inhalt
  return out;
}
/* Zeilen anhängen, solange Platz ist. Gibt zurück, wie viele Blöcke fehlen. */
function mtFit(lines,blocks,tail){
  let used=lines.join("\n").length + (tail||"").length, left=0;
  blocks.forEach(bl=>{
    const txt=bl.join("\n");
    if(used+txt.length+2<=MT_LIMIT){ lines.push(txt,""); used+=txt.length+2; }
    else left++;
  });
  return left;
}

function weekToMailClient(){

/* Wandkalender als Terminliste ins eigene Mailprogramm - nach Monaten
   gegliedert und, wenn die Wocheninhalte eingeblendet sind, mit den
   Sessions je Woche. */
function calToMailClient(){
  const list=sortedForCal();
  if(!list.length){ toast(t("mtNothing"),"warn"); return; }
  const cl=activeClient();
  const M=(S.lang==="de"?MONTHS_DE:MONTHS_EN);
  const L=mtHead(t("calTitle")+(cl?" - "+cl.name:""),
    t("mtAsOf",fmtDate(new Date().toISOString().slice(0,10)))+" · "+t("pfTrainings",list.length));
  const blocks=[]; let curMonth="";
  list.forEach(tg=>{
    const d=tg.date?new Date(tg.date+"T00:00:00"):null;
    const mk=d?M[d.getMonth()]+" "+d.getFullYear():"";
    const rows=[];
    if(mk&&mk!==curMonth){ curMonth=mk; rows.push(mk.toUpperCase(),"-".repeat(mk.length)); }
    const r=rosterStats(tg);
    rows.push((tg.code?tg.code+" - ":"")+tg.topic);
    rows.push("  "+fmtDateRange(tg.date,tg.dateEnd,S.lang)+" · "+(tg.city||"")
      +" · "+t("trainersC",r.yes,r.need));
    // Wocheninhalte nur, wenn sie auch auf dem Bogen eingeblendet sind
    if(calDetail && calWeeks){
      const wd=calWeeks[String(tg.id)];
      if(wd && (wd.sessions||[]).length){
        const sess=id=>(wd.sessions||[]).find(x=>String(x.id)===String(id));
        const plan=wd.plan||{}; const seen=new Set();
        WK_DAYS.forEach((dk,i)=>{
          ["am","pm"].forEach(h=>{
            (plan[dk+"_"+h]||[]).forEach(id=>{
              const x=sess(id); if(!x||seen.has(String(id))) return; seen.add(String(id));
              const nm=(x.trainerIds||[]).map(ti=>{const y=S.trainers.find(z=>String(z.id)===String(ti));return y?y.name.replace(/^Dr\.\s*/,""):null;}).filter(Boolean);
              rows.push("  · "+t("day_"+dk).slice(0,2)+" "+t(h==="am"?"wkAMs":"wkPMs")
                +" "+((S.lang==="en"&&x.titleEn)?x.titleEn:x.title)+(nm.length?" - "+nm.join(", "):""));
            });
          });
        });
        const rest=(wd.sessions||[]).filter(x=>!seen.has(String(x.id)));
        if(rest.length) rows.push("  · "+t("wkBench")+": "+rest.map(x=>(S.lang==="en"&&x.titleEn)?x.titleEn:x.title).join(", "));
      }
    }
    blocks.push(rows);
  });
  const tail="\n- ETAF Trainer-Koordination";
  const left=mtFit(L,blocks,tail);
  if(left) L.push(t(calDetail?"mtMoreDetail":"mtMore",left));
  mailtoOpen("", t("calTitle")+(cl?" - "+cl.name:""), L.join("\n")+tail);
}

/* ============================================================
   FOLIEN (POWERPOINTS) - Bedarf, Eingang, Erinnerungen
   Dateien liegen auf dem Webspace; hier steht der Stand je Session:
   wer liefert, bis wann, was ist da. Zaehlt wie der Wochenplan -
   Orga- und Deliverable-Kacheln brauchen keine Folien.
   ============================================================ */
let pptWeeks=null, pptLeadDays=21, pptMaxMb=40, pptFilter="due";

async function pptLoad(force){
  if(pptWeeks && !force) return;
  if(LIVE){
    const d=await apiCall("sessions.all");
    pptWeeks=d.weeks||{}; pptLeadDays=d.pptLeadDays||21; pptMaxMb=d.pptMaxMb||40;
  } else {
    pptWeeks={};
    for(const k in (S.weekData||{})) pptWeeks[k]={...S.weekData[k], template:""};
    pptLeadDays=(S.settings&&S.settings.ppt_lead_days)||21;
  }
}
function pptDueOf(s,tg){
  if(s.pptDue) return s.pptDue;
  if(!tg.date) return "";
  const d=new Date(tg.date+"T00:00:00"); d.setDate(d.getDate()-pptLeadDays);
  return d.toISOString().slice(0,10);
}
function pptRows(){
  const today=new Date().toISOString().slice(0,10);
  const soon=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
  const out=[];
  S.trainings.slice()
    .sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999")))
    .forEach(tg=>{
      const wd=pptWeeks[String(tg.id)];
      if(!wd||!(wd.sessions||[]).length) return;
      const rel=(wd.sessions||[]).filter(wkPptRelevant);
      if(!rel.length) return;
      const rows=rel.map(s=>{
        const due=pptDueOf(s,tg);
        const done=s.ppt==="vorhanden";
        return {s,due,done,
          over: !done && !!due && due<today && (!tg.date||tg.date>=today),
          soon: !done && !!due && due>=today && due<=soon,
          noOwner: !done && !s.pptBy,
          past: !!tg.date && tg.date<today};
      });
      out.push({tg,wd,rows,done:rows.filter(r=>r.done).length,all:rows.length});
    });
  return out;
}
function pptFilterRow(r){
  if(pptFilter==="all") return true;
  if(pptFilter==="done") return r.done;
  if(r.past) return false;                     // Vergangenes nur unter "alle"/"komplett"
  if(pptFilter==="due")  return !r.done && (r.over||r.soon);
  if(pptFilter==="over") return r.over;
  if(pptFilter==="noowner") return r.noOwner;
  return true;
}
function pptSetFilter(f){ pptFilter=f; renderPptView(); }

function pptOwnerOptions(sel){
  return `<option value="">${esc(t("pptNoOwner"))}</option>`+S.trainers.map(x=>
    `<option value="${x.id}"${String(sel||"")===String(x.id)?" selected":""}>${esc(x.name)}</option>`).join("");
}
function pptDueBadge(r){
  if(r.done) return "";
  if(!r.due) return `<span class="meta">-</span>`;
  const days=Math.round((new Date(r.due+"T00:00:00")-new Date(new Date().toISOString().slice(0,10)+"T00:00:00"))/86400000);
  if(r.over) return `<b style="color:var(--crit)">${esc(t("pptOverBy",Math.abs(days)))}</b>`;
  if(r.soon) return `<b style="color:var(--warn)">${esc(t("pptDueIn",days))}</b>`;
  return `<span class="meta">${esc(t("pptDueIn",days))}</span>`;
}

async function renderPptView(){
  const box=$("#v-pptview");
  try{ await pptLoad(); }
  catch(e){ box.innerHTML=`<div class="panel"><div class="panel-b" style="color:var(--crit)">${esc(e.message)}</div></div>`; return; }
  const groups=pptRows();
  const flat=groups.flatMap(g=>g.rows);
  const missing=flat.filter(r=>!r.done&&!r.past).length;
  const over=flat.filter(r=>r.over).length;
  const soon=flat.filter(r=>r.soon&&!r.over).length;
  const noOwner=flat.filter(r=>r.noOwner&&!r.past).length;
  const counts={due:flat.filter(r=>!r.past&&!r.done&&(r.over||r.soon)).length,
    over, noowner:noOwner, all:flat.length, done:flat.filter(r=>r.done).length};

  const kpi=`<div class="kpis">
    <div class="kpi i"><span class="rail"></span><div class="lab">${esc(t("pptKpiMissing"))}</div><div class="val tnum">${missing}</div></div>
    <div class="kpi ${over?"c":"g"}"><span class="rail"></span><div class="lab">${esc(t("pptKpiOver"))}</div><div class="val tnum">${over}</div></div>
    <div class="kpi ${soon?"w":"g"}"><span class="rail"></span><div class="lab">${esc(t("pptKpiSoon"))}</div><div class="val tnum">${soon}</div></div>
    <div class="kpi ${noOwner?"w":"g"}"><span class="rail"></span><div class="lab">${esc(t("pptKpiNoOwner"))}</div><div class="val tnum">${noOwner}</div></div>
  </div>`;

  const chips=[["due",t("pptFDue"),counts.due],["over",t("pptFOver"),counts.over],
    ["noowner",t("pptFNoOwner"),counts.noowner],["done",t("pptFDone"),counts.done],["all",t("pptFAll"),counts.all]];
  const chipbar=`<div class="chips rpchips" style="margin-bottom:14px">${chips.map(([k,lbl,n])=>
    `<button${pptFilter===k?' class="on"':""} onclick="pptSetFilter('${k}')">${esc(lbl)} <b>${n}</b></button>`).join("")}</div>`;

  const blocks=groups.map(g=>{
    const rows=g.rows.filter(pptFilterRow);
    if(!rows.length) return "";
    const pct=g.all?Math.round(g.done/g.all*100):0;
    const tpl=g.wd.template||"";
    return `<div class="panel">
      <div class="panel-h" style="flex-wrap:wrap;gap:8px 12px">
        <h3 style="min-width:0">${esc(g.tg.code?g.tg.code+" - ":"")}${esc(g.tg.topic)}</h3>
        <span class="meta">${g.tg.date?fmtDate(g.tg.date):""}</span>
        <div class="spacer"></div>
        <span class="pptprog"><i style="width:${Math.max(3,pct)}%"></i></span>
        <b class="tnum" style="font-size:13px">${g.done}/${g.all}</b>
        <span class="pill" style="cursor:pointer" onclick="pptTplClick('${g.tg.id}')"
          title="${esc(tpl?t("pptTplHave",tpl):t("pptTplUpload"))}">📎 ${esc(tpl?t("pptTemplate"):t("pptTplNone"))}</span>
        ${LIVE?`<button class="btn sm" onclick="pptRemind('${g.tg.id}',this)">${ic("bell",14)}${esc(t("pptRemind"))}</button>`:""}
      </div>
      <div class="panel-b">
        ${rows.map(r=>pptRowHtml(g.tg,r)).join("")}
      </div>
    </div>`;
  }).filter(Boolean).join("");

  box.innerHTML=kpi+chipbar+(blocks||`<div class="panel"><div class="panel-b"><div class="empty">${esc(t("pptEmpty"))}</div></div></div>`)
    +`<div class="meta" style="margin:4px 2px">${esc(t("pptFoot",pptMaxMb))}</div>`;
}
function pptRowHtml(tg,r){
  const s=r.s;
  const stseg=`<span class="rpseg pptst">${[["",t("pptStOpen")],["inArbeit",t("pptStWork")],["vorhanden",t("pptStDone")]]
    .map(([v,l])=>`<button${(s.ppt||"")===v?` class="on${v==="vorhanden"?" ok":""}"`:""}
      onclick="pptSt('${s.id}','${v}')">${esc(l)}</button>`).join("")}</span>`;
  const file = s.pptFile
    ? `<a href="#" onclick="pptDl('${s.id}');return false" class="pptfile" title="${esc(s.pptFileName||"")}">
        ${ic("down",13)}${esc((s.pptFileName||t("pptDownload")).slice(0,26))}${(s.pptFileName||"").length>26?"…":""}</a>
       <span class="meta tnum">${s.pptFileSize?(s.pptFileSize<1048576?Math.max(1,Math.round(s.pptFileSize/1024))+" KB":Math.round(s.pptFileSize/1048576*10)/10+" MB"):""}</span>
       <button class="btn sm" title="${esc(t("pptFileDel"))}" onclick="pptFileDel('${s.id}')">✕</button>`
    : `<label class="btn sm pptup">${ic("clip",13)}${esc(t("pptUpload"))}

    <span class="pptbadge">${pptDueBadge(r)}</span>
    ${stseg}
    <span class="pptfilecell">${file}</span>
  </div>`;
}

function pptLocal(sid,patch){
  for(const k in pptWeeks){
    const x=(pptWeeks[k].sessions||[]).find(y=>String(y.id)===String(sid));
    if(x){ Object.assign(x,patch);
      if(!LIVE){ const wd=(S.weekData||{})[k];
        const y=wd&&(wd.sessions||[]).find(z=>String(z.id)===String(sid));
        if(y) Object.assign(y,patch); save(); }
      return; }
  }
}

async function pptUp(sid,input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(!LIVE){ toast(t("pptDemo"),"warn"); input.value=""; return; }
  if(f.size>pptMaxMb*1048576){ toast(t("pptTooBig",pptMaxMb),"crit"); input.value=""; return; }
  const fd=new FormData(); fd.append("session",sid); fd.append("file",f);
  try{
    const r=await fetch(API+"/api.php?action=ppt.upload",{method:"POST",headers:{"X-Auth-Token":AUTH},body:fd});
    const d=await r.json();
    if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
    pptLocal(sid,{ppt:"vorhanden",pptFile:"x",pptFileName:f.name,pptFileSize:f.size,pptFileAt:new Date().toISOString()});
    toast(t("pptUpDone"),"good"); renderPptView(); buildNav();
  }catch(e){ toast("Fehler: "+e.message,"crit"); }
  input.value="";
}
async function pptDl(sid){
  try{
    const r=await fetch(API+"/api.php?action=ppt.download",{method:"POST",
      headers:{"Content-Type":"application/json","X-Auth-Token":AUTH},body:JSON.stringify({session:sid})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||("HTTP "+r.status)); }
    const cd=r.headers.get("Content-Disposition")||"";
    const m=cd.match(/filename="([^"]+)"/);
    const blob=await r.blob();
    const u=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=u; a.download=m?m[1]:"folie.pptx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ toast("Fehler: "+e.message,"crit"); }
}

  if(!LIVE){ toast(t("pptDemo"),"warn"); return; }

  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const fd=new FormData(); fd.append("training",tgId); fd.append("file",f);
    try{
      const r=await fetch(API+"/api.php?action=ppt.templateUpload",{method:"POST",headers:{"X-Auth-Token":AUTH},body:fd});
      const d=await r.json(); if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      pptWeeks[String(tgId)].template=f.name;
      toast(t("pptUpDone"),"good"); renderPptView();
    }catch(e){ toast("Fehler: "+e.message,"crit"); }
  };
  inp.click();
}
function pptTplMenu(tgId){
  $("#sheetTitle").textContent=t("pptTemplate");
  const name=pptWeeks[String(tgId)].template||"";
  $("#sheetBody").innerHTML=`<div class="meta" style="margin-bottom:14px">${esc(name)}</div>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" onclick="pptTplDl('${tgId}')">${ic("down",14)}${esc(t("pptDownload"))}</button>
      <button class="btn" onclick="closeSheet();pptTplPick('${tgId}')">${ic("clip",14)}${esc(t("pptReplace"))}</button>
      <button class="btn" onclick="pptTplDel('${tgId}')">✕ ${esc(t("pptFileDel"))}</button>
    </div>`;
  $("#sheetFoot").innerHTML=`<button class="btn" onclick="closeSheet()">${t("cancel")}</button>`;
  openSheet();
}
async function pptTplDl(tgId){
  try{
    const r=await fetch(API+"/api.php?action=ppt.templateDownload",{method:"POST",
      headers:{"Content-Type":"application/json","X-Auth-Token":AUTH},body:JSON.stringify({training:tgId})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||("HTTP "+r.status)); }
    const cd=r.headers.get("Content-Disposition")||""; const m=cd.match(/filename="([^"]+)"/);
    const blob=await r.blob(); const u=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=u; a.download=m?m[1]:"vorlage.pptx";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ toast("Fehler: "+e.message,"crit"); }
}
async function pptTplDel(tgId){
  try{ await apiCall("ppt.templateDelete",{training:tgId});
    pptWeeks[String(tgId)].template="";
    closeSheet(); renderPptView();
  }catch(e){ toast(e.message,"crit"); }
}
async function pptRemind(tgId,btn){
  if(btn){ btn.disabled=true; }
  try{
    const d=await apiCall("ppt.remindNow",{training:tgId});
    toast(t("pptReminded",d.sent||0), d.sent?"good":"warn");
  }catch(e){ toast("Fehler: "+e.message,"crit"); }
  if(btn){ btn.disabled=false; }
}

function openSheet(){$("#scrim").classList.add("on");$("#sheet").classList.add("on");}
function closeSheet(){$("#scrim").classList.remove("on");$("#sheet").classList.remove("on");}
let toastT;
function toast(msg,kind){
  const el=$("#toast");el.textContent=msg;
  el.style.borderLeft=kind?`4px solid var(--${kind==='good'?'good':kind==='crit'?'crit':kind==='warn'?'warn':'brand'})`:"none";
  el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
}

/* Live-Modus: gültiges Login aus dem Browser-Speicher fortsetzen - kein
   erneutes PIN-Eingeben nach „Seite aktualisieren“, und die zuletzt
   geöffnete Ansicht (z. B. ein Training) wird wiederhergestellt. */
(async function resumeSession(){
  if(!LIVE){ showLoginForm(false); return; }
  if(AUTH){
    try{ await pull(); restoreView(); unlock(); markSynced(); return; }
    catch(e){ try{localStorage.removeItem("etaf_token");}catch(_){} AUTH=""; }
  }
  setupLoginMode();          // entscheidet: E-Mail-Anmeldung oder PIN (Ersteinrichtung)
})();
